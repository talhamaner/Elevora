<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certifications | Elevora</title>

<link rel="stylesheet" href="css/style.css">

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>


<body>


<header class="navbar">

<a href="index.html" class="logo">Elevora</a>

<nav class="nav-links">

<a href="index.html">Home</a>
<a href="personal.html">Resume</a>
<a href="preview.html">Preview</a>
<a href="cover-letter.html">Cover Letter</a>

<button id="themeToggle" class="theme-toggle" type="button">🌙</button>

</nav>

</header>


<main class="page-container">


<div class="form-header">

<div class="step-number">7</div>

<div>

<h1>Certifications</h1>

<p>
Add professional certifications and credentials.
</p>

</div>

</div>


<div class="progress-wrapper">

<div class="progress-bar">
<div class="progress-fill" style="width:70%"></div>
</div>

<span>7 of 10</span>

</div>


<div id="entryList" class="entry-list"></div>


<form id="entryForm" class="form-card">


<div class="form-group">

<label>Certification Name</label>

<input id="name" placeholder="Certification name">

</div>


<div class="form-group">

<label>Issuing Organization</label>

<input id="issuer" placeholder="Issuing organization">

</div>


<div class="form-group">

<label>Year</label>

<input id="year" type="number" placeholder="2025">

</div>


<div class="form-group">

<label>Credential Link</label>

<input id="link" type="url" placeholder="https://...">

</div>


<div class="form-actions">

<a href="skills.html" class="btn secondary">
← Back
</a>

<div style="display:flex;gap:10px;">

<button type="button" id="cancelEdit" class="btn secondary" style="display:none">
Cancel
</button>

<button type="submit" id="saveBtn" class="btn primary">
+ Add Certification
</button>

</div>

</div>


<div id="status" class="form-status"></div>

</form>


<div class="form-actions">

<a href="skills.html" class="btn secondary">
← Back
</a>

<a href="languages.html" class="btn primary">
Save & Continue →
</a>

</div>


</main>


<script>

window.MULTI_CONFIG = {

key:"certifications",

addText:"+ Add Certification",

fields:[
{id:"name"},
{id:"issuer"},
{id:"year"},
{id:"link"}
],

title:entry =>
entry.name || "Certification",

meta:entry =>
[
entry.issuer,
entry.year
]
.filter(Boolean)
.join(" • ")

};

</script>

<script src="js/multi.js"></script>

</body>
</html>
