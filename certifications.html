<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Certifications | Elevora</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="theme.js"></script>
  <script src="js/app.js"></script>

</head>

<body>

<header class="navbar">

  <a href="index.html" class="logo">Elevora</a>

  <nav class="nav-links">

    <a href="index.html">Home</a>
    <a href="personal.html" class="active">Resume</a>
    <a href="preview.html">Preview</a>

    <button
      id="themeToggle"
      class="theme-toggle"
      type="button"
    >
      🌙
    </button>

  </nav>

</header>


<main class="builder-wrapper">

  <div class="progress-wrapper">

    <div
      class="progress-bar"
      style="--progress: 64%"
    >
      <div class="progress-fill"></div>
    </div>

    <div class="progress-text">
      <span>Step 7 of 11</span>
      <span>Certifications</span>
    </div>

  </div>


  <div class="page-heading">

    <span class="eyebrow">STEP 07</span>

    <h1>Certifications</h1>

    <p>
      Add certifications, licenses or professional courses.
    </p>

  </div>


  <form id="certificationForm" class="form-card">

    <div
      id="certificationEntries"
      class="entries-container"
    ></div>

    <button
      type="button"
      id="addCertification"
      class="add-entry"
    >
      + Add Certification
    </button>


    <div class="form-actions">

      <a
        href="skills.html"
        class="btn btn-secondary"
      >
        ← Back
      </a>

      <button
        type="submit"
        class="btn btn-primary"
      >
        Save & Continue →
      </button>

    </div>

  </form>

</main>


<script>

document.addEventListener(
  "DOMContentLoaded",
  function () {

    let entries =
      getJSON(
        STORAGE_KEYS.certifications,
        []
      );


    if (!Array.isArray(entries) ||
        !entries.length) {

      entries = [{}];

    }


    const container =
      document.getElementById(
        "certificationEntries"
      );


    function render() {

      container.innerHTML = "";


      entries.forEach(
        function (entry, index) {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "entry-card";


          card.innerHTML = `

            <div class="entry-card-header">

              <h3>
                Certification ${index + 1}
              </h3>

              ${
                index > 0
                ? `
                  <button
                    type="button"
                    class="remove-entry"
                  >
                    Remove
                  </button>
                `
                : ""
              }

            </div>


            <div class="form-grid">

              <div class="form-group">

                <label>
                  Certification Name
                </label>

                <input
                  class="name"
                  type="text"
                  placeholder="e.g. AWS Certified Cloud Practitioner"
                  value="${escapeHTML(entry.name || "")}"
                >

              </div>


              <div class="form-group">

                <label>
                  Issuing Organization
                </label>

                <input
                  class="organization"
                  type="text"
                  placeholder="e.g. Amazon Web Services"
                  value="${escapeHTML(entry.organization || "")}"
                >

              </div>


              <div class="form-group">

                <label>
                  Issue Year
                </label>

                <input
                  class="year"
                  type="number"
                  min="1950"
                  max="2100"
                  placeholder="2025"
                  value="${entry.year || ""}"
                >

              </div>


              <div class="form-group">

                <label>
                  Credential ID
                </label>

                <input
                  class="credentialId"
                  type="text"
                  placeholder="Credential ID"
                  value="${escapeHTML(entry.credentialId || "")}"
                >

              </div>


              <div class="form-group full">

                <label>
                  Credential URL
                </label>

                <input
                  class="url"
                  type="url"
                  placeholder="https://..."
                  value="${escapeHTML(entry.url || "")}"
                >

              </div>

            </div>

          `;


          container.appendChild(card);


          const remove =
            card.querySelector(
              ".remove-entry"
            );


          if (remove) {

            remove.addEventListener(
              "click",
              function () {

                entries.splice(
                  index,
                  1
                );

                render();

              }
            );

          }

        }
      );

    }


    render();


    document
      .getElementById(
        "addCertification"
      )
      .addEventListener(
        "click",
        function () {

          entries.push({});

          render();

        }
      );


    document
      .getElementById(
        "certificationForm"
      )
      .addEventListener(
        "submit",
        function (event) {

          event.preventDefault();


          const result = [];


          container
            .querySelectorAll(
              ".entry-card"
            )
            .forEach(
              function (card) {

                result.push({

                  name:
                    card.querySelector(
                      ".name"
                    ).value.trim(),

                  organization:
                    card.querySelector(
                      ".organization"
                    ).value.trim(),

                  year:
                    card.querySelector(
                      ".year"
                    ).value,

                  credentialId:
                    card.querySelector(
                      ".credentialId"
                    ).value.trim(),

                  url:
                    card.querySelector(
                      ".url"
                    ).value.trim()

                });

              }
            );


          setJSON(
            STORAGE_KEYS.certifications,
            result
          );


          window.location.href =
            "languages.html";

        }
      );

  }
);

</script>

</body>
</html>
