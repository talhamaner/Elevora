<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projects | Elevora</title>

<link rel="stylesheet" href="css/style.css">

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>


<body>


<header class="navbar">

<a href="index.html" class="logo">Elevora</a>

<nav class="nav-links">

<a href="index.html">Home</a>
<a href="personal.html">Resume</a>
<a href="preview.html">Preview</a>
<a href="cover-letter.html">Cover Letter</a>

<button id="themeToggle" class="theme-toggle" type="button">
🌙
</button>

</nav>

</header>


<main class="page-container">


<div class="form-header">

<div class="step-number">5</div>

<div>

<h1>Projects</h1>

<p>
Showcase projects that demonstrate your skills.
</p>

</div>

</div>


<div class="progress-wrapper">

<div class="progress-bar">
<div class="progress-fill" style="width:50%"></div>
</div>

<span>5 of 10</span>

</div>


<div id="entryList" class="entry-list"></div>


<form id="entryForm" class="form-card">


<div class="form-group">

<label>Project Name <span class="required">*</span></label>

<input id="projectName" required placeholder="Project name">

</div>


<div class="form-group">

<label>Technologies</label>

<input id="technologies" placeholder="HTML, CSS, JavaScript">

</div>


<div class="form-group">

<label>Project Link</label>

<input id="link" type="url" placeholder="https://example.com">

</div>


<div class="form-group">

<label>Description</label>

<textarea id="description" placeholder="Describe the project and your contribution..."></textarea>

</div>


<div class="form-actions">

<a href="experience.html" class="btn secondary">
← Back
</a>

<div style="display:flex;gap:10px;">

<button type="button" id="cancelEdit" class="btn secondary" style="display:none">
Cancel
</button>

<button type="submit" id="saveBtn" class="btn primary">
+ Add Project
</button>

</div>

</div>


<div id="status" class="form-status"></div>

</form>


<div class="form-actions">

<a href="experience.html" class="btn secondary">
← Back
</a>

<a href="skills.html" class="btn primary">
Save & Continue →
</a>

</div>


</main>


<script>

window.MULTI_CONFIG = {

key:"projects",

addText:"+ Add Project",

fields:[
{id:"projectName"},
{id:"technologies"},
{id:"link"},
{id:"description"}
],

title:entry =>
entry.projectName || "Project",

meta:entry =>
[
entry.technologies,
entry.link
]
.filter(Boolean)
.join(" • ")

};

</script>

<script src="js/multi.js"></script>

</body>
</html>
