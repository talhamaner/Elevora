<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Projects | Elevora</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="theme.js"></script>
  <script src="js/app.js"></script>

</head>

<body>

<header class="navbar">

  <a href="index.html" class="logo">Elevora</a>

  <nav class="nav-links">

    <a href="index.html">Home</a>
    <a href="personal.html" class="active">Resume</a>
    <a href="preview.html">Preview</a>

    <button
      id="themeToggle"
      class="theme-toggle"
      type="button"
    >
      🌙
    </button>

  </nav>

</header>


<main class="builder-wrapper">

  <div class="progress-wrapper">

    <div
      class="progress-bar"
      style="--progress: 45%"
    >
      <div class="progress-fill"></div>
    </div>

    <div class="progress-text">
      <span>Step 5 of 11</span>
      <span>Projects</span>
    </div>

  </div>


  <div class="page-heading">

    <span class="eyebrow">STEP 05</span>

    <h1>Projects</h1>

    <p>
      Showcase important personal, academic or professional projects.
    </p>

  </div>


  <form id="projectsForm" class="form-card">

    <div
      id="projectEntries"
      class="entries-container"
    ></div>

    <button
      type="button"
      id="addProject"
      class="add-entry"
    >
      + Add Project
    </button>


    <div class="form-actions">

      <a
        href="experience.html"
        class="btn btn-secondary"
      >
        ← Back
      </a>

      <button
        type="submit"
        class="btn btn-primary"
      >
        Save & Continue →
      </button>

    </div>

  </form>

</main>


<script>

document.addEventListener(
  "DOMContentLoaded",
  function () {

    let entries =
      getJSON(
        STORAGE_KEYS.projects,
        []
      );


    if (!Array.isArray(entries) ||
        !entries.length) {

      entries = [{}];

    }


    const container =
      document.getElementById(
        "projectEntries"
      );


    function render() {

      container.innerHTML = "";


      entries.forEach(
        function (entry, index) {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "entry-card";


          card.innerHTML = `

            <div class="entry-card-header">

              <h3>
                Project ${index + 1}
              </h3>

              ${
                index > 0
                ? `
                  <button
                    type="button"
                    class="remove-entry"
                  >
                    Remove
                  </button>
                `
                : ""
              }

            </div>


            <div class="form-grid">

              <div class="form-group">

                <label>
                  Project Name
                  <span class="required">*</span>
                </label>

                <input
                  class="projectName"
                  type="text"
                  placeholder="Project name"
                  value="${escapeHTML(entry.projectName || "")}"
                  required
                >

              </div>


              <div class="form-group">

                <label>
                  Role
                </label>

                <input
                  class="role"
                  type="text"
                  placeholder="e.g. Full Stack Developer"
                  value="${escapeHTML(entry.role || "")}"
                >

              </div>


              <div class="form-group full">

                <label>
                  Technologies / Tools
                </label>

                <input
                  class="technologies"
                  type="text"
                  placeholder="HTML, CSS, JavaScript, React..."
                  value="${escapeHTML(entry.technologies || "")}"
                >

              </div>


              <div class="form-group">

                <label>
                  Project URL
                </label>

                <input
                  class="url"
                  type="url"
                  placeholder="https://..."
                  value="${escapeHTML(entry.url || "")}"
                >

              </div>


              <div class="form-group">

                <label>
                  GitHub URL
                </label>

                <input
                  class="github"
                  type="url"
                  placeholder="https://github.com/..."
                  value="${escapeHTML(entry.github || "")}"
                >

              </div>


              <div class="form-group full">

                <label>
                  Description
                </label>

                <textarea
                  class="description"
                  placeholder="Explain the project, your contribution and results..."
                >${escapeHTML(entry.description || "")}</textarea>

              </div>

            </div>

          `;


          container.appendChild(card);


          const remove =
            card.querySelector(
              ".remove-entry"
            );


          if (remove) {

            remove.addEventListener(
              "click",
              function () {

                entries.splice(
                  index,
                  1
                );

                render();

              }
            );

          }

        }
      );

    }


    render();


    document
      .getElementById(
        "addProject"
      )
      .addEventListener(
        "click",
        function () {

          entries.push({});

          render();

        }
      );


    document
      .getElementById(
        "projectsForm"
      )
      .addEventListener(
        "submit",
        function (event) {

          event.preventDefault();


          const result = [];


          container
            .querySelectorAll(
              ".entry-card"
            )
            .forEach(
              function (card) {

                result.push({

                  projectName:
                    card.querySelector(
                      ".projectName"
                    ).value.trim(),

                  role:
                    card.querySelector(
                      ".role"
                    ).value.trim(),

                  technologies:
                    card.querySelector(
                      ".technologies"
                    ).value.trim(),

                  url:
                    card.querySelector(
                      ".url"
                    ).value.trim(),

                  github:
                    card.querySelector(
                      ".github"
                    ).value.trim(),

                  description:
                    card.querySelector(
                      ".description"
                    ).value.trim()

                });

              }
            );


          setJSON(
            STORAGE_KEYS.projects,
            result
          );


          window.location.href =
            "skills.html";

        }
      );

  }
);

</script>

</body>
</html>
