<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Education | Resume Builder</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="theme.js"></script>

    <style>

        /* =====================================
           EDUCATION PAGE
        ===================================== */

        .education-page {
            max-width: 1050px;
            margin: 0 auto;
            padding: 50px 20px 80px;
        }

        .education-heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .step-circle {
            width: 48px;
            height: 48px;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #4361ee;
            color: white;

            font-size: 18px;
            font-weight: 800;

            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.25);
        }

        .education-heading h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .education-heading p {
            max-width: 650px;
            margin: auto;

            color: #64748b;
            font-size: 16px;
        }


        /* =====================================
           PROGRESS STEPS
        ===================================== */

        .progress {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 0;

            margin-bottom: 40px;
        }

        .progress-step {
            display: flex;
            align-items: center;
        }

        .progress-number {
            width: 34px;
            height: 34px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e2e8f0;
            color: #64748b;

            font-size: 13px;
            font-weight: 700;
        }

        .progress-step.active .progress-number {
            background: #4361ee;
            color: white;
        }

        .progress-line {
            width: 45px;
            height: 2px;
            background: #e2e8f0;
        }

        .progress-step.active + .progress-line {
            background: #4361ee;
        }


        /* =====================================
           EDUCATION CARD
        ===================================== */

        .education-card {
            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 18px;

            padding: 30px;

            margin-bottom: 25px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .education-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;

            margin-bottom: 25px;
        }

        .education-card-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .education-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #eef2ff;

            font-size: 20px;
        }

        .education-card-title h2 {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .education-card-title p {
            color: #64748b;
            font-size: 13px;
        }


        /* =====================================
           FORM
        ===================================== */

        .education-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }

        .education-group {
            display: flex;
            flex-direction: column;

            gap: 7px;
        }

        .education-group.full {
            grid-column: 1 / -1;
        }

        .education-group label {
            font-weight: 700;
            font-size: 14px;
        }

        .required {
            color: #ef4444;
        }

        .education-group input,
        .education-group select,
        .education-group textarea {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d5dbe5;

            border-radius: 9px;

            font-size: 15px;

            font-family: inherit;

            background: white;

            color: #172033;

            outline: none;

            transition: 0.2s;
        }

        .education-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .education-group input:focus,
        .education-group select:focus,
        .education-group textarea:focus {

            border-color: #4361ee;

            box-shadow:
                0 0 0 3px rgba(67, 97, 238, 0.1);
        }


        /* =====================================
           CURRENT STUDENT CHECKBOX
        ===================================== */

        .checkbox-container {

            height: 100%;

            display: flex;

            align-items: center;

            padding-top: 18px;
        }

        .checkbox-container label {

            display: flex;

            align-items: center;

            gap: 9px;

            font-weight: 600;

            cursor: pointer;
        }

        .checkbox-container input {

            width: 17px;
            height: 17px;

            accent-color: #4361ee;

            cursor: pointer;
        }


        /* =====================================
           REMOVE
        ===================================== */

        .remove-education {

            border: none;

            background: #fee2e2;

            color: #b91c1c;

            padding: 9px 14px;

            border-radius: 8px;

            font-weight: 700;

            cursor: pointer;
        }

        .remove-education:hover {
            background: #fecaca;
        }


        /* =====================================
           ADD BUTTON
        ===================================== */

        .add-education {

            width: 100%;

            padding: 16px;

            border-radius: 12px;

            border: 2px dashed #cbd5e1;

            background: transparent;

            color: #4361ee;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .add-education:hover {

            border-color: #4361ee;

            background: #f5f7ff;
        }


        /* =====================================
           ERROR
        ===================================== */

        .form-error {

            display: none;

            color: #dc2626;

            font-size: 12px;
        }


        /* =====================================
           ACTIONS
        ===================================== */

        .education-actions {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 30px;

            gap: 20px;
        }

        .education-actions a,
        .education-actions button {

            min-width: 160px;

            padding: 14px 22px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 700;

            text-align: center;

            text-decoration: none;

            cursor: pointer;
        }

        .back-button {

            background: #e2e8f0;

            color: #172033;

            border: none;
        }

        .continue-button {

            background: #4361ee;

            color: white;

            border: none;

            box-shadow:
                0 8px 20px rgba(67, 97, 238, 0.25);
        }

        .continue-button:hover {

            transform: translateY(-2px);
        }


        /* =====================================
           DARK MODE
        ===================================== */

        html[data-theme="dark"] body {

            background: #0b1120;

            color: #f8fafc;
        }

        html[data-theme="dark"] .navbar {

            background: #111827;

            border-bottom-color: #334155;
        }

        html[data-theme="dark"] .navbar a {

            color: #f8fafc;
        }

        html[data-theme="dark"] .education-heading p {

            color: #94a3b8;
        }

        html[data-theme="dark"] .education-card {

            background: #111827;

            border-color: #334155;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);
        }

        html[data-theme="dark"] .education-card-title p {

            color: #94a3b8;
        }

        html[data-theme="dark"] .education-icon {

            background: #1e293b;
        }

        html[data-theme="dark"] .education-group input,
        html[data-theme="dark"] .education-group select,
        html[data-theme="dark"] .education-group textarea {

            background: #1e293b;

            border-color: #475569;

            color: #f8fafc;
        }

        html[data-theme="dark"] .education-group input::placeholder,
        html[data-theme="dark"] .education-group textarea::placeholder {

            color: #94a3b8;
        }

        html[data-theme="dark"] .add-education {

            border-color: #475569;

            color: #8da2ff;
        }

        html[data-theme="dark"] .add-education:hover {

            background: #172033;

            border-color: #4361ee;
        }

        html[data-theme="dark"] .back-button {

            background: #334155;

            color: #f8fafc;
        }

        html[data-theme="dark"] .progress-number {

            background: #334155;

            color: #94a3b8;
        }

        html[data-theme="dark"] .progress-line {

            background: #334155;
        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 700px) {

            .education-page {

                padding: 35px 15px 60px;
            }

            .education-heading h1 {

                font-size: 30px;
            }

            .progress {

                overflow-x: auto;

                justify-content: flex-start;

                padding: 5px;
            }

            .progress-line {

                min-width: 25px;
            }

            .education-card {

                padding: 20px;
            }

            .education-grid {

                grid-template-columns: 1fr;
            }

            .education-group.full {

                grid-column: auto;
            }

            .education-card-header {

                align-items: flex-start;

                flex-direction: column;
            }

            .remove-education {

                width: 100%;
            }

            .checkbox-container {

                padding-top: 0;
            }

            .education-actions {

                flex-direction: column-reverse;
            }

            .education-actions a,
            .education-actions button {

                width: 100%;
            }
        }

    </style>

</head>


<body>


<!-- =====================================
     NAVBAR
===================================== -->

<header class="navbar">

    <div class="logo">
        Resume Builder
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="personal.html">
            Resume
        </a>

        <a href="preview.html">
            Preview
        </a>

        <button
            id="themeToggle"
            type="button"
            class="theme-toggle"
            aria-label="Switch theme"
            title="Switch theme">

            🌙

        </button>

    </nav>

</header>



<!-- =====================================
     MAIN
===================================== -->

<main class="education-page">


    <!-- PROGRESS -->

    <div class="progress">

        <div class="progress-step active">
            <div class="progress-number">1</div>
        </div>

        <div class="progress-line"></div>

        <div class="progress-step active">
            <div class="progress-number">2</div>
        </div>

        <div class="progress-line"></div>

        <div class="progress-step active">
            <div class="progress-number">3</div>
        </div>

        <div class="progress-line"></div>

        <div class="progress-step">
            <div class="progress-number">4</div>
        </div>

        <div class="progress-line"></div>

        <div class="progress-step">
            <div class="progress-number">5</div>
        </div>

    </div>



    <!-- HEADING -->

    <section class="education-heading">

        <div class="step-circle">
            3
        </div>

        <h1>
            Education
        </h1>

        <p>
            Add your academic qualifications, degrees,
            diplomas, certifications, and other relevant
            educational achievements.
        </p>

    </section>



    <!-- EDUCATION ENTRIES -->

    <div id="educationContainer"></div>



    <!-- ADD -->

    <button
        type="button"
        id="addEducation"
        class="add-education">

        + Add Another Education

    </button>



    <!-- ACTIONS -->

    <div class="education-actions">

        <a
            href="summary.html"
            class="back-button">

            ← Back

        </a>

        <button
            type="button"
            id="continueButton"
            class="continue-button">

            Save & Continue →

        </button>

    </div>


</main>



<script>

    const educationContainer =
        document.getElementById("educationContainer");

    const addEducationButton =
        document.getElementById("addEducation");

    const continueButton =
        document.getElementById("continueButton");


    /* =====================================
       CREATE EDUCATION
    ===================================== */

    function createEducationCard(data = {}) {

        const card =
            document.createElement("div");

        card.className = "education-card";


        card.innerHTML = `

            <div class="education-card-header">

                <div class="education-card-title">

                    <div class="education-icon">
                        🎓
                    </div>

                    <div>

                        <h2>
                            Education Entry
                        </h2>

                        <p>
                            Add one academic qualification
                        </p>

                    </div>

                </div>


                <button
                    type="button"
                    class="remove-education">

                    Remove

                </button>

            </div>


            <div class="education-grid">


                <div class="education-group">

                    <label>
                        Education Level
                        <span class="required">*</span>
                    </label>

                    <select class="education-level">

                        <option value="">
                            Select education level
                        </option>

                        <option value="Secondary School / 10th">
                            Secondary School / 10th
                        </option>

                        <option value="Higher Secondary / 12th">
                            Higher Secondary / 12th
                        </option>

                        <option value="Diploma">
                            Diploma
                        </option>

                        <option value="Associate Degree">
                            Associate Degree
                        </option>

                        <option value="Bachelor's Degree">
                            Bachelor's Degree
                        </option>

                        <option value="Master's Degree">
                            Master's Degree
                        </option>

                        <option value="Doctorate / PhD">
                            Doctorate / PhD
                        </option>

                        <option value="Professional Certification">
                            Professional Certification
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                    <span class="form-error level-error">
                        Please select your education level.
                    </span>

                </div>



                <div class="education-group">

                    <label>
                        Degree / Qualification
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        class="education-degree"
                        placeholder="Example: Bachelor of Computer Applications">

                    <span class="form-error degree-error">
                        Please enter your qualification.
                    </span>

                </div>



                <div class="education-group">

                    <label>
                        Field of Study
                    </label>

                    <input
                        type="text"
                        class="education-field"
                        placeholder="Example: Computer Applications">

                </div>



                <div class="education-group">

                    <label>
                        Institution / University
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        class="education-institution"
                        placeholder="Example: XYZ University">

                    <span class="form-error institution-error">
                        Please enter your institution.
                    </span>

                </div>



                <div class="education-group">

                    <label>
                        Location
                    </label>

                    <input
                        type="text"
                        class="education-location"
                        placeholder="Example: Kolhapur, Maharashtra, India">

                </div>



                <div class="education-group">

                    <label>
                        Start Date
                    </label>

                    <input
                        type="month"
                        class="education-start">

                </div>



                <div class="education-group">

                    <label>
                        End Date
                    </label>

                    <input
                        type="month"
                        class="education-end">

                </div>



                <div class="education-group">

                    <div class="checkbox-container">

                        <label>

                            <input
                                type="checkbox"
                                class="education-current">

                            I am currently studying here

                        </label>

                    </div>

                </div>



                <div class="education-group">

                    <label>
                        Grade Type
                    </label>

                    <select class="education-grade-type">

                        <option value="">
                            Select grade type
                        </option>

                        <option value="CGPA">
                            CGPA
                        </option>

                        <option value="GPA">
                            GPA
                        </option>

                        <option value="Percentage">
                            Percentage
                        </option>

                        <option value="Grade">
                            Grade
                        </option>

                        <option value="Rank">
                            Rank
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>



                <div class="education-group">

                    <label>
                        Grade / Score
                    </label>

                    <input
                        type="text"
                        class="education-grade"
                        placeholder="Example: 8.7 CGPA">

                </div>



                <div class="education-group full">

                    <label>
                        Description / Achievements
                    </label>

                    <textarea
                        class="education-details"
                        placeholder="Mention relevant coursework, academic achievements, projects, awards, activities, or other important information."></textarea>

                </div>

            </div>

        `;


        educationContainer.appendChild(card);


        /* LOAD DATA */

        card.querySelector(".education-level").value =
            data.level || "";

        card.querySelector(".education-degree").value =
            data.degree || "";

        card.querySelector(".education-field").value =
            data.field || "";

        card.querySelector(".education-institution").value =
            data.institution || "";

        card.querySelector(".education-location").value =
            data.location || "";

        card.querySelector(".education-start").value =
            data.startDate || "";

        card.querySelector(".education-end").value =
            data.endDate || "";

        card.querySelector(".education-current").checked =
            data.currentlyStudying || false;

        card.querySelector(".education-grade-type").value =
            data.gradeType || "";

        card.querySelector(".education-grade").value =
            data.grade || "";

        card.querySelector(".education-details").value =
            data.details || "";


        /* CURRENTLY STUDYING */

        const current =
            card.querySelector(".education-current");

        const endDate =
            card.querySelector(".education-end");


        function updateEndDate() {

            if (current.checked) {

                endDate.value = "";

                endDate.disabled = true;

            } else {

                endDate.disabled = false;
            }

        }


        current.addEventListener(
            "change",
            updateEndDate
        );

        updateEndDate();


        /* REMOVE */

        card.querySelector(".remove-education")
            .addEventListener(
                "click",
                function () {

                    const cards =
                        document.querySelectorAll(
                            ".education-card"
                        );

                    if (cards.length === 1) {

                        alert(
                            "Please keep at least one education entry."
                        );

                        return;
                    }

                    card.remove();

                }
            );

    }



    /* =====================================
       LOAD
    ===================================== */

    function loadEducation() {

        let saved = [];

        try {

            saved =
                JSON.parse(
                    localStorage.getItem(
                        "section_education"
                    ) || "[]"
                );

        } catch {

            saved = [];

        }


        if (
            Array.isArray(saved) &&
            saved.length > 0
        ) {

            saved.forEach(
                item =>
                    createEducationCard(item)
            );

        } else {

            createEducationCard();

        }

    }



    /* =====================================
       ADD
    ===================================== */

    addEducationButton.addEventListener(
        "click",
        function () {

            createEducationCard();

            setTimeout(() => {

                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: "smooth"
                });

            }, 100);

        }
    );



    /* =====================================
       VALIDATE
    ===================================== */

    function validateEducation() {

        let valid = true;


        document
            .querySelectorAll(".education-card")
            .forEach(card => {

                const level =
                    card.querySelector(
                        ".education-level"
                    );

                const degree =
                    card.querySelector(
                        ".education-degree"
                    );

                const institution =
                    card.querySelector(
                        ".education-institution"
                    );


                const levelError =
                    card.querySelector(
                        ".level-error"
                    );

                const degreeError =
                    card.querySelector(
                        ".degree-error"
                    );

                const institutionError =
                    card.querySelector(
                        ".institution-error"
                    );


                levelError.style.display = "none";

                degreeError.style.display = "none";

                institutionError.style.display = "none";


                if (!level.value.trim()) {

                    levelError.style.display =
                        "block";

                    valid = false;

                }


                if (!degree.value.trim()) {

                    degreeError.style.display =
                        "block";

                    valid = false;

                }


                if (!institution.value.trim()) {

                    institutionError.style.display =
                        "block";

                    valid = false;

                }

            });


        return valid;

    }



    /* =====================================
       SAVE
    ===================================== */

    function saveEducation() {

        const education = [];


        document
            .querySelectorAll(".education-card")
            .forEach(card => {

                education.push({

                    level:
                        card.querySelector(
                            ".education-level"
                        ).value,

                    degree:
                        card.querySelector(
                            ".education-degree"
                        ).value.trim(),

                    field:
                        card.querySelector(
                            ".education-field"
                        ).value.trim(),

                    institution:
                        card.querySelector(
                            ".education-institution"
                        ).value.trim(),

                    location:
                        card.querySelector(
                            ".education-location"
                        ).value.trim(),

                    startDate:
                        card.querySelector(
                            ".education-start"
                        ).value,

                    endDate:
                        card.querySelector(
                            ".education-end"
                        ).value,

                    currentlyStudying:
                        card.querySelector(
                            ".education-current"
                        ).checked,

                    gradeType:
                        card.querySelector(
                            ".education-grade-type"
                        ).value,

                    grade:
                        card.querySelector(
                            ".education-grade"
                        ).value.trim(),

                    details:
                        card.querySelector(
                            ".education-details"
                        ).value.trim()

                });

            });


        localStorage.setItem(
            "section_education",
            JSON.stringify(education)
        );

    }



    /* =====================================
       CONTINUE
    ===================================== */

    continueButton.addEventListener(
        "click",
        function () {

            if (!validateEducation()) {

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

                return;
            }


            saveEducation();


            window.location.href =
                "experience.html";

        }
    );


    /* START */

    loadEducation();

</script>


</body>

</html>
