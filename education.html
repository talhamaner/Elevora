<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Education | Resume Builder</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <script src="theme.js"></script>

    <style>

        /* =====================================================
           EDUCATION PAGE
        ===================================================== */

        .education-page {

            max-width: 1050px;

            margin: 0 auto;

            padding: 45px 20px 80px;

        }


        /* =====================================================
           PAGE HEADING
        ===================================================== */

        .education-heading {

            text-align: center;

            margin-bottom: 35px;

        }

        .step-circle {

            width: 48px;
            height: 48px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #4361ee;

            color: white;

            font-size: 18px;

            font-weight: 800;

            box-shadow:
                0 8px 20px rgba(67, 97, 238, 0.25);

        }

        .education-heading h1 {

            font-size: 38px;

            margin-bottom: 10px;

        }

        .education-heading p {

            max-width: 680px;

            margin: 0 auto;

            color: #64748b;

            font-size: 16px;

        }


        /* =====================================================
           PROGRESS
        ===================================================== */

        .progress {

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 38px;

        }

        .progress-step {

            display: flex;

            align-items: center;

            justify-content: center;

        }

        .progress-number {

            width: 35px;
            height: 35px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #e2e8f0;

            color: #64748b;

            font-size: 13px;

            font-weight: 700;

        }

        .progress-step.active .progress-number {

            background: #4361ee;

            color: white;

        }

        .progress-line {

            width: 50px;

            height: 2px;

            background: #dbe2ea;

        }


        /* =====================================================
           EDUCATION CARD
        ===================================================== */

        .education-card {

            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 18px;

            padding: 30px;

            margin-bottom: 25px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.05);

        }


        .education-card-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 28px;

        }


        .education-card-title {

            display: flex;

            align-items: center;

            gap: 13px;

        }


        .education-icon {

            width: 44px;
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background: #eef2ff;

            font-size: 21px;

        }


        .education-card-title h2 {

            font-size: 20px;

            margin-bottom: 2px;

        }


        .education-card-title p {

            color: #64748b;

            font-size: 13px;

        }


        /* =====================================================
           FORM GRID
        ===================================================== */

        .education-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 21px;

        }


        .education-group {

            display: flex;

            flex-direction: column;

            gap: 7px;

        }


        .education-group.full {

            grid-column: 1 / -1;

        }


        .education-group label {

            font-size: 14px;

            font-weight: 700;

        }


        .required {

            color: #ef4444;

        }


        .education-group input,
        .education-group select,
        .education-group textarea {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d5dbe5;

            border-radius: 9px;

            background: white;

            color: #172033;

            font-family: inherit;

            font-size: 15px;

            outline: none;

            transition: 0.2s;

        }


        .education-group textarea {

            min-height: 125px;

            resize: vertical;

        }


        .education-group input:focus,
        .education-group select:focus,
        .education-group textarea:focus {

            border-color: #4361ee;

            box-shadow:
                0 0 0 3px rgba(67, 97, 238, 0.1);

        }


        .education-group input:disabled {

            opacity: 0.55;

            cursor: not-allowed;

        }


        /* =====================================================
           YEAR INPUT
        ===================================================== */

        .education-admission-year,
        .education-completion-year {

            letter-spacing: 1px;

        }


        /* Remove number arrows */

        .education-admission-year::-webkit-outer-spin-button,
        .education-admission-year::-webkit-inner-spin-button,
        .education-completion-year::-webkit-outer-spin-button,
        .education-completion-year::-webkit-inner-spin-button {

            -webkit-appearance: none;

            margin: 0;

        }


        .education-admission-year,
        .education-completion-year {

            -moz-appearance: textfield;

        }


        /* =====================================================
           ERROR
        ===================================================== */

        .form-error {

            display: none;

            color: #dc2626;

            font-size: 12px;

        }


        /* =====================================================
           CURRENTLY STUDYING
        ===================================================== */

        .checkbox-container {

            height: 100%;

            display: flex;

            align-items: center;

            padding-top: 21px;

        }


        .checkbox-container label {

            display: flex;

            align-items: center;

            gap: 9px;

            cursor: pointer;

            font-weight: 600;

        }


        .checkbox-container input {

            width: 17px;

            height: 17px;

            accent-color: #4361ee;

            cursor: pointer;

        }


        /* =====================================================
           REMOVE BUTTON
        ===================================================== */

        .remove-education {

            border: none;

            background: #fee2e2;

            color: #b91c1c;

            padding: 10px 16px;

            border-radius: 8px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;

        }


        .remove-education:hover {

            background: #fecaca;

        }


        /* =====================================================
           ADD EDUCATION
        ===================================================== */

        .add-education {

            width: 100%;

            padding: 16px;

            border-radius: 12px;

            border: 2px dashed #cbd5e1;

            background: transparent;

            color: #4361ee;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;

        }


        .add-education:hover {

            border-color: #4361ee;

            background: #f5f7ff;

        }


        /* =====================================================
           BOTTOM ACTIONS
        ===================================================== */

        .education-actions {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-top: 30px;

        }


        .education-actions a,
        .education-actions button {

            min-width: 170px;

            padding: 14px 22px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 700;

            text-align: center;

            text-decoration: none;

            cursor: pointer;

            transition: 0.2s;

        }


        .back-button {

            background: #e2e8f0;

            color: #172033;

            border: none;

        }


        .back-button:hover {

            background: #cbd5e1;

        }


        .continue-button {

            background: #4361ee;

            color: white;

            border: none;

            box-shadow:
                0 8px 20px rgba(67, 97, 238, 0.25);

        }


        .continue-button:hover {

            transform: translateY(-2px);

        }


        /* =====================================================
           DARK MODE
        ===================================================== */

        html[data-theme="dark"] body {

            background: #0b1120;

            color: #f8fafc;

        }


        html[data-theme="dark"] .navbar {

            background: #111827;

            border-bottom-color: #334155;

        }


        html[data-theme="dark"] .navbar .logo {

            color: #f8fafc;

        }


        html[data-theme="dark"] .navbar nav a {

            color: #f8fafc;

        }


        html[data-theme="dark"] .navbar nav a:hover {

            color: #8da2ff;

        }


        html[data-theme="dark"] .education-heading p {

            color: #94a3b8;

        }


        html[data-theme="dark"] .education-card {

            background: #111827;

            border-color: #334155;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.3);

        }


        html[data-theme="dark"] .education-card-title p {

            color: #94a3b8;

        }


        html[data-theme="dark"] .education-icon {

            background: #1e293b;

        }


        html[data-theme="dark"] .education-group input,
        html[data-theme="dark"] .education-group select,
        html[data-theme="dark"] .education-group textarea {

            background: #1e293b;

            border-color: #475569;

            color: #f8fafc;

        }


        html[data-theme="dark"] .education-group input::placeholder,
        html[data-theme="dark"] .education-group textarea::placeholder {

            color: #94a3b8;

        }


        html[data-theme="dark"] .education-group select option {

            background: #1e293b;

            color: #f8fafc;

        }


        html[data-theme="dark"] .add-education {

            border-color: #475569;

            color: #8da2ff;

        }


        html[data-theme="dark"] .add-education:hover {

            background: #172033;

            border-color: #4361ee;

        }


        html[data-theme="dark"] .back-button {

            background: #334155;

            color: #f8fafc;

        }


        html[data-theme="dark"] .back-button:hover {

            background: #475569;

        }


        html[data-theme="dark"] .progress-number {

            background: #334155;

            color: #94a3b8;

        }


        html[data-theme="dark"] .progress-line {

            background: #334155;

        }


        html[data-theme="dark"] .remove-education {

            background: #451a1a;

            color: #fca5a5;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .education-page {

                padding:
                    35px 15px 60px;

            }


            .education-heading h1 {

                font-size: 30px;

            }


            .progress {

                overflow-x: auto;

                justify-content: flex-start;

                padding: 5px;

            }


            .progress-line {

                width: 25px;

                min-width: 25px;

            }


            .education-card {

                padding: 20px;

            }


            .education-grid {

                grid-template-columns: 1fr;

            }


            .education-group.full {

                grid-column: auto;

            }


            .education-card-header {

                align-items: flex-start;

                flex-direction: column;

            }


            .remove-education {

                width: 100%;

            }


            .checkbox-container {

                padding-top: 0;

            }


            .education-actions {

                flex-direction: column-reverse;

            }


            .education-actions a,
            .education-actions button {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="navbar">

    <div class="logo">
        Resume Builder
    </div>


    <nav class="builder-nav">

        <a href="index.html">
            Home
        </a>

        <a href="personal.html">
            Resume
        </a>

        <a href="preview.html">
            Preview
        </a>


        <button
            id="themeToggle"
            type="button"
            class="theme-toggle"
            aria-label="Switch theme"
            title="Switch theme">

            🌙

        </button>

    </nav>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="education-page">


    <!-- =================================================
         PROGRESS
    ================================================== -->

    <div class="progress">

        <div class="progress-step active">

            <div class="progress-number">
                1
            </div>

        </div>


        <div class="progress-line"></div>


        <div class="progress-step active">

            <div class="progress-number">
                2
            </div>

        </div>


        <div class="progress-line"></div>


        <div class="progress-step active">

            <div class="progress-number">
                3
            </div>

        </div>


        <div class="progress-line"></div>


        <div class="progress-step">

            <div class="progress-number">
                4
            </div>

        </div>


        <div class="progress-line"></div>


        <div class="progress-step">

            <div class="progress-number">
                5
            </div>

        </div>

    </div>



    <!-- =================================================
         HEADING
    ================================================== -->

    <section class="education-heading">

        <div class="step-circle">
            3
        </div>


        <h1>
            Education
        </h1>


        <p>
            Add your academic qualifications, degrees,
            diplomas, and other important educational
            achievements.
        </p>

    </section>



    <!-- =================================================
         EDUCATION CONTAINER
    ================================================== -->

    <div id="educationContainer"></div>



    <!-- =================================================
         ADD EDUCATION
    ================================================== -->

    <button
        type="button"
        id="addEducation"
        class="add-education">

        + Add Another Education

    </button>



    <!-- =================================================
         ACTIONS
    ================================================== -->

    <div class="education-actions">

        <a
            href="summary.html"
            class="back-button">

            ← Back

        </a>


        <button
            type="button"
            id="continueButton"
            class="continue-button">

            Save &amp; Continue →

        </button>

    </div>


</main>



<script>

    const educationContainer =
        document.getElementById(
            "educationContainer"
        );


    const addEducationButton =
        document.getElementById(
            "addEducation"
        );


    const continueButton =
        document.getElementById(
            "continueButton"
        );



    /* =====================================================
       CREATE EDUCATION CARD
    ===================================================== */

    function createEducationCard(data = {}) {

        const card =
            document.createElement("div");


        card.className =
            "education-card";


        card.innerHTML = `

            <div class="education-card-header">

                <div class="education-card-title">

                    <div class="education-icon">
                        🎓
                    </div>

                    <div>

                        <h2>
                            Education Entry
                        </h2>

                        <p>
                            Add one academic qualification
                        </p>

                    </div>

                </div>


                <button
                    type="button"
                    class="remove-education">

                    Remove

                </button>

            </div>


            <div class="education-grid">


                <!-- EDUCATION LEVEL -->

                <div class="education-group">

                    <label>

                        Education Level

                        <span class="required">
                            *
                        </span>

                    </label>


                    <select class="education-level">

                        <option value="">
                            Select education level
                        </option>

                        <option value="Secondary School / 10th">
                            Secondary School / 10th
                        </option>

                        <option value="Higher Secondary / 12th">
                            Higher Secondary / 12th
                        </option>

                        <option value="Diploma">
                            Diploma
                        </option>

                        <option value="Associate Degree">
                            Associate Degree
                        </option>

                        <option value="Bachelor's Degree">
                            Bachelor's Degree
                        </option>

                        <option value="Master's Degree">
                            Master's Degree
                        </option>

                        <option value="Doctorate / PhD">
                            Doctorate / PhD
                        </option>

                        <option value="Professional Certification">
                            Professional Certification
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>


                    <span class="form-error level-error">

                        Please select your education level.

                    </span>

                </div>



                <!-- DEGREE -->

                <div class="education-group">

                    <label>

                        Degree / Qualification

                        <span class="required">
                            *
                        </span>

                    </label>


                    <input
                        type="text"
                        class="education-degree"
                        placeholder="Example: Bachelor of Computer Applications"
                    >


                    <span class="form-error degree-error">

                        Please enter your qualification.

                    </span>

                </div>



                <!-- FIELD -->

                <div class="education-group">

                    <label>
                        Field of Study
                    </label>


                    <input
                        type="text"
                        class="education-field"
                        placeholder="Example: Computer Applications"
                    >

                </div>



                <!-- INSTITUTION -->

                <div class="education-group">

                    <label>

                        Institution / University

                        <span class="required">
                            *
                        </span>

                    </label>


                    <input
                        type="text"
                        class="education-institution"
                        placeholder="Example: XYZ University"
                    >


                    <span class="form-error institution-error">

                        Please enter your institution.

                    </span>

                </div>



                <!-- LOCATION -->

                <div class="education-group">

                    <label>
                        Location
                    </label>


                    <input
                        type="text"
                        class="education-location"
                        placeholder="Example: Kolhapur, Maharashtra, India"
                    >

                </div>



                <!-- ADMISSION YEAR -->

                <div class="education-group">

                    <label>

                        Admission Year

                        <span class="required">
                            *
                        </span>

                    </label>


                    <input
                        type="number"
                        class="education-admission-year"
                        placeholder="Example: 2022"
                        min="1950"
                        max="2100"
                        inputmode="numeric"
                    >


                    <span class="form-error admission-year-error">

                        Please enter a valid admission year.

                    </span>

                </div>



                <!-- COMPLETION YEAR -->

                <div class="education-group">

                    <label>
                        Pass Out / Completed Year
                    </label>


                    <input
                        type="number"
                        class="education-completion-year"
                        placeholder="Example: 2026"
                        min="1950"
                        max="2100"
                        inputmode="numeric"
                    >

                </div>



                <!-- CURRENTLY STUDYING -->

                <div class="education-group">

                    <div class="checkbox-container">

                        <label>

                            <input
                                type="checkbox"
                                class="education-current"
                            >

                            I am currently studying here

                        </label>

                    </div>

                </div>



                <!-- GRADE TYPE -->

                <div class="education-group">

                    <label>
                        Grade Type
                    </label>


                    <select class="education-grade-type">

                        <option value="">
                            Select grade type
                        </option>

                        <option value="CGPA">
                            CGPA
                        </option>

                        <option value="GPA">
                            GPA
                        </option>

                        <option value="Percentage">
                            Percentage
                        </option>

                        <option value="Grade">
                            Grade
                        </option>

                        <option value="Rank">
                            Rank
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>



                <!-- GRADE -->

                <div class="education-group">

                    <label>
                        Grade / Score
                    </label>


                    <input
                        type="text"
                        class="education-grade"
                        placeholder="Example: 8.7 CGPA"
                    >

                </div>



                <!-- DETAILS -->

                <div class="education-group full">

                    <label>
                        Description / Achievements
                    </label>


                    <textarea
                        class="education-details"
                        placeholder="Mention relevant coursework, academic achievements, projects, awards, activities, or other important information."
                    ></textarea>

                </div>

            </div>

        `;


        educationContainer.appendChild(card);



        /* =================================================
           LOAD SAVED DATA
        ================================================= */

        card.querySelector(
            ".education-level"
        ).value =
            data.level || "";


        card.querySelector(
            ".education-degree"
        ).value =
            data.degree || "";


        card.querySelector(
            ".education-field"
        ).value =
            data.field || "";


        card.querySelector(
            ".education-institution"
        ).value =
            data.institution || "";


        card.querySelector(
            ".education-location"
        ).value =
            data.location || "";


        card.querySelector(
            ".education-admission-year"
        ).value =
            data.admissionYear || "";


        card.querySelector(
            ".education-completion-year"
        ).value =
            data.completionYear || "";


        card.querySelector(
            ".education-current"
        ).checked =
            data.currentlyStudying || false;


        card.querySelector(
            ".education-grade-type"
        ).value =
            data.gradeType || "";


        card.querySelector(
            ".education-grade"
        ).value =
            data.grade || "";


        card.querySelector(
            ".education-details"
        ).value =
            data.details || "";



        /* =================================================
           CURRENTLY STUDYING
        ================================================= */

        const currentCheckbox =
            card.querySelector(
                ".education-current"
            );


        const completionYear =
            card.querySelector(
                ".education-completion-year"
            );


        function updateCompletionYear() {

            if (currentCheckbox.checked) {

                completionYear.value = "";

                completionYear.disabled = true;

            } else {

                completionYear.disabled = false;

            }

        }


        currentCheckbox.addEventListener(
            "change",
            updateCompletionYear
        );


        updateCompletionYear();



        /* =================================================
           REMOVE
        ================================================= */

        card.querySelector(
            ".remove-education"
        ).addEventListener(
            "click",
            function () {

                const cards =
                    document.querySelectorAll(
                        ".education-card"
                    );


                if (cards.length === 1) {

                    alert(
                        "Please keep at least one education entry."
                    );

                    return;

                }


                card.remove();

            }
        );

    }



    /* =====================================================
       LOAD EDUCATION
    ===================================================== */

    function loadEducation() {

        let saved = [];


        try {

            saved =
                JSON.parse(
                    localStorage.getItem(
                        "section_education"
                    ) || "[]"
                );

        } catch (error) {

            saved = [];

        }


        if (
            Array.isArray(saved) &&
            saved.length > 0
        ) {

            saved.forEach(
                function (item) {

                    createEducationCard(item);

                }
            );

        } else {

            createEducationCard();

        }

    }



    /* =====================================================
       ADD EDUCATION
    ===================================================== */

    addEducationButton.addEventListener(
        "click",
        function () {

            createEducationCard();


            setTimeout(
                function () {

                    window.scrollTo({

                        top:
                            document.body.scrollHeight,

                        behavior:
                            "smooth"

                    });

                },
                100
            );

        }
    );



    /* =====================================================
       VALIDATE
    ===================================================== */

    function validateEducation() {

        let valid = true;


        document
            .querySelectorAll(
                ".education-card"
            )
            .forEach(
                function (card) {


                    const level =
                        card.querySelector(
                            ".education-level"
                        );


                    const degree =
                        card.querySelector(
                            ".education-degree"
                        );


                    const institution =
                        card.querySelector(
                            ".education-institution"
                        );


                    const admissionYear =
                        card.querySelector(
                            ".education-admission-year"
                        );


                    const levelError =
                        card.querySelector(
                            ".level-error"
                        );


                    const degreeError =
                        card.querySelector(
                            ".degree-error"
                        );


                    const institutionError =
                        card.querySelector(
                            ".institution-error"
                        );


                    const admissionYearError =
                        card.querySelector(
                            ".admission-year-error"
                        );



                    levelError.style.display =
                        "none";


                    degreeError.style.display =
                        "none";


                    institutionError.style.display =
                        "none";


                    admissionYearError.style.display =
                        "none";



                    /* EDUCATION LEVEL */

                    if (
                        !level.value.trim()
                    ) {

                        levelError.style.display =
                            "block";

                        valid = false;

                    }



                    /* DEGREE */

                    if (
                        !degree.value.trim()
                    ) {

                        degreeError.style.display =
                            "block";

                        valid = false;

                    }



                    /* INSTITUTION */

                    if (
                        !institution.value.trim()
                    ) {

                        institutionError.style.display =
                            "block";

                        valid = false;

                    }



                    /* ADMISSION YEAR */

                    const year =
                        Number(
                            admissionYear.value
                        );


                    if (
                        !admissionYear.value ||
                        year < 1950 ||
                        year > 2100 ||
                        String(year).length !== 4
                    ) {

                        admissionYearError.style.display =
                            "block";

                        valid = false;

                    }

                }
            );


        return valid;

    }



    /* =====================================================
       SAVE EDUCATION
    ===================================================== */

    function saveEducation() {

        const education = [];


        document
            .querySelectorAll(
                ".education-card"
            )
            .forEach(
                function (card) {


                    const admissionYear =
                        card.querySelector(
                            ".education-admission-year"
                        ).value;


                    const completionYear =
                        card.querySelector(
                            ".education-completion-year"
                        ).value;


                    education.push({

                        level:
                            card.querySelector(
                                ".education-level"
                            ).value,


                        degree:
                            card.querySelector(
                                ".education-degree"
                            ).value.trim(),


                        field:
                            card.querySelector(
                                ".education-field"
                            ).value.trim(),


                        institution:
                            card.querySelector(
                                ".education-institution"
                            ).value.trim(),


                        location:
                            card.querySelector(
                                ".education-location"
                            ).value.trim(),


                        admissionYear:
                            admissionYear,


                        completionYear:
                            completionYear,


                        currentlyStudying:
                            card.querySelector(
                                ".education-current"
                            ).checked,


                        gradeType:
                            card.querySelector(
                                ".education-grade-type"
                            ).value,


                        grade:
                            card.querySelector(
                                ".education-grade"
                            ).value.trim(),


                        details:
                            card.querySelector(
                                ".education-details"
                            ).value.trim()

                    });

                }
            );


        localStorage.setItem(
            "section_education",
            JSON.stringify(education)
        );

    }



    /* =====================================================
       CONTINUE
    ===================================================== */

    continueButton.addEventListener(
        "click",
        function () {


            if (!validateEducation()) {

                const firstError =
                    document.querySelector(
                        ".form-error[style*='block']"
                    );


                if (firstError) {

                    firstError
                        .closest(".education-card")
                        .scrollIntoView({
                            behavior: "smooth",
                            block: "center"
                        });

                }

                return;

            }


            saveEducation();


            window.location.href =
                "experience.html";

        }
    );



    /* =====================================================
       START PAGE
    ===================================================== */

    loadEducation();

</script>


</body>

</html>
