<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Education - Elevora</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="theme.js"></script>
  <script src="js/app.js"></script>
</head>

<body>

<header class="navbar">

  <a class="logo" href="index.html">
    Elevora
  </a>

  <nav class="nav-links">

    <a href="index.html">Home</a>

    <a href="personal.html">Resume</a>

    <a href="preview.html">Preview</a>

    <a href="cover-letter.html">
      Cover Letter
    </a>

    <button
      id="themeToggle"
      class="theme-toggle"
      type="button">
      🌙
    </button>

  </nav>

</header>


<main class="container">

  <div class="page-head">

    <h1>Education</h1>

    <p>
      Add multiple education records.
      Your previous education will never be replaced.
    </p>

  </div>


  <div class="builder">

    <aside class="steps">

      <a href="personal.html">
        1. Personal
      </a>

      <a href="summary.html">
        2. Summary
      </a>

      <a href="education.html">
        3. Education
      </a>

      <a href="experience.html">
        4. Experience
      </a>

      <a href="projects.html">
        5. Projects
      </a>

      <a href="skills.html">
        6. Skills
      </a>

      <a href="certifications.html">
        7. Certifications
      </a>

      <a href="languages.html">
        8. Languages
      </a>

      <a href="achievements.html">
        9. Achievements
      </a>

      <a href="preview.html">
        10. Preview
      </a>

    </aside>


    <section class="form-card">

      <div id="entryList" class="entry-list"></div>


      <form id="entryForm">

        <div class="form-grid">

          <div class="form-group">

            <label>
              Institution / University
              <span class="required">*</span>
            </label>

            <input
              id="institution"
              required
              placeholder="Example University">

          </div>


          <div class="form-group">

            <label>
              Degree
              <span class="required">*</span>
            </label>

            <input
              id="degree"
              required
              placeholder="Bachelor of Technology">

          </div>


          <div class="form-group">

            <label>
              Field of Study
            </label>

            <input
              id="field"
              placeholder="Computer Science">

          </div>


          <div class="form-group">

            <label>
              Admission Year
            </label>

            <input
              id="admissionYear"
              type="number"
              min="1900"
              max="2100"
              placeholder="2021">

          </div>


          <div class="form-group">

            <label>
              Pass Out / Completed Year
            </label>

            <input
              id="completedYear"
              type="number"
              min="1900"
              max="2100"
              placeholder="2025">

          </div>


          <div class="form-group">

            <label>
              Grade / CGPA
            </label>

            <input
              id="grade"
              placeholder="8.6 / 10">

          </div>


          <div class="form-group">

            <label class="checkbox">

              <input
                id="currentlyStudying"
                type="checkbox">

              Currently Studying

            </label>

          </div>


          <div class="form-group full">

            <label>
              Description
            </label>

            <textarea
              id="description"
              placeholder="Relevant coursework, activities, achievements, etc.">
            </textarea>

          </div>

        </div>


        <div class="actions">

          <button
            type="button"
            id="cancelEdit"
            class="btn secondary"
            style="display:none">

            Cancel Edit

          </button>


          <button
            id="saveBtn"
            class="btn"
            type="submit">

            + Add Education

          </button>

        </div>


        <div
          id="status"
          class="status">
        </div>

      </form>


      <div class="actions">

        <a
          class="btn secondary"
          href="summary.html">

          ← Back

        </a>


        <a
          class="btn"
          href="experience.html">

          Save & Continue →

        </a>

      </div>

    </section>

  </div>

</main>


<script>

window.MULTI_CONFIG = {

  key: "education",

  addText: "+ Add Education",

  fields: [

    {
      id: "institution"
    },

    {
      id: "degree"
    },

    {
      id: "field"
    },

    {
      id: "admissionYear"
    },

    {
      id: "completedYear"
    },

    {
      id: "grade"
    },

    {
      id: "currentlyStudying",
      type: "checkbox"
    },

    {
      id: "description",
      type: "textarea"
    }

  ],

  title: function(entry) {

    return entry.degree ||
           entry.institution ||
           "Education";

  },

  meta: function(entry) {

    return [

      entry.institution,

      entry.field,

      entry.admissionYear,

      entry.currentlyStudying
        ? "Currently Studying"
        : entry.completedYear,

      entry.grade

    ]
    .filter(Boolean)
    .join(" • ");

  }

};

</script>

<script src="js/multi.js"></script>

</body>
</html>
