<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Education | Elevora</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="theme.js"></script>
  <script src="js/app.js"></script>

</head>

<body>

<header class="navbar">

  <a href="index.html" class="logo">Elevora</a>

  <nav class="nav-links">

    <a href="index.html">Home</a>
    <a href="personal.html" class="active">Resume</a>
    <a href="preview.html">Preview</a>

    <button
      id="themeToggle"
      class="theme-toggle"
      type="button"
    >
      🌙
    </button>

  </nav>

</header>


<main class="builder-wrapper">

  <div class="progress-wrapper">

    <div
      class="progress-bar"
      style="--progress: 27%"
    >
      <div class="progress-fill"></div>
    </div>

    <div class="progress-text">
      <span>Step 3 of 11</span>
      <span>Education</span>
    </div>

  </div>


  <div class="page-heading">

    <span class="eyebrow">STEP 03</span>

    <h1>Education</h1>

    <p>
      Add one or more educational qualifications.
    </p>

  </div>


  <form id="educationForm" class="form-card">

    <div id="educationEntries" class="entries-container"></div>

    <button
      type="button"
      id="addEducation"
      class="add-entry"
    >
      + Add Education
    </button>


    <div class="form-actions">

      <a
        href="summary.html"
        class="btn btn-secondary"
      >
        ← Back
      </a>

      <button
        type="submit"
        class="btn btn-primary"
      >
        Save & Continue →
      </button>

    </div>

  </form>

</main>


<script>

document.addEventListener(
  "DOMContentLoaded",
  function () {

    const container =
      document.getElementById(
        "educationEntries"
      );


    let entries =
      getJSON(
        STORAGE_KEYS.education,
        []
      );


    if (!Array.isArray(entries) ||
        !entries.length) {

      entries = [{}];

    }


    function years() {

      const current =
        new Date().getFullYear();

      let html =
        '<option value="">Select year</option>';

      for (
        let year = current + 5;
        year >= 1950;
        year--
      ) {

        html +=
          `<option value="${year}">
            ${year}
          </option>`;

      }

      return html;

    }


    function render() {

      container.innerHTML = "";


      entries.forEach(
        function (entry, index) {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "entry-card";


          card.innerHTML = `

            <div class="entry-card-header">

              <h3>
                Education ${index + 1}
              </h3>

              ${
                index > 0
                ? `
                  <button
                    type="button"
                    class="remove-entry"
                    data-index="${index}"
                  >
                    Remove
                  </button>
                `
                : ""
              }

            </div>


            <div class="form-grid">

              <div class="form-group">

                <label>
                  Degree / Qualification
                  <span class="required">*</span>
                </label>

                <input
                  class="degree"
                  type="text"
                  placeholder="e.g. Bachelor of Technology"
                  value="${escapeHTML(entry.degree || "")}"
                  required
                >

              </div>


              <div class="form-group">

                <label>
                  Field of Study
                </label>

                <input
                  class="field"
                  type="text"
                  placeholder="e.g. Computer Science"
                  value="${escapeHTML(entry.field || "")}"
                >

              </div>


              <div class="form-group full">

                <label>
                  Institution / University
                  <span class="required">*</span>
                </label>

                <input
                  class="institution"
                  type="text"
                  placeholder="Enter institution name"
                  value="${escapeHTML(entry.institution || "")}"
                  required
                >

              </div>


              <div class="form-group">

                <label>
                  Admission Year
                </label>

                <select class="admissionYear">

                  ${years()}

                </select>

              </div>


              <div class="form-group">

                <label>
                  Pass Out / Completed
                </label>

                <select class="completionYear">

                  ${years()}

                </select>

              </div>


              <div class="form-group">

                <label>
                  Grade / CGPA / Percentage
                </label>

                <input
                  class="grade"
                  type="text"
                  placeholder="e.g. 8.5 CGPA"
                  value="${escapeHTML(entry.grade || "")}"
                >

              </div>


              <div class="form-group">

                <label>
                  Location
                </label>

                <input
                  class="location"
                  type="text"
                  placeholder="City, Country"
                  value="${escapeHTML(entry.location || "")}"
                >

              </div>


              <div class="form-group full">

                <label class="checkbox-row">

                  <input
                    class="currentlyStudying"
                    type="checkbox"
                    ${entry.currentlyStudying ? "checked" : ""}
                  >

                  <span>
                    I am currently studying here
                  </span>

                </label>

              </div>


              <div class="form-group full">

                <label>
                  Description
                </label>

                <textarea
                  class="description"
                  placeholder="Relevant coursework, achievements, activities..."
                >${escapeHTML(entry.description || "")}</textarea>

              </div>

            </div>

          `;


          container.appendChild(card);


          card.querySelector(
            ".admissionYear"
          ).value =
            entry.admissionYear || "";


          card.querySelector(
            ".completionYear"
          ).value =
            entry.completionYear || "";


          const currentCheckbox =
            card.querySelector(
              ".currentlyStudying"
            );

          const completion =
            card.querySelector(
              ".completionYear"
            );


          function updateCompletion() {

            completion.disabled =
              currentCheckbox.checked;

            if (currentCheckbox.checked) {
              completion.value = "";
            }

          }


          currentCheckbox.addEventListener(
            "change",
            updateCompletion
          );


          updateCompletion();

        }
      );


      container
        .querySelectorAll(
          ".remove-entry"
        )
        .forEach(
          function (button) {

            button.addEventListener(
              "click",
              function () {

                const index =
                  Number(
                    button.dataset.index
                  );

                entries.splice(
                  index,
                  1
                );

                render();

              }
            );

          }
        );

    }


    render();


    document
      .getElementById("addEducation")
      .addEventListener(
        "click",
        function () {

          entries.push({});

          render();

          window.scrollTo({
            top:
              document.body.scrollHeight,
            behavior: "smooth"
          });

        }
      );


    document
      .getElementById("educationForm")
      .addEventListener(
        "submit",
        function (event) {

          event.preventDefault();


          const cards =
            container.querySelectorAll(
              ".entry-card"
            );


          const result = [];


          cards.forEach(
            function (card) {

              result.push({

                degree:
                  card.querySelector(
                    ".degree"
                  ).value.trim(),

                field:
                  card.querySelector(
                    ".field"
                  ).value.trim(),

                institution:
                  card.querySelector(
                    ".institution"
                  ).value.trim(),

                admissionYear:
                  card.querySelector(
                    ".admissionYear"
                  ).value,

                completionYear:
                  card.querySelector(
                    ".completionYear"
                  ).value,

                currentlyStudying:
                  card.querySelector(
                    ".currentlyStudying"
                  ).checked,

                grade:
                  card.querySelector(
                    ".grade"
                  ).value.trim(),

                location:
                  card.querySelector(
                    ".location"
                  ).value.trim(),

                description:
                  card.querySelector(
                    ".description"
                  ).value.trim()

              });

            }
          );


          setJSON(
            STORAGE_KEYS.education,
            result
          );


          window.location.href =
            "experience.html";

        }
      );

  }
);

</script>

</body>
</html>
