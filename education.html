<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Education | Elevora</title>

<link rel="stylesheet" href="css/style.css">

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>


<body>


<header class="navbar">

<a href="index.html" class="logo">
Elevora
</a>

<nav class="nav-links">

<a href="index.html">Home</a>
<a href="personal.html">Resume</a>
<a href="preview.html">Preview</a>
<a href="cover-letter.html">Cover Letter</a>

<button
id="themeToggle"
class="theme-toggle"
type="button"
>
🌙
</button>

</nav>

</header>


<main class="page-container">


<div class="form-header">

<div class="step-number">3</div>

<div>

<h1>Education</h1>

<p>
Add your academic qualifications.
</p>

</div>

</div>


<div class="progress-wrapper">

<div class="progress-bar">
<div
class="progress-fill"
style="width:30%"
></div>
</div>

<span>3 of 10</span>

</div>


<div
id="entryList"
class="entry-list"
></div>


<form
id="entryForm"
class="form-card"
>


<div class="form-group">

<label>Institution <span class="required">*</span></label>

<input
id="institution"
required
placeholder="University / College / School"
>

</div>


<div class="form-group">

<label>Degree <span class="required">*</span></label>

<input
id="degree"
required
placeholder="Bachelor of Technology"
>

</div>


<div class="form-group">

<label>Field of Study</label>

<input
id="field"
placeholder="Computer Science"
>

</div>


<div class="form-group">

<label>Admission Year</label>

<input
id="admissionYear"
type="number"
min="1950"
max="2100"
placeholder="2020"
>

</div>


<div class="form-group">

<label>Pass Out / Completed Year</label>

<input
id="completedYear"
type="number"
min="1950"
max="2100"
placeholder="2024"
>

</div>


<div class="checkbox-row">

<input
id="currentlyStudying"
type="checkbox"
>

<label for="currentlyStudying">
I am currently studying
</label>

</div>


<div class="form-group">

<label>Grade / GPA</label>

<input
id="grade"
placeholder="8.5 CGPA / 85%"
>

</div>


<div class="form-group">

<label>Description</label>

<textarea
id="description"
placeholder="Relevant coursework, achievements, activities..."
></textarea>

</div>


<div class="form-actions">

<a
href="summary.html"
class="btn secondary"
>
← Back
</a>

<div style="display:flex;gap:10px;">

<button
type="button"
id="cancelEdit"
class="btn secondary"
style="display:none"
>
Cancel
</button>

<button
type="submit"
id="saveBtn"
class="btn primary"
>
+ Add Education
</button>

</div>

</div>


<div
id="status"
class="form-status"
></div>


</form>


<div class="form-actions">

<a
href="summary.html"
class="btn secondary"
>
← Back
</a>

<a
href="experience.html"
class="btn primary"
>
Save & Continue →
</a>

</div>


</main>


<script>

window.MULTI_CONFIG = {

key:"education",

addText:"+ Add Education",

fields:[

{id:"institution"},

{id:"degree"},

{id:"field"},

{id:"admissionYear"},

{id:"completedYear"},

{id:"currentlyStudying",type:"checkbox"},

{id:"grade"},

{id:"description"}

],

title:entry =>
entry.degree ||
entry.institution ||
"Education",

meta:entry =>
[
entry.institution,
entry.field,
entry.admissionYear,
entry.currentlyStudying
? "Currently Studying"
: entry.completedYear,
entry.grade
]
.filter(Boolean)
.join(" • ")

};

</script>

<script src="js/multi.js"></script>

</body>
</html>
