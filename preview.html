<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Preview | Elevora</title>
<link rel="stylesheet" href="css/style.css">
<script src="theme.js"></script>
<script src="js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<header class="navbar no-print">
  <a href="index.html" class="logo">Elevora</a>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="personal.html">Resume</a>
    <a href="preview.html">Preview</a>
    <a href="cover-letter.html">Cover Letter</a>
    <button id="themeToggle" class="theme-toggle" type="button">🌙</button>
  </nav>
</header>

<main class="page-container">
  <div class="form-header no-print">
    <div class="step-number">10</div>
    <div>
      <h1>Resume Preview</h1>
      <p>Choose a template, review your resume, then download it.</p>
    </div>
  </div>

  <section class="template-panel no-print">
    <div class="template-panel-head">
      <div>
        <h2>Choose a Resume Template</h2>
        <p>Your selected design is saved automatically.</p>
      </div>
      <span id="selectedTemplateLabel" class="template-selected-label"></span>
    </div>
    <div id="templateGrid" class="template-grid"></div>
  </section>

  <div class="form-actions no-print">
    <a href="achievements.html" class="btn secondary">← Back</a>
    <button id="downloadPdfBtn" class="btn primary" type="button">Download PDF</button>
    <button id="downloadWordBtn" class="btn secondary" type="button">Download Word</button>
    <button id="printBtn" class="btn secondary" type="button">Print</button>
  </div>

  <div id="resume" class="resume-paper"></div>
</main>

<script>
const personal = JSON.parse(localStorage.getItem("resumePersonalData") || "{}");
const summary = JSON.parse(localStorage.getItem("section_summary") || "{}");
const sections = {
  education: JSON.parse(localStorage.getItem("section_education") || "[]"),
  experience: JSON.parse(localStorage.getItem("section_experience") || "[]"),
  projects: JSON.parse(localStorage.getItem("section_projects") || "[]"),
  skills: JSON.parse(localStorage.getItem("section_skills") || "[]"),
  certifications: JSON.parse(localStorage.getItem("section_certifications") || "[]"),
  languages: JSON.parse(localStorage.getItem("section_languages") || "[]"),
  achievements: JSON.parse(localStorage.getItem("section_achievements") || "[]")
};

const TEMPLATES = [
  {id:"classic", name:"Classic", desc:"Traditional, clean and ATS-friendly", icon:"▤"},
  {id:"modern", name:"Modern", desc:"Contemporary with strong headings", icon:"◈"},
  {id:"minimal", name:"Minimal", desc:"Simple and spacious", icon:"○"},
  {id:"executive", name:"Executive", desc:"Premium leadership style", icon:"◆"},
  {id:"elegant", name:"Elegant", desc:"Refined typography and spacing", icon:"✦"},
  {id:"compact", name:"Compact", desc:"Fits more information efficiently", icon:"▦"},
  {id:"bold", name:"Bold", desc:"Strong visual hierarchy", icon:"B"},
  {id:"professional", name:"Professional", desc:"Balanced corporate layout", icon:"P"},
  {id:"sidebar", name:"Sidebar", desc:"Two-column information layout", icon:"▥"},
  {id:"creative", name:"Creative", desc:"Distinctive modern presentation", icon:"✺"},
  {id:"ats", name:"ATS Focus", desc:"Optimized for applicant tracking", icon:"✓"},
  {id:"academic", name:"Academic", desc:"Research and education focused", icon:"A"}
];

let selectedTemplate = localStorage.getItem("resumeTemplate") || "classic";

function esc(value){
  return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function sectionTitle(title){ return `<h2>${esc(title)}</h2>`; }
function makeItems(items,titleFn,metaFn){
  return items.map(item => `<div class="resume-entry"><h3>${esc(titleFn(item))}</h3><p class="entry-meta">${esc(metaFn(item))}</p>${item.description ? `<p>${esc(item.description)}</p>` : ""}</div>`).join("");
}

function buildResume(){
  let html = `<div class="resume-header"><h1>${esc(personal.fullName || "Your Name")}</h1><div class="contact">${esc(personal.email || "")}${personal.phone ? " • " + esc((personal.phoneCode || "") + " " + personal.phone) : ""}${personal.city ? " • " + esc(personal.city) : ""}${personal.country ? ", " + esc(personal.country) : ""}</div></div>`;
  if(summary.professionalSummary) html += sectionTitle("Professional Summary") + `<p>${esc(summary.professionalSummary)}</p>`;
  if(sections.education.length) html += sectionTitle("Education") + makeItems(sections.education, i => i.degree || i.institution || "Education", i => [i.institution,i.field,i.admissionYear,i.currentlyStudying ? "Currently Studying" : i.completedYear,i.grade].filter(Boolean).join(" • "));
  if(sections.experience.length) html += sectionTitle("Experience") + makeItems(sections.experience, i => i.jobTitle || i.company || "Experience", i => [i.company,i.location,i.startYear,i.currentJob ? "Present" : i.endYear].filter(Boolean).join(" • "));
  if(sections.projects.length) html += sectionTitle("Projects") + makeItems(sections.projects, i => i.projectName || "Project", i => [i.technologies,i.link].filter(Boolean).join(" • "));
  if(sections.skills.length) html += sectionTitle("Skills") + `<p>${sections.skills.map(i => `${esc(i.skill)}${i.level ? " ("+esc(i.level)+")" : ""}`).join(" • ")}</p>`;
  if(sections.certifications.length) html += sectionTitle("Certifications") + makeItems(sections.certifications, i => i.name || "Certification", i => [i.issuer,i.year].filter(Boolean).join(" • "));
  if(sections.languages.length) html += sectionTitle("Languages") + `<p>${sections.languages.map(i => `${esc(i.language)}${i.proficiency ? " ("+esc(i.proficiency)+")" : ""}`).join(" • ")}</p>`;
  if(sections.achievements.length) html += sectionTitle("Achievements") + makeItems(sections.achievements, i => i.title || "Achievement", i => [i.organization,i.year].filter(Boolean).join(" • "));
  const resume = document.getElementById("resume");
  resume.className = `resume-paper template-${selectedTemplate}`;
  resume.innerHTML = html;
}

function renderTemplates(){
  const grid = document.getElementById("templateGrid");
  grid.innerHTML = TEMPLATES.map(t => `<button type="button" class="template-card ${selectedTemplate===t.id ? "active" : ""}" data-template="${t.id}"><span class="template-icon">${t.icon}</span><strong>${t.name}</strong><small>${t.desc}</small></button>`).join("");
  document.getElementById("selectedTemplateLabel").textContent = `Selected: ${TEMPLATES.find(t => t.id===selectedTemplate)?.name || "Classic"}`;
  grid.querySelectorAll("[data-template]").forEach(btn => btn.addEventListener("click", () => {
    selectedTemplate = btn.dataset.template;
    localStorage.setItem("resumeTemplate", selectedTemplate);
    renderTemplates();
    buildResume();
  }));
}

function safeFileName(name, fallback){
  const cleaned = String(name || fallback).trim().replace(/[^a-z0-9]+/gi,"-").replace(/^-+|-+$/g,"");
  return cleaned || fallback;
}

async function downloadPDF(){
  const button = document.getElementById("downloadPdfBtn");
  button.disabled = true;
  button.textContent = "Preparing PDF...";
  try {
    const element = document.getElementById("resume");
    await html2pdf().set({
      margin: 0,
      filename: `${safeFileName(personal.fullName,"Elevora-Resume")}.pdf`,
      image: {type:"jpeg", quality:0.98},
      html2canvas: {scale:2, useCORS:true, backgroundColor:"#ffffff"},
      jsPDF: {unit:"mm", format:"a4", orientation:"portrait"},
      pagebreak: {mode:["css","legacy"]}
    }).from(element).save();
  } catch(error){
    alert("The PDF could not be generated. Please try again.");
    console.error(error);
  } finally {
    button.disabled = false;
    button.textContent = "Download PDF";
  }
}

function downloadWord(){
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Resume</title></head><body>${document.getElementById("resume").outerHTML}</body></html>`;
  const blob = new Blob([html], {type:"application/msword"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${safeFileName(personal.fullName,"Elevora-Resume")}.doc`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

document.getElementById("downloadPdfBtn").addEventListener("click", downloadPDF);
document.getElementById("downloadWordBtn").addEventListener("click", downloadWord);
document.getElementById("printBtn").addEventListener("click", () => window.print());
renderTemplates();
buildResume();
</script>
</body>
</html>
