<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resume Preview - Elevora</title>

<link rel="stylesheet" href="css/style.css">

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>

<body>

<header class="navbar no-print">

<a class="logo" href="index.html">
Elevora
</a>

<nav class="nav-links">

<a href="index.html">Home</a>

<a href="personal.html">Resume</a>

<a href="preview.html">Preview</a>

<a href="cover-letter.html">Cover Letter</a>

<button id="themeToggle" class="theme-toggle">
🌙
</button>

</nav>

</header>


<main class="container">

<div class="page-head no-print">

<h1>Resume Preview</h1>

<p>
Review your complete resume before downloading.
</p>

</div>


<div class="actions no-print">

<a
href="achievements.html"
class="btn secondary">

← Back to Resume

</a>


<button
id="downloadButton"
class="btn">

Download Resume

</button>

</div>


<article
id="resume"
class="resume-paper">

</article>

</main>


<div
id="downloadModal"
class="modal no-print">

<div class="modal-box">

<h2>
Download Resume
</h2>

<p>
Choose the format you want.
</p>


<div class="grid2">

<div class="card">

<h3>
PDF
</h3>

<p>
Best for job applications and sharing.
</p>

<button
id="pdfButton"
class="btn">

Download PDF

</button>

</div>


<div class="card">

<h3>
Word
</h3>

<p>
Editable Word-compatible document.
</p>

<button
id="wordButton"
class="btn">

Download Word

</button>

</div>

</div>


<div class="actions">

<button
id="printButton"
class="btn secondary">

Print Resume

</button>


<button
id="closeModal"
class="btn secondary">

Close

</button>

</div>

</div>

</div>


<script>

const personal =
  getJSON(STORAGE_KEYS.personal, {});

const summary =
  getJSON(STORAGE_KEYS.summary, {});

const education =
  getArray(STORAGE_KEYS.education);

const experience =
  getArray(STORAGE_KEYS.experience);

const projects =
  getArray(STORAGE_KEYS.projects);

const skills =
  getArray(STORAGE_KEYS.skills);

const certifications =
  getArray(STORAGE_KEYS.certifications);

const languages =
  getArray(STORAGE_KEYS.languages);

const achievements =
  getArray(STORAGE_KEYS.achievements);


const resume =
  document.getElementById("resume");


let html = "";


html += `

<h1>
${escapeHTML(
  personal.fullName || "Your Name"
)}
</h1>

<div class="contact">

${escapeHTML(

[
personal.email,

personal.phoneCode &&
personal.phone
  ? personal.phoneCode + " " + personal.phone
  : personal.phone,

personal.city,
personal.state,
personal.country

]
.filter(Boolean)
.join(" • ")

)}

</div>

`;


if (summary.professionalSummary) {

  html += `

  <h2>
  Professional Summary
  </h2>

  <p>
  ${escapeHTML(
    summary.professionalSummary
  )}
  </p>

  `;

}


if (summary.keyStrengths) {

  html += `

  <h2>
  Key Strengths
  </h2>

  <p>
  ${escapeHTML(
    summary.keyStrengths
  )}
  </p>

  `;

}


/* EXPERIENCE */

if (experience.length) {

  html += `
  <h2>Experience</h2>
  `;

  experience.forEach(item => {

    html += `

    <h3>

    ${escapeHTML(
      item.jobTitle || ""
    )}

    ${
      item.company
        ? " — " +
          escapeHTML(item.company)
        : ""
    }

    </h3>


    <p>

    ${escapeHTML(

      [
        item.startYear,

        item.current
          ? "Present"
          : item.endYear,

        item.location

      ]
      .filter(Boolean)
      .join(" • ")

    )}

    </p>


    ${
      item.description
        ? `<p>${escapeHTML(
            item.description
          )}</p>`
        : ""
    }

    `;

  });

}


/* EDUCATION */

if (education.length) {

  html += `
  <h2>Education</h2>
  `;

  education.forEach(item => {

    html += `

    <h3>

    ${escapeHTML(
      item.degree || ""
    )}

    ${
      item.institution
        ? " — " +
          escapeHTML(item.institution)
        : ""
    }

    </h3>


    <p>

    ${escapeHTML(

      [
        item.field,
        item.admissionYear,

        item.currentlyStudying
          ? "Currently Studying"
          : item.completedYear,

        item.grade

      ]
      .filter(Boolean)
      .join(" • ")

    )}

    </p>


    ${
      item.description
        ? `<p>${escapeHTML(
            item.description
          )}</p>`
        : ""
    }

    `;

  });

}


/* PROJECTS */

if (projects.length) {

  html += `
  <h2>Projects</h2>
  `;

  projects.forEach(item => {

    html += `

    <h3>
    ${escapeHTML(
      item.name || ""
    )}
    </h3>

    <p>

    ${escapeHTML(

      [
        item.role,
        item.technologies

      ]
      .filter(Boolean)
      .join(" • ")

    )}

    </p>


    ${
      item.description
        ? `<p>${escapeHTML(
            item.description
          )}</p>`
        : ""
    }

    `;

  });

}


/* SKILLS */

if (skills.length) {

  html += `
  <h2>Skills</h2>
  `;

  skills.forEach(item => {

    html += `

    <p>

    <strong>
    ${escapeHTML(
      item.category || ""
    )}
    </strong>

    :

    ${escapeHTML(
      item.skills || ""
    )}

    </p>

    `;

  });

}


/* CERTIFICATIONS */

if (certifications.length) {

  html += `
  <h2>Certifications</h2>
  `;

  certifications.forEach(item => {

    html += `

    <h3>
    ${escapeHTML(
      item.name || ""
    )}
    </h3>

    <p>

    ${escapeHTML(

      [
        item.issuer,
        item.year,
        item.credential

      ]
      .filter(Boolean)
      .join(" • ")

    )}

    </p>

    `;

  });

}


/* LANGUAGES */

if (languages.length) {

  html += `
  <h2>Languages</h2>
  `;

  languages.forEach(item => {

    html += `

    <p>

    <strong>
    ${escapeHTML(
      item.language || ""
    )}
    </strong>

    —

    ${escapeHTML(
      item.proficiency || ""
    )}

    </p>

    `;

  });

}


/* ACHIEVEMENTS */

if (achievements.length) {

  html += `
  <h2>Achievements</h2>
  `;

  achievements.forEach(item => {

    html += `

    <h3>
    ${escapeHTML(
      item.title || ""
    )}
    </h3>

    <p>

    ${escapeHTML(

      [
        item.organization,
        item.year

      ]
      .filter(Boolean)
      .join(" • ")

    )}

    </p>


    ${
      item.description
        ? `<p>${escapeHTML(
            item.description
          )}</p>`
        : ""
    }

    `;

  });

}


resume.innerHTML = html;


/* DOWNLOAD MODAL */

const modal =
  document.getElementById(
    "downloadModal"
  );


document
  .getElementById("downloadButton")
  .onclick = function() {

    modal.classList.add("show");

  };


document
  .getElementById("closeModal")
  .onclick = function() {

    modal.classList.remove("show");

  };


/* PDF */

document
  .getElementById("pdfButton")
  .onclick = function() {

    modal.classList.remove("show");

    window.print();

  };


/* PRINT */

document
  .getElementById("printButton")
  .onclick = function() {

    modal.classList.remove("show");

    window.print();

  };


/* WORD */

document
  .getElementById("wordButton")
  .onclick = function() {

    const documentHTML = `

      <html>

      <head>

      <meta charset="UTF-8">

      <style>

      body {
        font-family: Arial, sans-serif;
        padding: 40px;
        color: #111;
        line-height: 1.5;
      }

      h1 {
        font-size: 30px;
      }

      h2 {
        font-size: 16px;
        border-bottom: 1px solid #999;
        padding-bottom: 5px;
        margin-top: 25px;
      }

      h3 {
        margin-bottom: 4px;
      }

      </style>

      </head>

      <body>

      ${resume.innerHTML}

      </body>

      </html>

    `;


    const blob =
      new Blob(
        [documentHTML],
        {
          type:
            "application/msword"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href = url;

    link.download =
      "resume.doc";

    link.click();


    URL.revokeObjectURL(url);

  };

</script>

</body>

</html>
