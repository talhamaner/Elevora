<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resume Preview | Elevora</title>

<link rel="stylesheet" href="css/style.css">

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>


<body>


<header class="navbar no-print">

<a href="index.html" class="logo">Elevora</a>

<nav class="nav-links">

<a href="index.html">Home</a>
<a href="personal.html">Resume</a>
<a href="preview.html">Preview</a>
<a href="cover-letter.html">Cover Letter</a>

<button id="themeToggle" class="theme-toggle" type="button">🌙</button>

</nav>

</header>


<main class="page-container">


<div class="form-header no-print">

<div class="step-number">10</div>

<div>

<h1>Resume Preview</h1>

<p>
Review your resume before printing or saving it.
</p>

</div>

</div>


<div class="form-actions no-print">

<a
href="achievements.html"
class="btn secondary"
>
← Back
</a>

<button
id="printBtn"
class="btn primary"
type="button"
>
Print / Save PDF
</button>

</div>


<div
id="resume"
class="resume-paper"
></div>


</main>


<script>

const personal =
JSON.parse(
localStorage.getItem(
"resumePersonalData"
) || "{}"
);


const summary =
JSON.parse(
localStorage.getItem(
"section_summary"
) || "{}"
);


const sections = {

education:
JSON.parse(
localStorage.getItem(
"section_education"
) || "[]"
),

experience:
JSON.parse(
localStorage.getItem(
"section_experience"
) || "[]"
),

projects:
JSON.parse(
localStorage.getItem(
"section_projects"
) || "[]"
),

skills:
JSON.parse(
localStorage.getItem(
"section_skills"
) || "[]"
),

certifications:
JSON.parse(
localStorage.getItem(
"section_certifications"
) || "[]"
),

languages:
JSON.parse(
localStorage.getItem(
"section_languages"
) || "[]"
),

achievements:
JSON.parse(
localStorage.getItem(
"section_achievements"
) || "[]"
)

};


function esc(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");

}


function sectionTitle(title){

return `<h2>${title}</h2>`;

}


function makeItems(
items,
titleFn,
metaFn
){

return items.map(item => `

<div>

<h3>
${esc(titleFn(item))}
</h3>

<p>
${esc(metaFn(item))}
</p>

${
item.description
? `<p>${esc(item.description)}</p>`
: ""
}

</div>

`).join("");

}


let html = `

<h1>
${esc(
personal.fullName ||
"Your Name"
)}
</h1>

<div class="contact">

${esc(personal.email || "")}

${personal.phone
? " • " + esc(
(personal.phoneCode || "") +
" " +
personal.phone
)
: ""}

${personal.city
? " • " + esc(personal.city)
: ""}

${personal.country
? ", " + esc(personal.country)
: ""}

</div>

`;


if(summary.professionalSummary){

html +=
sectionTitle("Professional Summary") +
`<p>${esc(
summary.professionalSummary
)}</p>`;

}


if(sections.education.length){

html +=
sectionTitle("Education") +

makeItems(
sections.education,

item =>
item.degree ||
item.institution ||
"Education",

item =>
[
item.institution,
item.field,
item.admissionYear,
item.currentlyStudying
? "Currently Studying"
: item.completedYear,
item.grade
]
.filter(Boolean)
.join(" • ")
);

}


if(sections.experience.length){

html +=
sectionTitle("Experience") +

makeItems(
sections.experience,

item =>
item.jobTitle ||
item.company ||
"Experience",

item =>
[
item.company,
item.location,
item.startYear,
item.currentJob
? "Present"
: item.endYear
]
.filter(Boolean)
.join(" • ")
);

}


if(sections.projects.length){

html +=
sectionTitle("Projects") +

makeItems(
sections.projects,

item =>
item.projectName ||
"Project",

item =>
[
item.technologies,
item.link
]
.filter(Boolean)
.join(" • ")
);

}


if(sections.skills.length){

html +=
sectionTitle("Skills") +

`<p>${
sections.skills
.map(item =>
`${esc(item.skill)}${
item.level
? " (" + esc(item.level) + ")"
: ""
}`
)
.join(" • ")
}</p>`;

}


if(sections.certifications.length){

html +=
sectionTitle("Certifications") +

makeItems(
sections.certifications,

item =>
item.name ||
"Certification",

item =>
[
item.issuer,
item.year
]
.filter(Boolean)
.join(" • ")
);

}


if(sections.languages.length){

html +=
sectionTitle("Languages") +

`<p>${
sections.languages
.map(item =>
`${esc(item.language)}${
item.proficiency
? " (" +
esc(item.proficiency) +
")"
: ""
}`
)
.join(" • ")
}</p>`;

}


if(sections.achievements.length){

html +=
sectionTitle("Achievements") +

makeItems(
sections.achievements,

item =>
item.title ||
"Achievement",

item =>
[
item.organization,
item.year
]
.filter(Boolean)
.join(" • ")
);

}


document.getElementById(
"resume"
).innerHTML = html;


document.getElementById(
"printBtn"
).onclick = function(){

window.print();

};

</script>

</body>
</html>
