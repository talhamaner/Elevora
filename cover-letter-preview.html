<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Cover Letter Preview | Elevora</title>

<link
rel="stylesheet"
href="css/style.css"
>

<script src="theme.js"></script>

</head>


<body>


<header class="navbar no-print">

<a href="index.html" class="logo">
Elevora
</a>

<nav class="nav-links">

<a href="index.html">Home</a>
<a href="personal.html">Resume</a>
<a href="preview.html">Preview</a>
<a href="cover-letter.html">Cover Letter</a>

<button
id="themeToggle"
class="theme-toggle"
type="button"
>
🌙
</button>

</nav>

</header>


<main class="page-container">


<div class="form-header no-print">

<div class="step-number">
✦
</div>

<div>

<h1>Cover Letter Preview</h1>

<p>
Review your cover letter before printing.
</p>

</div>

</div>


<div class="form-actions no-print">

<a
href="cover-letter.html"
class="btn secondary"
>
← Edit
</a>

<button
id="printBtn"
class="btn primary"
>
Print / Save PDF
</button>

</div>


<div
id="letter"
class="resume-paper"
></div>


</main>


<script>

const personal =
JSON.parse(
localStorage.getItem(
"resumePersonalData"
) || "{}"
);


const summary =
JSON.parse(
localStorage.getItem(
"section_summary"
) || "{}"
);


const cover =
JSON.parse(
localStorage.getItem(
"section_cover_letter"
) || "{}"
);


const today =
new Date().toLocaleDateString();


const greeting =
cover.manager
? `Dear ${cover.manager},`
: "Dear Hiring Manager,";


const letter = `

<p>
${esc(personal.fullName || "Your Name")}
<br>
${esc(personal.email || "")}
${personal.phone
? "<br>" + esc(
(personal.phoneCode || "") +
" " +
personal.phone
)
: ""}
</p>

<p>
${today}
</p>

<p>
${esc(cover.company || "Company")}
</p>

<p>
<strong>
Re: Application for ${esc(
cover.jobTitle || "the position"
)}
</strong>
</p>

<p>
${greeting}
</p>

<p>
I am writing to express my interest in the
${esc(cover.jobTitle || "position")}
opportunity at
${esc(cover.company || "your organization")}.
${
cover.industry
? ` I am particularly interested in contributing
to the ${esc(cover.industry)} industry.`
: ""
}
</p>

<p>
${
summary.professionalSummary
? esc(summary.professionalSummary)
: "I believe my skills, experience and professional background would allow me to make a meaningful contribution to your team."
}
</p>

${
cover.jobDescription
? `<p>
Based on the requirements of this opportunity,
I am especially interested in applying my
experience to the needs described in the
position.
</p>`
: ""
}

${
cover.notes
? `<p>${esc(cover.notes)}</p>`
: ""
}

<p>
Thank you for considering my application.
I would welcome the opportunity to discuss how
my background and skills can contribute to
your organization.
</p>

<p>
Sincerely,<br>
<strong>${esc(
personal.fullName || "Your Name"
)}</strong>
</p>

`;


function esc(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");

}


document.getElementById(
"letter"
).innerHTML = letter;


document.getElementById(
"printBtn"
).onclick = () =>
window.print();

</script>

</body>
</html>
