<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cover Letter Preview - Elevora</title>

<link rel="stylesheet" href="css/style.css">

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>

<body>

<header class="navbar no-print">

<a class="logo" href="index.html">
Elevora
</a>

<nav class="nav-links">

<a href="index.html">Home</a>
<a href="personal.html">Resume</a>
<a href="preview.html">Resume Preview</a>
<a href="cover-letter.html">Cover Letter</a>

<button id="themeToggle" class="theme-toggle">
🌙
</button>

</nav>

</header>


<main class="container">

<div class="page-head no-print">

<h1>Cover Letter Preview</h1>

<p>
Review your cover letter before printing or downloading it.
</p>

</div>


<div class="actions no-print">

<a
href="cover-letter.html"
class="btn secondary">

← Edit Cover Letter

</a>


<button
id="printButton"
class="btn">

Print / Save PDF

</button>


<button
id="wordButton"
class="btn secondary">

Download Word

</button>

</div>


<article
id="coverLetter"
class="resume-paper">

</article>

</main>


<script>

const cover =
  getJSON(STORAGE_KEYS.coverLetter, {});

const personal =
  getJSON(STORAGE_KEYS.personal, {});

const summary =
  getJSON(STORAGE_KEYS.summary, {});


const manager =
  cover.manager || "Hiring Manager";


const date =
  new Date().toLocaleDateString();


const letter = document.getElementById(
  "coverLetter"
);


letter.innerHTML = `

<p>
${escapeHTML(personal.city || "")}
${personal.country
  ? ", " + escapeHTML(personal.country)
  : ""}
</p>

<p>
${escapeHTML(date)}
</p>


<p>

${escapeHTML(manager)}

<br>

${escapeHTML(cover.company || "")}

</p>


<p>

<strong>
Subject: Application for
${escapeHTML(cover.jobTitle || "")}
</strong>

</p>


<p>
Dear ${escapeHTML(manager)},
</p>


<p>

I am writing to express my interest in the
<strong>
${escapeHTML(cover.jobTitle || "")}
</strong>
position at
<strong>
${escapeHTML(cover.company || "")}
</strong>.

${escapeHTML(
  summary.professionalSummary ||
  "I am a motivated professional with a strong interest in contributing to meaningful work."
)}

</p>


<p>

My background and skills align with the requirements
of this role. I am particularly interested in
${escapeHTML(cover.industry || "your industry")}
and would welcome the opportunity to contribute
my skills and experience to your team.

</p>


${
  cover.notes
    ? `<p>${escapeHTML(cover.notes)}</p>`
    : `
      <p>
      I would welcome the opportunity to discuss how
      my skills and experience can contribute to your
      organization. Thank you for considering my
      application.
      </p>
    `
}


<p>

Sincerely,

<br><br>

<strong>
${escapeHTML(personal.fullName || "Your Name")}
</strong>

<br>

${escapeHTML(personal.email || "")}

</p>

`;


document
  .getElementById("printButton")
  .addEventListener("click", function() {

    window.print();

  });


document
  .getElementById("wordButton")
  .addEventListener("click", function() {

    const html = `

      <html>

      <head>

      <meta charset="UTF-8">

      <style>

      body {
        font-family: Arial, sans-serif;
        padding: 40px;
        line-height: 1.6;
      }

      </style>

      </head>

      <body>

      ${letter.innerHTML}

      </body>

      </html>

    `;


    const blob = new Blob(
      [html],
      {
        type: "application/msword"
      }
    );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href = url;

    link.download =
      "cover-letter.doc";


    link.click();


    URL.revokeObjectURL(url);

  });

</script>

</body>

</html>
