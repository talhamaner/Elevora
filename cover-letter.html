<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Cover Letter Builder | Elevora</title>

<link
rel="stylesheet"
href="css/style.css"
>

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>


<body>


<header class="navbar">

<a href="index.html" class="logo">
Elevora
</a>

<nav class="nav-links">

<a href="index.html">Home</a>
<a href="personal.html">Resume</a>
<a href="preview.html">Preview</a>
<a href="cover-letter.html">Cover Letter</a>

<button
id="themeToggle"
class="theme-toggle"
type="button"
>
🌙
</button>

</nav>

</header>


<main class="page-container">


<div class="form-header">

<div class="step-number">
✦
</div>

<div>

<h1>Build a Cover Letter</h1>

<p>
Create a personalized cover letter for a specific opportunity.
</p>

</div>

</div>


<form
id="coverLetterForm"
class="form-card"
>


<div class="form-group">

<label>
Company Name <span class="required">*</span>
</label>

<input
id="company"
required
placeholder="Company name"
>

</div>


<div class="form-group">

<label>
Job Title <span class="required">*</span>
</label>

<input
id="jobTitle"
required
placeholder="Job title"
>

</div>


<div class="form-group">

<label>
Industry
</label>

<input
id="industry"
placeholder="Technology, Finance, Healthcare..."
>

</div>


<div class="form-group">

<label>
Hiring Manager
</label>

<input
id="manager"
placeholder="Hiring manager name"
>

</div>


<div class="form-group">

<label>
Job Description
</label>

<textarea
id="jobDescription"
placeholder="Paste the job description here..."
></textarea>

</div>


<div class="form-group">

<label>
Additional Information
</label>

<textarea
id="notes"
placeholder="Anything else you want the cover letter to mention..."
></textarea>

</div>


<div class="form-actions">

<a
href="index.html"
class="btn secondary"
>
← Back
</a>

<button
type="submit"
class="btn primary"
>
Continue →
</button>

</div>


</form>

</main>


<script>

const saved =
JSON.parse(
localStorage.getItem(
"section_cover_letter"
) || "{}"
);


[
"company",
"jobTitle",
"industry",
"manager",
"jobDescription",
"notes"
].forEach(id=>{

const element =
document.getElementById(id);

if(element){

element.value =
saved[id] || "";

}

});


document
.getElementById(
"coverLetterForm"
)
.addEventListener(
"submit",
function(event){

event.preventDefault();


const data={};

[
"company",
"jobTitle",
"industry",
"manager",
"jobDescription",
"notes"
].forEach(id=>{

data[id] =
document.getElementById(
id
).value.trim();

});


localStorage.setItem(
"section_cover_letter",
JSON.stringify(data)
);


window.location.href =
"cover-letter-preview.html";

});

</script>

</body>
</html>
