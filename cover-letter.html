<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Build Cover Letter - Elevora</title>

<link rel="stylesheet" href="css/style.css">

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>

<body>

<header class="navbar">

<a class="logo" href="index.html">
Elevora
</a>

<nav class="nav-links">

<a href="index.html">Home</a>

<a href="personal.html">Resume</a>

<a href="preview.html">Preview</a>

<a href="cover-letter.html">
Cover Letter
</a>

<button id="themeToggle" class="theme-toggle">
🌙
</button>

</nav>

</header>


<main class="container">

<div class="page-head">

<h1>Build a Cover Letter</h1>

<p>
Create a separate, job-specific cover letter.
This is independent from the resume-building steps.
</p>

</div>


<section class="form-card">

<form id="coverLetterForm">

<div class="form-grid">

<div class="form-group">

<label>
Company Name <span class="required">*</span>
</label>

<input
id="company"
required
placeholder="Example Technologies">

</div>


<div class="form-group">

<label>
Job Title <span class="required">*</span>
</label>

<input
id="jobTitle"
required
placeholder="Frontend Developer">

</div>


<div class="form-group">

<label>
Industry
</label>

<input
id="industry"
placeholder="Technology">

</div>


<div class="form-group">

<label>
Hiring Manager
</label>

<input
id="manager"
placeholder="Hiring Manager">

</div>


<div class="form-group full">

<label>
Job Description <span class="required">*</span>
</label>

<textarea
id="jobDescription"
required
placeholder="Paste the job description here...">
</textarea>

</div>


<div class="form-group full">

<label>
Additional Information
</label>

<textarea
id="notes"
placeholder="Achievements or points you want the cover letter to emphasize...">
</textarea>

</div>

</div>


<div class="actions">

<a
href="index.html"
class="btn secondary">

← Home

</a>


<button
class="btn"
type="submit">

Build Cover Letter →

</button>

</div>

</form>

</section>

</main>


<script>

const savedCoverLetter =
  getJSON(STORAGE_KEYS.coverLetter, {});


[
  "company",
  "jobTitle",
  "industry",
  "manager",
  "jobDescription",
  "notes"
].forEach(id => {

  document.getElementById(id).value =
    savedCoverLetter[id] || "";

});


document
  .getElementById("coverLetterForm")
  .addEventListener("submit", function(event) {

    event.preventDefault();

    const data = {

      company:
        document.getElementById("company").value.trim(),

      jobTitle:
        document.getElementById("jobTitle").value.trim(),

      industry:
        document.getElementById("industry").value.trim(),

      manager:
        document.getElementById("manager").value.trim(),

      jobDescription:
        document.getElementById("jobDescription").value.trim(),

      notes:
        document.getElementById("notes").value.trim()

    };


    setJSON(
      STORAGE_KEYS.coverLetter,
      data
    );


    window.location.href =
      "cover-letter-preview.html";

  });

</script>

</body>

</html>
