<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Professional Summary | Elevora</title>

<link
rel="stylesheet"
href="css/style.css"
>

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>


<body>


<header class="navbar">

<a href="index.html" class="logo">
Elevora
</a>

<nav class="nav-links">

<a href="index.html">Home</a>
<a href="personal.html">Resume</a>
<a href="preview.html">Preview</a>
<a href="cover-letter.html">Cover Letter</a>

<button
id="themeToggle"
class="theme-toggle"
type="button"
>
🌙
</button>

</nav>

</header>


<main class="page-container">


<div class="form-header">

<div class="step-number">2</div>

<div>

<h1>Professional Summary</h1>

<p>
Introduce yourself and highlight your professional strengths.
</p>

</div>

</div>


<div class="progress-wrapper">

<div class="progress-bar">
<div
class="progress-fill"
style="width:20%"
></div>
</div>

<span>2 of 10</span>

</div>


<form
id="summaryForm"
class="form-card"
>


<div class="form-group">

<label>
Professional Summary
<span class="required">*</span>
</label>

<textarea
id="professionalSummary"
required
placeholder="Write a concise professional summary..."
></textarea>

</div>


<div class="form-group">

<label>
Career Objective
</label>

<textarea
id="careerObjective"
placeholder="Describe your career goals..."
></textarea>

</div>


<div class="form-group">

<label>
Key Strengths
</label>

<textarea
id="keyStrengths"
placeholder="Leadership, communication, problem solving..."
></textarea>

</div>


<div class="form-actions">

<a
href="personal.html"
class="btn secondary"
>
← Back
</a>

<button
type="submit"
class="btn primary"
>
Save & Continue →
</button>

</div>


<div
id="status"
class="form-status"
></div>


</form>

</main>


<script>

const saved =
JSON.parse(
localStorage.getItem(
"section_summary"
) || "{}"
);


document.getElementById(
"professionalSummary"
).value =
saved.professionalSummary || "";


document.getElementById(
"careerObjective"
).value =
saved.careerObjective || "";


document.getElementById(
"keyStrengths"
).value =
saved.keyStrengths || "";


document.getElementById(
"summaryForm"
).addEventListener(
"submit",
function(event){

event.preventDefault();


const data={

professionalSummary:
document.getElementById(
"professionalSummary"
).value.trim(),

careerObjective:
document.getElementById(
"careerObjective"
).value.trim(),

keyStrengths:
document.getElementById(
"keyStrengths"
).value.trim()

};


localStorage.setItem(
"section_summary",
JSON.stringify(data)
);


window.location.href =
"education.html";

});

</script>

</body>
</html>
