<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Professional Summary | Elevora</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="theme.js"></script>
  <script src="js/app.js"></script>

</head>

<body>

<header class="navbar">

  <a href="index.html" class="logo">Elevora</a>

  <nav class="nav-links">

    <a href="index.html">Home</a>
    <a href="personal.html" class="active">Resume</a>
    <a href="preview.html">Preview</a>

    <button
      id="themeToggle"
      class="theme-toggle"
      type="button"
    >
      🌙
    </button>

  </nav>

</header>


<main class="builder-wrapper">

  <div class="progress-wrapper">

    <div
      class="progress-bar"
      style="--progress: 18%"
    >
      <div class="progress-fill"></div>
    </div>

    <div class="progress-text">
      <span>Step 2 of 11</span>
      <span>Professional Summary</span>
    </div>

  </div>


  <div class="page-heading">

    <span class="eyebrow">STEP 02</span>

    <h1>Professional Summary</h1>

    <p>
      Tell employers about your professional background,
      goals and strengths.
    </p>

  </div>


  <form id="summaryForm" class="form-card">

    <div class="form-grid">

      <div class="form-group full">

        <label>
          Professional Summary <span class="required">*</span>
        </label>

        <textarea
          id="professionalSummary"
          placeholder="Example: Motivated and detail-oriented professional with experience..."
          required
        ></textarea>

        <span class="form-help">
          Keep this section concise and focused on your value.
        </span>

      </div>


      <div class="form-group full">

        <label>
          Career Objective
        </label>

        <textarea
          id="careerObjective"
          placeholder="Example: To obtain a software development position where I can apply my skills..."
        ></textarea>

      </div>


      <div class="form-group full">

        <label>
          Key Strengths
        </label>

        <input
          id="keyStrengths"
          type="text"
          placeholder="Problem Solving, Communication, Teamwork, Leadership"
        >

        <span class="form-help">
          Separate each strength with commas.
        </span>

      </div>

    </div>


    <div class="form-actions">

      <a
        href="personal.html"
        class="btn btn-secondary"
      >
        ← Back
      </a>

      <button
        type="submit"
        class="btn btn-primary"
      >
        Save & Continue →
      </button>

    </div>

  </form>

</main>


<script>

document.addEventListener(
  "DOMContentLoaded",
  function () {

    const saved =
      getJSON(
        STORAGE_KEYS.summary,
        {}
      );


    document.getElementById(
      "professionalSummary"
    ).value =
      saved.professionalSummary || "";


    document.getElementById(
      "careerObjective"
    ).value =
      saved.careerObjective || "";


    document.getElementById(
      "keyStrengths"
    ).value =
      saved.keyStrengths || "";


    document
      .getElementById("summaryForm")
      .addEventListener(
        "submit",
        function (event) {

          event.preventDefault();


          const data = {

            professionalSummary:
              document.getElementById(
                "professionalSummary"
              ).value.trim(),

            careerObjective:
              document.getElementById(
                "careerObjective"
              ).value.trim(),

            keyStrengths:
              document.getElementById(
                "keyStrengths"
              ).value.trim()

          };


          if (!data.professionalSummary) {

            alert(
              "Please enter your professional summary."
            );

            return;

          }


          setJSON(
            STORAGE_KEYS.summary,
            data
          );


          window.location.href =
            "education.html";

        }
      );

  }
);

</script>

</body>
</html>
