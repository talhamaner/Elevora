<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Achievements | Elevora</title>

<link rel="stylesheet" href="css/style.css">

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>


<body>


<header class="navbar">

<a href="index.html" class="logo">Elevora</a>

<nav class="nav-links">

<a href="index.html">Home</a>
<a href="personal.html">Resume</a>
<a href="preview.html">Preview</a>
<a href="cover-letter.html">Cover Letter</a>

<button id="themeToggle" class="theme-toggle" type="button">🌙</button>

</nav>

</header>


<main class="page-container">


<div class="form-header">

<div class="step-number">9</div>

<div>

<h1>Achievements</h1>

<p>
Highlight awards, accomplishments and recognition.
</p>

</div>

</div>


<div class="progress-wrapper">

<div class="progress-bar">
<div class="progress-fill" style="width:90%"></div>
</div>

<span>9 of 10</span>

</div>


<div id="entryList" class="entry-list"></div>


<form id="entryForm" class="form-card">


<div class="form-group">

<label>Achievement</label>

<input id="title" placeholder="Achievement or award">

</div>


<div class="form-group">

<label>Organization / Event</label>

<input id="organization" placeholder="Organization or event">

</div>


<div class="form-group">

<label>Year</label>

<input id="year" type="number" placeholder="2025">

</div>


<div class="form-group">

<label>Description</label>

<textarea id="description" placeholder="Describe your achievement..."></textarea>

</div>


<div class="form-actions">

<a href="languages.html" class="btn secondary">
← Back
</a>

<div style="display:flex;gap:10px;">

<button type="button" id="cancelEdit" class="btn secondary" style="display:none">
Cancel
</button>

<button type="submit" id="saveBtn" class="btn primary">
+ Add Achievement
</button>

</div>

</div>


<div id="status" class="form-status"></div>

</form>


<div class="form-actions">

<a href="languages.html" class="btn secondary">
← Back
</a>

<a href="preview.html" class="btn primary">
Save & Preview →
</a>

</div>


</main>


<script>

window.MULTI_CONFIG = {

key:"achievements",

addText:"+ Add Achievement",

fields:[
{id:"title"},
{id:"organization"},
{id:"year"},
{id:"description"}
],

title:entry =>
entry.title || "Achievement",

meta:entry =>
[
entry.organization,
entry.year
]
.filter(Boolean)
.join(" • ")

};

</script>

<script src="js/multi.js"></script>

</body>
</html>
