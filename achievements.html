<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Achievements - Elevora</title>

<link rel="stylesheet" href="css/style.css">

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>

<body>

<header class="navbar">

<a class="logo" href="index.html">Elevora</a>

<nav class="nav-links">

<a href="index.html">Home</a>
<a href="personal.html">Resume</a>
<a href="preview.html">Preview</a>
<a href="cover-letter.html">Cover Letter</a>

<button id="themeToggle" class="theme-toggle">🌙</button>

</nav>

</header>


<main class="container">

<div class="page-head">

<h1>Achievements</h1>

<p>Add awards, competitions, publications and other achievements.</p>

</div>


<div class="builder">

<aside class="steps">

<a href="personal.html">1. Personal</a>
<a href="summary.html">2. Summary</a>
<a href="education.html">3. Education</a>
<a href="experience.html">4. Experience</a>
<a href="projects.html">5. Projects</a>
<a href="skills.html">6. Skills</a>
<a href="certifications.html">7. Certifications</a>
<a href="languages.html">8. Languages</a>
<a href="achievements.html">9. Achievements</a>
<a href="preview.html">10. Preview</a>

</aside>


<section class="form-card">

<div id="entryList" class="entry-list"></div>

<form id="entryForm">

<div class="form-grid">

<div class="form-group">

<label>Achievement Title</label>

<input
id="title"
placeholder="Hackathon Winner">

</div>

<div class="form-group">

<label>Organization</label>

<input
id="organization"
placeholder="Example Organization">

</div>

<div class="form-group">

<label>Year</label>

<input
id="year"
type="number"
placeholder="2025">

</div>

<div class="form-group full">

<label>Description</label>

<textarea
id="description"
placeholder="Describe the achievement...">
</textarea>

</div>

</div>


<div class="actions">

<button
type="button"
id="cancelEdit"
class="btn secondary"
style="display:none">

Cancel Edit

</button>

<button
id="saveBtn"
class="btn">

+ Add Achievement

</button>

</div>

<div id="status" class="status"></div>

</form>


<div class="actions">

<a
class="btn secondary"
href="languages.html">

← Back

</a>

<a
class="btn"
href="preview.html">

Go to Resume Preview →

</a>

</div>

</section>

</div>

</main>


<script>

window.MULTI_CONFIG={

key:"achievements",

addText:"+ Add Achievement",

fields:[

{id:"title"},
{id:"organization"},
{id:"year"},
{id:"description",type:"textarea"}

],

title:function(entry){

return entry.title || "Achievement";

},

meta:function(entry){

return [
entry.organization,
entry.year
]
.filter(Boolean)
.join(" • ");

}

};

</script>

<script src="js/multi.js"></script>

</body>

</html>
