<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Languages - Elevora</title>

<link rel="stylesheet" href="css/style.css">

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>

<body>

<header class="navbar">

<a class="logo" href="index.html">Elevora</a>

<nav class="nav-links">

<a href="index.html">Home</a>
<a href="personal.html">Resume</a>
<a href="preview.html">Preview</a>
<a href="cover-letter.html">Cover Letter</a>

<button id="themeToggle" class="theme-toggle">🌙</button>

</nav>

</header>


<main class="container">

<div class="page-head">

<h1>Languages</h1>

<p>Add the languages you speak and your proficiency.</p>

</div>


<div class="builder">

<aside class="steps">

<a href="personal.html">1. Personal</a>
<a href="summary.html">2. Summary</a>
<a href="education.html">3. Education</a>
<a href="experience.html">4. Experience</a>
<a href="projects.html">5. Projects</a>
<a href="skills.html">6. Skills</a>
<a href="certifications.html">7. Certifications</a>
<a href="languages.html">8. Languages</a>
<a href="achievements.html">9. Achievements</a>
<a href="preview.html">10. Preview</a>

</aside>


<section class="form-card">

<div id="entryList" class="entry-list"></div>

<form id="entryForm">

<div class="form-grid">

<div class="form-group">

<label>Language</label>

<input
id="language"
placeholder="English">

</div>

<div class="form-group">

<label>Proficiency</label>

<select id="proficiency">

<option value="">
Select proficiency
</option>

<option>Native</option>
<option>Fluent</option>
<option>Professional</option>
<option>Intermediate</option>
<option>Basic</option>

</select>

</div>

</div>


<div class="actions">

<button
type="button"
id="cancelEdit"
class="btn secondary"
style="display:none">

Cancel Edit

</button>

<button
id="saveBtn"
class="btn">

+ Add Language

</button>

</div>

<div id="status" class="status"></div>

</form>


<div class="actions">

<a class="btn secondary" href="certifications.html">
← Back
</a>

<a class="btn" href="achievements.html">
Save & Continue →
</a>

</div>

</section>

</div>

</main>


<script>

window.MULTI_CONFIG={

key:"languages",

addText:"+ Add Language",

fields:[

{id:"language"},

{id:"proficiency"}

],

title:function(entry){

return entry.language || "Language";

},

meta:function(entry){

return entry.proficiency || "";

}

};

</script>

<script src="js/multi.js"></script>

</body>

</html>
