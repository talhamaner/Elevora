<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Languages | Elevora</title>

<link rel="stylesheet" href="css/style.css">

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>


<body>


<header class="navbar">

<a href="index.html" class="logo">Elevora</a>

<nav class="nav-links">

<a href="index.html">Home</a>
<a href="personal.html">Resume</a>
<a href="preview.html">Preview</a>
<a href="cover-letter.html">Cover Letter</a>

<button id="themeToggle" class="theme-toggle" type="button">🌙</button>

</nav>

</header>


<main class="page-container">


<div class="form-header">

<div class="step-number">8</div>

<div>

<h1>Languages</h1>

<p>
Add the languages you can communicate in.
</p>

</div>

</div>


<div class="progress-wrapper">

<div class="progress-bar">
<div class="progress-fill" style="width:80%"></div>
</div>

<span>8 of 10</span>

</div>


<div id="entryList" class="entry-list"></div>


<form id="entryForm" class="form-card">


<div class="form-group">

<label>Language <span class="required">*</span></label>

<input id="language" required placeholder="English">

</div>


<div class="form-group">

<label>Proficiency</label>

<select id="proficiency">

<option>Basic</option>
<option>Conversational</option>
<option>Intermediate</option>
<option>Fluent</option>
<option>Native</option>

</select>

</div>


<div class="form-actions">

<a href="certifications.html" class="btn secondary">
← Back
</a>

<div style="display:flex;gap:10px;">

<button type="button" id="cancelEdit" class="btn secondary" style="display:none">
Cancel
</button>

<button type="submit" id="saveBtn" class="btn primary">
+ Add Language
</button>

</div>

</div>


<div id="status" class="form-status"></div>

</form>


<div class="form-actions">

<a href="certifications.html" class="btn secondary">
← Back
</a>

<a href="achievements.html" class="btn primary">
Save & Continue →
</a>

</div>


</main>


<script>

window.MULTI_CONFIG = {

key:"languages",

addText:"+ Add Language",

fields:[
{id:"language"},
{id:"proficiency"}
],

title:entry =>
entry.language || "Language",

meta:entry =>
entry.proficiency || ""

};

</script>

<script src="js/multi.js"></script>

</body>
</html>
