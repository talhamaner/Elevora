<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Skills | Elevora</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="theme.js"></script>
  <script src="js/app.js"></script>

</head>

<body>

<header class="navbar">

  <a href="index.html" class="logo">Elevora</a>

  <nav class="nav-links">

    <a href="index.html">Home</a>
    <a href="personal.html" class="active">Resume</a>
    <a href="preview.html">Preview</a>

    <button
      id="themeToggle"
      class="theme-toggle"
      type="button"
    >
      🌙
    </button>

  </nav>

</header>


<main class="builder-wrapper">

  <div class="progress-wrapper">

    <div
      class="progress-bar"
      style="--progress: 55%"
    >
      <div class="progress-fill"></div>
    </div>

    <div class="progress-text">
      <span>Step 6 of 11</span>
      <span>Skills</span>
    </div>

  </div>


  <div class="page-heading">

    <span class="eyebrow">STEP 06</span>

    <h1>Skills</h1>

    <p>
      Add your technical and professional skills.
    </p>

  </div>


  <form id="skillsForm" class="form-card">

    <div class="form-grid">

      <div class="form-group full">

        <label>
          Technical Skills
        </label>

        <textarea
          id="technicalSkills"
          placeholder="JavaScript, HTML, CSS, Python, React, SQL..."
        ></textarea>

        <span class="form-help">
          Separate skills with commas.
        </span>

      </div>


      <div class="form-group full">

        <label>
          Soft Skills
        </label>

        <textarea
          id="softSkills"
          placeholder="Communication, Leadership, Teamwork, Problem Solving..."
        ></textarea>

      </div>


      <div class="form-group full">

        <label>
          Tools & Technologies
        </label>

        <textarea
          id="tools"
          placeholder="Git, GitHub, VS Code, Figma..."
        ></textarea>

      </div>

    </div>


    <div class="form-actions">

      <a
        href="projects.html"
        class="btn btn-secondary"
      >
        ← Back
      </a>

      <button
        type="submit"
        class="btn btn-primary"
      >
        Save & Continue →
      </button>

    </div>

  </form>

</main>


<script>

document.addEventListener(
  "DOMContentLoaded",
  function () {

    const data =
      getJSON(
        STORAGE_KEYS.skills,
        {}
      );


    document.getElementById(
      "technicalSkills"
    ).value =
      data.technicalSkills || "";


    document.getElementById(
      "softSkills"
    ).value =
      data.softSkills || "";


    document.getElementById(
      "tools"
    ).value =
      data.tools || "";


    document
      .getElementById(
        "skillsForm"
      )
      .addEventListener(
        "submit",
        function (event) {

          event.preventDefault();


          const result = {

            technicalSkills:
              document.getElementById(
                "technicalSkills"
              ).value.trim(),

            softSkills:
              document.getElementById(
                "softSkills"
              ).value.trim(),

            tools:
              document.getElementById(
                "tools"
              ).value.trim()

          };


          setJSON(
            STORAGE_KEYS.skills,
            result
          );


          window.location.href =
            "certifications.html";

        }
      );

  }
);

</script>

</body>
</html>
