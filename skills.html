<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skills | Elevora</title>

<link rel="stylesheet" href="css/style.css">

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>


<body>


<header class="navbar">

<a href="index.html" class="logo">Elevora</a>

<nav class="nav-links">

<a href="index.html">Home</a>
<a href="personal.html">Resume</a>
<a href="preview.html">Preview</a>
<a href="cover-letter.html">Cover Letter</a>

<button id="themeToggle" class="theme-toggle" type="button">🌙</button>

</nav>

</header>


<main class="page-container">


<div class="form-header">

<div class="step-number">6</div>

<div>

<h1>Skills</h1>

<p>
Add technical and professional skills.
</p>

</div>

</div>


<div class="progress-wrapper">

<div class="progress-bar">
<div class="progress-fill" style="width:60%"></div>
</div>

<span>6 of 10</span>

</div>


<div id="entryList" class="entry-list"></div>


<form id="entryForm" class="form-card">


<div class="form-group">

<label>Skill <span class="required">*</span></label>

<input id="skill" required placeholder="JavaScript">

</div>


<div class="form-group">

<label>Skill Level</label>

<select id="level">

<option value="">Select level</option>
<option>Beginner</option>
<option>Intermediate</option>
<option>Advanced</option>
<option>Expert</option>

</select>

</div>


<div class="form-actions">

<a href="projects.html" class="btn secondary">
← Back
</a>

<div style="display:flex;gap:10px;">

<button type="button" id="cancelEdit" class="btn secondary" style="display:none">
Cancel
</button>

<button type="submit" id="saveBtn" class="btn primary">
+ Add Skill
</button>

</div>

</div>


<div id="status" class="form-status"></div>

</form>


<div class="form-actions">

<a href="projects.html" class="btn secondary">
← Back
</a>

<a href="certifications.html" class="btn primary">
Save & Continue →
</a>

</div>


</main>


<script>

window.MULTI_CONFIG = {

key:"skills",

addText:"+ Add Skill",

fields:[
{id:"skill"},
{id:"level"}
],

title:entry =>
entry.skill || "Skill",

meta:entry =>
entry.level || ""

};

</script>

<script src="js/multi.js"></script>

</body>
</html>
