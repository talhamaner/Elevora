<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Experience | Elevora</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="theme.js"></script>
  <script src="js/app.js"></script>

</head>

<body>

<header class="navbar">

  <a href="index.html" class="logo">Elevora</a>

  <nav class="nav-links">

    <a href="index.html">Home</a>
    <a href="personal.html" class="active">Resume</a>
    <a href="preview.html">Preview</a>

    <button
      id="themeToggle"
      class="theme-toggle"
      type="button"
    >
      🌙
    </button>

  </nav>

</header>


<main class="builder-wrapper">

  <div class="progress-wrapper">

    <div
      class="progress-bar"
      style="--progress: 36%"
    >
      <div class="progress-fill"></div>
    </div>

    <div class="progress-text">
      <span>Step 4 of 11</span>
      <span>Experience</span>
    </div>

  </div>


  <div class="page-heading">

    <span class="eyebrow">STEP 04</span>

    <h1>Experience</h1>

    <p>
      Tell us about your professional experience.
      Freshers and students can skip this section.
    </p>

  </div>


  <form id="experienceForm" class="form-card">

    <div class="form-group">

      <label>
        Experience Status
      </label>

      <select id="experienceStatus">

        <option value="experienced">
          Experienced
        </option>

        <option value="fresher">
          Fresher
        </option>

        <option value="student">
          Student
        </option>

      </select>

    </div>


    <br>


    <div id="experienceEntries"></div>


    <button
      type="button"
      id="addExperience"
      class="add-entry"
    >
      + Add Experience
    </button>


    <div class="form-actions">

      <a
        href="education.html"
        class="btn btn-secondary"
      >
        ← Back
      </a>

      <button
        type="submit"
        class="btn btn-primary"
      >
        Save & Continue →
      </button>

    </div>

  </form>

</main>


<script>

document.addEventListener(
  "DOMContentLoaded",
  function () {

    const saved =
      getJSON(
        STORAGE_KEYS.experience,
        {}
      );


    let entries =
      Array.isArray(saved.entries)
        ? saved.entries
        : [];


    document.getElementById(
      "experienceStatus"
    ).value =
      saved.status || "experienced";


    const container =
      document.getElementById(
        "experienceEntries"
      );


    function render() {

      container.innerHTML = "";


      if (
        document.getElementById(
          "experienceStatus"
        ).value !== "experienced"
      ) {

        return;

      }


      if (!entries.length) {

        entries.push({});

      }


      entries.forEach(
        function (entry, index) {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "entry-card";


          card.innerHTML = `

            <div class="entry-card-header">

              <h3>
                Experience ${index + 1}
              </h3>

              ${
                index > 0
                ? `
                  <button
                    type="button"
                    class="remove-entry"
                  >
                    Remove
                  </button>
                `
                : ""
              }

            </div>


            <div class="form-grid">

              <div class="form-group">

                <label>
                  Job Title
                  <span class="required">*</span>
                </label>

                <input
                  class="jobTitle"
                  type="text"
                  placeholder="e.g. Software Developer"
                  value="${escapeHTML(entry.jobTitle || "")}"
                  required
                >

              </div>


              <div class="form-group">

                <label>
                  Company
                  <span class="required">*</span>
                </label>

                <input
                  class="company"
                  type="text"
                  placeholder="Company name"
                  value="${escapeHTML(entry.company || "")}"
                  required
                >

              </div>


              <div class="form-group">

                <label>
                  Location
                </label>

                <input
                  class="location"
                  type="text"
                  placeholder="City, Country"
                  value="${escapeHTML(entry.location || "")}"
                >

              </div>


              <div class="form-group">

                <label>
                  Employment Type
                </label>

                <select class="employmentType">

                  <option value="">
                    Select type
                  </option>

                  <option value="Full-time">
                    Full-time
                  </option>

                  <option value="Part-time">
                    Part-time
                  </option>

                  <option value="Internship">
                    Internship
                  </option>

                  <option value="Contract">
                    Contract
                  </option>

                  <option value="Freelance">
                    Freelance
                  </option>

                </select>

              </div>


              <div class="form-group">

                <label>
                  Start Year
                </label>

                <input
                  class="startYear"
                  type="number"
                  min="1950"
                  max="2100"
                  placeholder="2022"
                  value="${entry.startYear || ""}"
                >

              </div>


              <div class="form-group">

                <label>
                  End Year
                </label>

                <input
                  class="endYear"
                  type="number"
                  min="1950"
                  max="2100"
                  placeholder="2025"
                  value="${entry.endYear || ""}"
                >

              </div>


              <div class="form-group full">

                <label class="checkbox-row">

                  <input
                    class="currentJob"
                    type="checkbox"
                    ${entry.currentJob ? "checked" : ""}
                  >

                  <span>
                    I currently work here
                  </span>

                </label>

              </div>


              <div class="form-group full">

                <label>
                  Responsibilities & Achievements
                </label>

                <textarea
                  class="description"
                  placeholder="Describe your responsibilities, achievements and measurable results..."
                >${escapeHTML(entry.description || "")}</textarea>

              </div>

            </div>

          `;


          container.appendChild(card);


          const type =
            card.querySelector(
              ".employmentType"
            );

          type.value =
            entry.employmentType || "";


          const checkbox =
            card.querySelector(
              ".currentJob"
            );

          const endYear =
            card.querySelector(
              ".endYear"
            );


          function updateEndYear() {

            endYear.disabled =
              checkbox.checked;

            if (checkbox.checked) {
              endYear.value = "";
            }

          }


          checkbox.addEventListener(
            "change",
            updateEndYear
          );


          updateEndYear();


          const remove =
            card.querySelector(
              ".remove-entry"
            );


          if (remove) {

            remove.addEventListener(
              "click",
              function () {

                entries.splice(
                  index,
                  1
                );

                render();

              }
            );

          }

        }
      );

    }


    render();


    document
      .getElementById(
        "experienceStatus"
      )
      .addEventListener(
        "change",
        render
      );


    document
      .getElementById(
        "addExperience"
      )
      .addEventListener(
        "click",
        function () {

          if (
            document.getElementById(
              "experienceStatus"
            ).value !== "experienced"
          ) {

            return;

          }

          entries.push({});

          render();

        }
      );


    document
      .getElementById(
        "experienceForm"
      )
      .addEventListener(
        "submit",
        function (event) {

          event.preventDefault();


          const status =
            document.getElementById(
              "experienceStatus"
            ).value;


          const result = [];


          if (status === "experienced") {

            container
              .querySelectorAll(
                ".entry-card"
              )
              .forEach(
                function (card) {

                  result.push({

                    jobTitle:
                      card.querySelector(
                        ".jobTitle"
                      ).value.trim(),

                    company:
                      card.querySelector(
                        ".company"
                      ).value.trim(),

                    location:
                      card.querySelector(
                        ".location"
                      ).value.trim(),

                    employmentType:
                      card.querySelector(
                        ".employmentType"
                      ).value,

                    startYear:
                      card.querySelector(
                        ".startYear"
                      ).value,

                    endYear:
                      card.querySelector(
                        ".endYear"
                      ).value,

                    currentJob:
                      card.querySelector(
                        ".currentJob"
                      ).checked,

                    description:
                      card.querySelector(
                        ".description"
                      ).value.trim()

                  });

                }
              );

          }


          setJSON(
            STORAGE_KEYS.experience,
            {
              status: status,
              entries: result
            }
          );


          window.location.href =
            "projects.html";

        }
      );

  }
);

</script>

</body>
</html>
