<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Experience | Elevora</title>

<link rel="stylesheet" href="css/style.css">

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>


<body>


<header class="navbar">

<a href="index.html" class="logo">Elevora</a>

<nav class="nav-links">

<a href="index.html">Home</a>
<a href="personal.html">Resume</a>
<a href="preview.html">Preview</a>
<a href="cover-letter.html">Cover Letter</a>

<button id="themeToggle" class="theme-toggle" type="button">
🌙
</button>

</nav>

</header>


<main class="page-container">


<div class="form-header">

<div class="step-number">4</div>

<div>

<h1>Experience</h1>

<p>
Tell us about your professional experience.
</p>

</div>

</div>


<div class="progress-wrapper">

<div class="progress-bar">
<div class="progress-fill" style="width:40%"></div>
</div>

<span>4 of 10</span>

</div>


<div class="form-card">


<div class="form-group">

<label>Experience Level</label>

<select id="experienceType">

<option value="Experienced">
Experienced
</option>

<option value="Fresher">
Fresher
</option>

<option value="Student">
Student
</option>

</select>

</div>


<div id="experienceArea">

<div
id="entryList"
class="entry-list"
></div>


<form id="entryForm">


<div class="form-group">

<label>Job Title</label>

<input
id="jobTitle"
placeholder="Software Engineer"
>

</div>


<div class="form-group">

<label>Company</label>

<input
id="company"
placeholder="Company name"
>

</div>


<div class="form-group">

<label>Location</label>

<input
id="location"
placeholder="City, Country"
>

</div>


<div class="form-group">

<label>Start Year</label>

<input
id="startYear"
type="number"
placeholder="2022"
>

</div>


<div class="form-group">

<label>End Year</label>

<input
id="endYear"
type="number"
placeholder="2025"
>

</div>


<div class="checkbox-row">

<input
id="currentJob"
type="checkbox"
>

<label for="currentJob">
I currently work here
</label>

</div>


<div class="form-group">

<label>Responsibilities / Achievements</label>

<textarea
id="description"
placeholder="Describe your responsibilities and achievements..."
></textarea>

</div>


<div class="form-actions">

<button
type="button"
id="cancelEdit"
class="btn secondary"
style="display:none"
>
Cancel
</button>

<button
type="submit"
id="saveBtn"
class="btn primary"
>
+ Add Experience
</button>

</div>


<div
id="status"
class="form-status"
></div>

</form>

</div>


<div class="form-actions">

<a href="education.html" class="btn secondary">
← Back
</a>

<a href="projects.html" class="btn primary">
Save & Continue →
</a>

</div>


</div>

</main>


<script>

window.MULTI_CONFIG = {

key:"experience",

addText:"+ Add Experience",

fields:[

{id:"jobTitle"},

{id:"company"},

{id:"location"},

{id:"startYear"},

{id:"endYear"},

{id:"currentJob",type:"checkbox"},

{id:"description"}

],

title:entry =>
entry.jobTitle ||
entry.company ||
"Experience",

meta:entry =>
[
entry.company,
entry.location,
entry.startYear,
entry.currentJob
? "Present"
: entry.endYear
]
.filter(Boolean)
.join(" • ")

};


document
.getElementById("experienceType")
.addEventListener(
"change",
function(){

const area =
document.getElementById(
"experienceArea"
);

if(this.value === "Fresher" ||
this.value === "Student"){

area.style.display = "none";

}else{

area.style.display = "block";

}

});


</script>

<script src="js/multi.js"></script>

</body>
</html>
