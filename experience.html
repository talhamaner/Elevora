<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Experience - Elevora</title>

<link rel="stylesheet" href="css/style.css">

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>

<body>

<header class="navbar">

<a class="logo" href="index.html">Elevora</a>

<nav class="nav-links">

<a href="index.html">Home</a>
<a href="personal.html">Resume</a>
<a href="preview.html">Preview</a>
<a href="cover-letter.html">Cover Letter</a>

<button id="themeToggle" class="theme-toggle">
🌙
</button>

</nav>

</header>


<main class="container">

<div class="page-head">

<h1>Experience</h1>

<p>
Add multiple jobs, internships, freelance roles or other professional experience.
</p>

</div>


<div class="builder">

<aside class="steps">

<a href="personal.html">1. Personal</a>
<a href="summary.html">2. Summary</a>
<a href="education.html">3. Education</a>
<a href="experience.html">4. Experience</a>
<a href="projects.html">5. Projects</a>
<a href="skills.html">6. Skills</a>
<a href="certifications.html">7. Certifications</a>
<a href="languages.html">8. Languages</a>
<a href="achievements.html">9. Achievements</a>
<a href="preview.html">10. Preview</a>

</aside>


<section class="form-card">

<div id="entryList" class="entry-list"></div>


<form id="entryForm">

<div class="form-grid">

<div class="form-group">

<label>Job Title</label>

<input
id="jobTitle"
placeholder="Software Developer">

</div>


<div class="form-group">

<label>Company / Organization</label>

<input
id="company"
placeholder="Example Company">

</div>


<div class="form-group">

<label>Location</label>

<input
id="location"
placeholder="City, Country">

</div>


<div class="form-group">

<label>Start Year</label>

<input
id="startYear"
type="number"
placeholder="2024">

</div>


<div class="form-group">

<label>End Year</label>

<input
id="endYear"
type="number"
placeholder="2025">

</div>


<div class="form-group">

<label class="checkbox">

<input
id="current"
type="checkbox">

Currently Working

</label>

</div>


<div class="form-group full">

<label>Responsibilities / Achievements</label>

<textarea
id="description"
placeholder="Describe your responsibilities and achievements...">
</textarea>

</div>

</div>


<div class="actions">

<button
type="button"
id="cancelEdit"
class="btn secondary"
style="display:none">

Cancel Edit

</button>


<button
id="saveBtn"
class="btn">

+ Add Experience

</button>

</div>


<div id="status" class="status"></div>

</form>


<div class="actions">

<a
class="btn secondary"
href="education.html">

← Back

</a>

<a
class="btn"
href="projects.html">

Save & Continue →

</a>

</div>

</section>

</div>

</main>


<script>

window.MULTI_CONFIG = {

key: "experience",

addText: "+ Add Experience",

fields: [

{id:"jobTitle"},

{id:"company"},

{id:"location"},

{id:"startYear"},

{id:"endYear"},

{
id:"current",
type:"checkbox"
},

{
id:"description",
type:"textarea"
}

],

title: function(entry) {

return entry.jobTitle ||
       entry.company ||
       "Experience";

},

meta: function(entry) {

return [

entry.company,
entry.location,
entry.startYear,
entry.current ? "Present" : entry.endYear

]
.filter(Boolean)
.join(" • ");

}

};

</script>

<script src="js/multi.js"></script>

</body>
</html>
