<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personal Information - Resume Builder</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
    min-height:100vh;
}

.navbar{
    width:100%;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
    padding:18px 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.navbar nav{
    display:flex;
    gap:28px;
}

.navbar nav a{
    color:#172033;
    text-decoration:none;
    font-weight:600;
}

.navbar nav a:hover{
    color:#4361ee;
}

.page{
    width:100%;
    max-width:1050px;
    margin:auto;
    padding:45px 20px 70px;
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.badge{
    display:inline-block;
    background:#e8edff;
    color:#4361ee;
    padding:8px 16px;
    border-radius:50px;
    font-size:13px;
    font-weight:700;
}

.header h1{
    margin:17px 0 9px;
    font-size:40px;
}

.header p{
    color:#64748b;
    font-size:15px;
}

.required{
    color:#e63946;
}

.card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:18px;
    padding:35px;
    box-shadow:0 10px 35px rgba(15,23,42,.06);
}

.card h2{
    font-size:24px;
    margin-bottom:28px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:0;
}

.full{
    grid-column:1 / -1;
}

label{
    font-size:15px;
    font-weight:700;
}

input,
select{
    width:100%;
    height:48px;
    border:1px solid #d5dbe5;
    border-radius:9px;
    background:#fff;
    color:#172033;
    padding:0 14px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#4361ee;
    box-shadow:0 0 0 3px rgba(67,97,238,.12);
}

select:disabled{
    background:#f1f3f7;
    color:#8b95a7;
    cursor:not-allowed;
}

.phone-row{
    display:grid;
    grid-template-columns:190px 1fr;
    gap:10px;
}

.phone-country{
    display:flex;
    align-items:center;
    gap:8px;
}

.phone-country select{
    flex:1;
}

.flag{
    font-size:21px;
}

.error-message{
    display:none;
    margin-bottom:20px;
    padding:14px 16px;
    background:#fef2f2;
    border:1px solid #fecaca;
    border-radius:9px;
    color:#b91c1c;
    font-size:14px;
}

.location-status{
    display:none;
    padding:10px 13px;
    border-radius:8px;
    font-size:13px;
    color:#1d4ed8;
    background:#eff6ff;
    border:1px solid #bfdbfe;
}

.location-status.error{
    color:#b91c1c;
    background:#fef2f2;
    border-color:#fecaca;
}

.manual-location{
    display:none;
    padding:18px;
    background:#f8fafc;
    border:1px dashed #cbd5e1;
    border-radius:10px;
}

.manual-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.actions{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-top:25px;
}

.btn{
    min-height:48px;
    padding:12px 25px;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:none;
}

.back{
    color:#172033;
    background:#fff;
    border:1px solid #d5dbe5;
}

.next{
    color:#fff;
    background:#4361ee;
}

.next:hover{
    background:#3048c8;
}

.next:disabled{
    opacity:.7;
    cursor:not-allowed;
}

@media(max-width:700px){

    .navbar{
        padding:15px 5%;
    }

    .navbar nav{
        gap:13px;
    }

    .navbar nav a{
        font-size:13px;
    }

    .page{
        padding:30px 13px 50px;
    }

    .header h1{
        font-size:30px;
    }

    .card{
        padding:22px 17px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .phone-row{
        grid-template-columns:1fr;
    }

    .manual-grid{
        grid-template-columns:1fr;
    }

    .actions{
        flex-direction:column-reverse;
    }

    .btn{
        width:100%;
    }
}

</style>

</head>

<body>

<header class="navbar">

    <div class="logo">
        Resume Builder
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="personal.html">Resume</a>
        <a href="preview.html">Preview</a>
    </nav>

</header>


<main class="page">

    <section class="header">

        <span class="badge">
            Step 1 of 10
        </span>

        <h1>
            Personal Information
        </h1>

        <p>
            Enter your personal and contact information.
        </p>

    </section>


    <form id="personalForm" novalidate>

        <div
            id="errorMessage"
            class="error-message"
        ></div>


        <section class="card">

            <h2>
                Basic Information
            </h2>


            <div class="form-grid">


                <div class="form-group">

                    <label for="firstName">
                        First Name
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter your first name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="lastName">
                        Last Name
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter your last name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                        <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="mobileNumber">
                        Mobile Number
                        <span class="required">*</span>
                    </label>

                    <div class="phone-row">

                        <div class="phone-country">

                            <span
                                id="phoneFlag"
                                class="flag"
                            >
                                🇮🇳
                            </span>

                            <select
                                id="phoneCountry"
                            ></select>

                        </div>

                        <input
                            type="tel"
                            id="mobileNumber"
                            placeholder="Mobile number"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="country">
                        Country
                        <span class="required">*</span>
                    </label>

                    <select
                        id="country"
                        required
                    >

                        <option value="">
                            Select country
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="state">
                        State / Province / Region
                        <span class="required">*</span>
                    </label>

                    <select
                        id="state"
                        disabled
                        required
                    >

                        <option value="">
                            Select country first
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="district">
                        District / City / Town
                        <span class="required">*</span>
                    </label>

                    <select
                        id="district"
                        disabled
                        required
                    >

                        <option value="">
                            Select state first
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="postalCode">
                        PIN / ZIP / Postal Code
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="postalCode"
                        placeholder="PIN / ZIP / Postal code"
                        required
                    >

                </div>


                <div class="form-group full">

                    <div
                        id="locationStatus"
                        class="location-status"
                    ></div>

                </div>


                <div
                    id="manualLocation"
                    class="manual-location full"
                >

                    <div class="manual-grid">

                        <div class="form-group">

                            <label for="manualState">
                                State / Province / Region
                            </label>

                            <input
                                type="text"
                                id="manualState"
                                placeholder="Enter state / province / region"
                            >

                        </div>


                        <div class="form-group">

                            <label for="manualCity">
                                District / City / Town
                            </label>

                            <input
                                type="text"
                                id="manualCity"
                                placeholder="Enter district / city / town"
                            >

                        </div>

                    </div>

                </div>


                <div class="form-group full">

                    <label for="professionalTitle">
                        Professional Title
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="professionalTitle"
                        placeholder="e.g. Software Developer"
                        required
                    >

                </div>


                <div class="form-group full">

                    <label for="linkedin">
                        LinkedIn Profile
                    </label>

                    <input
                        type="url"
                        id="linkedin"
                        placeholder="https://linkedin.com/in/your-profile"
                    >

                </div>


                <div class="form-group full">

                    <label for="website">
                        Portfolio / Website
                    </label>

                    <input
                        type="url"
                        id="website"
                        placeholder="https://yourwebsite.com"
                    >

                </div>

            </div>

        </section>


        <div class="actions">

            <a
                href="index.html"
                class="btn back"
            >
                ← Back
            </a>

            <button
                type="submit"
                class="btn next"
                id="continueButton"
            >
                Save & Continue →
            </button>

        </div>

    </form>

</main>

/* ============================================
   LOAD COUNTRY LIST
============================================ */

function loadCountries(){

    const sorted =
    [...countries].sort(
        (a,b) =>
        a[1].localeCompare(b[1])
    );

    sorted.forEach(country => {

        const option =
        document.createElement("option");

        option.value =
        country[0];

        option.textContent =
        country[2] + " " + country[1];

        countrySelect.appendChild(option);


        const phoneOption =
        document.createElement("option");

        phoneOption.value =
        country[0];

        phoneOption.textContent =
        country[2] + " " +
        country[1] +
        " " +
        country[3];

        phoneCountry.appendChild(
            phoneOption
        );

    });

}

        mobileNumber.placeholder =
        country[3] +

);

        }

        loadStates(code);

    }
);


/* ============================================
   LOCATION STATUS
============================================ */

function showStatus(
    text,
    error=false
){

    locationStatus.textContent =
    text;

    locationStatus.className =
    "location-status";

    if(error){

        locationStatus.classList.add(
            "error"
        );

    }

    locationStatus.style.display =
    "block";
}


function hideStatus(){

    locationStatus.style.display =
    "none";

}


/* ============================================
   LOAD STATES
============================================ */

async function loadStates(
    countryCode
){

    stateSelect.innerHTML =
    '<option value="">Loading states...</option>';

    stateSelect.disabled =
    true;

    districtSelect.innerHTML =
    '<option value="">Select state first</option>';

    districtSelect.disabled =
    true;

    manualLocation.style.display =
    "none";

    if(!countryCode){

        stateSelect.innerHTML =
        '<option value="">Select country first</option>';

        return;

    }

    const country =
    countries.find(
        item =>
        item[0] === countryCode
    );

    if(!country){
        return;
    }

    showStatus(
        "Loading location information..."
    );

    try{

        const response =
        await fetch(
            "https://countriesnow.space/api/v0.1/countries/states",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({
                    country:
                    country[1]
                })
            }
        );

        if(!response.ok){
            throw new Error();
        }

        const result =
        await response.json();

        if(
            result.error ||
            !result.data ||
            !result.data.states ||
            !result.data.states.length
        ){

            throw new Error();

        }

        stateSelect.innerHTML =
        '<option value="">Select state / province / region</option>';

        result.data.states
        .sort(
            (a,b) =>
            a.name.localeCompare(b.name)
        )
        .forEach(state => {

            const option =
            document.createElement("option");

            option.value =
            state.name;

            option.textContent =
            state.name;

            stateSelect.appendChild(
                option
            );

        });

        stateSelect.disabled =
        false;

        hideStatus();

    }
    catch(error){

        stateSelect.innerHTML =
        '<option value="">Location unavailable</option>';

        stateSelect.disabled =
        true;

        districtSelect.innerHTML =
        '<option value="">Use manual entry</option>';

        districtSelect.disabled =
        true;

        manualLocation.style.display =
        "block";

        showStatus(
            "Location data is temporarily unavailable. You can enter your location manually.",
            true
        );

    }

}


/* ============================================
   STATE CHANGE
============================================ */

stateSelect.addEventListener(
    "change",
    function(){

        const countryCode =
        countrySelect.value;

        const stateName =
        stateSelect.value;

        if(!stateName){

            districtSelect.innerHTML =
            '<option value="">Select state first</option>';

            districtSelect.disabled =
            true;

            return;

        }

        loadCities(
            countryCode,
            stateName
        );

    }
);


/* ============================================
   LOAD CITIES
============================================ */

async function loadCities(
    countryCode,
    stateName
){

    const country =
    countries.find(
        item =>
        item[0] === countryCode
    );

    if(!country){
        return;
    }

    districtSelect.innerHTML =
    '<option value="">Loading cities...</option>';

    districtSelect.disabled =
    true;

    showStatus(
        "Loading cities..."
    );

    try{

        const response =
        await fetch(
            "https://countriesnow.space/api/v0.1/countries/state/cities",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({
                    country:
                    country[1],
                    state:
                    stateName
                })
            }
        );

        if(!response.ok){
            throw new Error();
        }

        const result =
        await response.json();

        if(
            result.error ||
            !Array.isArray(result.data) ||
            !result.data.length
        ){

            throw new Error();

        }

        const cities =
        [...new Set(
            result.data
            .map(city =>
                String(city).trim()
            )
            .filter(Boolean)
        )].sort(
            (a,b) =>
            a.localeCompare(b)
        );

        districtSelect.innerHTML =
        '<option value="">Select district / city / town</option>';

        cities.forEach(city => {

            const option =
            document.createElement("option");

            option.value =
            city;

            option.textContent =
            city;

            districtSelect.appendChild(
                option
            );

        });

        districtSelect.disabled =
        false;

        hideStatus();

    }
    catch(error){

        districtSelect.innerHTML =
        '<option value="">Location unavailable</option>';

        districtSelect.disabled =
        true;

        manualLocation.style.display =
        "block";

        showStatus(
            "City data is temporarily unavailable. You can enter your city manually.",
            true
        );

    }

}


/* ============================================
   RESTORE SAVED DATA
============================================ */

function restoreData(){

    const saved =
    localStorage.getItem(
        "resumePersonalData"
    );

    if(!saved){
        return;
    }

    try{

        const data =
        JSON.parse(saved);

        document.getElementById(
            "firstName"
        ).value =
        data.firstName || "";

        document.getElementById(
            "lastName"
        ).value =
        data.lastName || "";

        document.getElementById(
            "email"
        ).value =
        data.email || "";

        document.getElementById(
            "mobileNumber"
        ).value =
        data.mobileNumber || "";

        document.getElementById(
            "postalCode"
        ).value =
        data.postalCode || "";

        document.getElementById(
            "professionalTitle"
        ).value =
        data.professionalTitle || "";

        document.getElementById(
            "linkedin"
        ).value =
        data.linkedin || "";

        document.getElementById(
            "website"
        ).value =
        data.website || "";

        if(data.countryCode){

            countrySelect.value =
            data.countryCode;

            phoneCountry.value =
            data.countryCode;

            const country =
            countries.find(
                item =>
                item[0] ===
                data.countryCode
            );

            if(country){

                phoneFlag.textContent =
                country[2];

                mobileNumber.placeholder =
                country[3] +
                " Mobile number";

            }

            loadStates(
                data.countryCode
            )
            .then(
                () => {

                    if(data.state){

                        stateSelect.value =
                        data.state;

                        loadCities(
                            data.countryCode,
                            data.state
                        )
                        .then(
                            () => {

                                if(
                                    data.district
                                ){

                                    districtSelect.value =
                                    data.district;

                                }

                            }
                        );

                    }

                }
            );

        }

    }
    catch(error){

        console.log(
            "Saved data could not be restored."
        );

    }

}

        errorMessage.style.display =
        "none";


        let state =
        stateSelect.value;

        let district =
        districtSelect.value;


        if(
            manualLocation.style.display !==

        ){

            }

            if(

            ){

                manualCity.value.trim();

            }

        }


        const data = {

            firstName:
            document.getElementById(
                "firstName"
            ).value.trim(),

            lastName:
            document.getElementById(
                "lastName"
            ).value.trim(),

            email:
            document.getElementById(
                "email"
            ).value.trim(),

            mobileNumber:
            mobileNumber.value.trim(),

            phoneCountry:
            phoneCountry.value,

            countryCode:
            countrySelect.value,

            country:
            countrySelect.options[
                countrySelect.selectedIndex
            ]?.textContent || "",

            state:
            state,

            district:
            district,

            postalCode:
            document.getElementById(
                "postalCode"
            ).value.trim(),

            professionalTitle:
            document.getElementById(
                "professionalTitle"
            ).value.trim(),

            linkedin:
            document.getElementById(
                "linkedin"
            ).value.trim(),

            website:
            document.getElementById(
                "website"
            ).value.trim()

        };


        if(
            !data.firstName ||
            !data.lastName ||
            !data.email ||
            !data.mobileNumber ||
            !data.countryCode ||
            !data.state ||
            !data.district ||
            !data.postalCode ||
            !data.professionalTitle
        ){

            errorMessage.textContent =
            "Please complete all required fields marked with *.";

            errorMessage.style.display =
            "block";

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

            return;

        }


        const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if(
            !emailPattern.test(
                data.email
            )
        ){

            errorMessage.textContent =
            "Please enter a valid email address.";

            errorMessage.style.display =
            "block";

            return;

        }


        localStorage.setItem(
            "resumePersonalData",
            JSON.stringify(data)
        );


        const button =
        document.getElementById(
            "continueButton"
        );

        button.disabled =
        true;

        button.textContent =
        "Saving...";


        setTimeout(
            function(){

                window.location.href =
                "summary.html";

            },
            400
        );

    }
);
