<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal Information - Resume Builder</title>


    <!-- =========================================
         INTERNATIONAL PHONE CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.12.5/dist/css/intlTelInput.css"
    >


    <style>

        /* =========================================
           RESET
        ========================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================================
           BODY
        ========================================== */

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f5f7fb;

            color:
                #172033;

            min-height:
                100vh;
        }


        /* =========================================
           NAVBAR
        ========================================== */

        .navbar {

            background:
                #ffffff;

            border-bottom:
                1px solid #e5e7eb;

            padding:
                18px 7%;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            position:
                sticky;

            top:
                0;

            z-index:
                1000;
        }


        .logo {

            font-size:
                22px;

            font-weight:
                800;

            color:
                #172033;
        }


        .navbar nav {

            display:
                flex;

            gap:
                25px;
        }


        .navbar a {

            text-decoration:
                none;

            color:
                #172033;

            font-weight:
                600;
        }


        .navbar a:hover {

            color:
                #4361ee;
        }


        /* =========================================
           MAIN PAGE
        ========================================== */

        .page {

            max-width:
                1050px;

            margin:
                auto;

            padding:
                60px 20px;
        }


        /* =========================================
           HEADER
        ========================================== */

        .header {

            text-align:
                center;

            margin-bottom:
                35px;
        }


        .badge {

            display:
                inline-block;

            background:
                #e8edff;

            color:
                #4361ee;

            padding:
                8px 15px;

            border-radius:
                30px;

            font-size:
                14px;

            font-weight:
                700;
        }


        h1 {

            font-size:
                42px;

            margin:
                18px 0 10px;
        }


        .header p {

            color:
                #64748b;

            font-size:
                17px;

            line-height:
                1.6;
        }


        .required {

            color:
                #e63946;
        }


        /* =========================================
           CARD
        ========================================== */

        .card {

            background:
                #ffffff;

            padding:
                35px;

            border-radius:
                18px;

            border:
                1px solid #e5e7eb;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.05);
        }


        .card h2 {

            margin-bottom:
                25px;

            font-size:
                24px;
        }


        /* =========================================
           FORM GRID
        ========================================== */

        .form-grid {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                22px;
        }


        .form-group {

            display:
                flex;

            flex-direction:
                column;

            gap:
                8px;
        }


        .full {

            grid-column:
                1 / -1;
        }


        label {

            font-weight:
                700;

            color:
                #172033;
        }


        .help-text {

            font-size:
                12px;

            color:
                #64748b;

            line-height:
                1.5;
        }


        /* =========================================
           INPUTS
        ========================================== */

        input,
        select {

            width:
                100%;

            padding:
                14px;

            border:
                1px solid #d5dbe5;

            border-radius:
                9px;

            font-size:
                15px;

            outline:
                none;

            background:
                #ffffff;

            color:
                #172033;

            transition:
                0.2s;
        }


        input:focus,
        select:focus {

            border-color:
                #4361ee;

            box-shadow:
                0 0 0 3px
                rgba(67, 97, 238, 0.12);
        }


        input::placeholder {

            color:
                #9aa3b2;
        }


        select:disabled {

            background:
                #f1f3f7;

            color:
                #8b95a7;

            cursor:
                not-allowed;
        }


        /* =========================================
           PHONE
        ========================================== */

        .phone-wrapper {

            width:
                100%;
        }


        .iti {

            width:
                100%;
        }


        .iti input {

            width:
                100%;

            padding-top:
                14px;

            padding-bottom:
                14px;
        }


        .iti__country-list {

            max-width:
                360px;

            z-index:
                2000;
        }


        /* =========================================
           LOCATION STATUS
        ========================================== */

        .location-status {

            display:
                none;

            padding:
                12px 14px;

            margin-top:
                10px;

            background:
                #f1f5ff;

            border:
                1px solid #dbe3ff;

            border-radius:
                8px;

            color:
                #4054a5;

            font-size:
                13px;

            line-height:
                1.5;
        }


        .location-status.error {

            background:
                #fff1f2;

            border-color:
                #fecdd3;

            color:
                #be123c;
        }


        .location-status.success {

            background:
                #f0fdf4;

            border-color:
                #bbf7d0;

            color:
                #166534;
        }


        .location-note {

            display:
                none;

            font-size:
                12px;

            color:
                #64748b;

            line-height:
                1.5;
        }


        /* =========================================
           ERROR MESSAGE
        ========================================== */

        .error-message {

            display:
                none;

            color:
                #dc2626;

            background:
                #fef2f2;

            border:
                1px solid #fecaca;

            padding:
                13px;

            border-radius:
                8px;

            margin-bottom:
                20px;

            font-size:
                14px;

            line-height:
                1.5;
        }


        /* =========================================
           BUTTONS
        ========================================== */

        .actions {

            margin-top:
                25px;

            display:
                flex;

            justify-content:
                space-between;

            gap:
                15px;
        }


        .btn {

            border:
                none;

            border-radius:
                10px;

            padding:
                14px 24px;

            font-size:
                15px;

            font-weight:
                700;

            text-decoration:
                none;

            cursor:
                pointer;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            transition:
                0.2s;
        }


        .btn:hover {

            transform:
                translateY(-1px);
        }


        .back {

            background:
                #ffffff;

            color:
                #172033;

            border:
                1px solid #d5dbe5;
        }


        .next {

            background:
                #4361ee;

            color:
                #ffffff;
        }


        .next:hover {

            background:
                #3048c8;
        }


        /* =========================================
           LOADING SPINNER
        ========================================== */

        .loading-dot {

            display:
                inline-block;

            width:
                7px;

            height:
                7px;

            margin-left:
                5px;

            border-radius:
                50%;

            background:
                #4361ee;

            animation:
                pulse 1s infinite;
        }


        @keyframes pulse {

            0% {
                opacity:
                    0.2;
            }

            50% {
                opacity:
                    1;
            }

            100% {
                opacity:
                    0.2;
            }

        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 700px) {

            .navbar {

                padding:
                    15px 5%;
            }


            .navbar nav {

                gap:
                    12px;
            }


            .navbar nav a {

                font-size:
                    13px;
            }


            .page {

                padding:
                    40px 15px;
            }


            h1 {

                font-size:
                    32px;
            }


            .header p {

                font-size:
                    15px;
            }


            .card {

                padding:
                    22px;

                border-radius:
                    14px;
            }


            .form-grid {

                grid-template-columns:
                    1fr;
            }


            .full {

                grid-column:
                    auto;
            }


            .actions {

                flex-direction:
                    column-reverse;
            }


            .btn {

                width:
                    100%;
            }


            .iti__country-list {

                max-width:
                    300px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     NAVBAR
========================================== -->

<header class="navbar">

    <div class="logo">
        Resume Builder
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="personal.html">
            Resume
        </a>

        <a href="preview.html">
            Preview
        </a>

    </nav>

</header>



<!-- =========================================
     MAIN
========================================== -->

<main class="page">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="header">

        <span class="badge">
            Step 1 of 10
        </span>


        <h1>
            Personal Information
        </h1>


        <p>
            Tell us about yourself.
            Fields marked with
            <strong class="required">*</strong>
            are required.
        </p>

    </div>



    <!-- =====================================
         FORM
    ====================================== -->

    <form
        id="personalForm"
        novalidate
    >


        <!-- =================================
             ERROR
        ================================== -->

        <div
            id="errorMessage"
            class="error-message"
        ></div>



        <!-- =================================
             PERSONAL CARD
        ================================== -->

        <div class="card">


            <h2>
                Basic Information
            </h2>


            <div class="form-grid">


                <!-- =============================
                     FIRST NAME
                ============================== -->

                <div class="form-group">

                    <label for="firstName">

                        First Name

                        <span class="required">
                            *
                        </span>

                    </label>


                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter your first name"
                        autocomplete="given-name"
                        required
                    >

                </div>



                <!-- =============================
                     LAST NAME
                ============================== -->

                <div class="form-group">

                    <label for="lastName">

                        Last Name

                        <span class="required">
                            *
                        </span>

                    </label>


                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter your last name"
                        autocomplete="family-name"
                        required
                    >

                </div>



                <!-- =============================
                     EMAIL
                ============================== -->

                <div class="form-group">

                    <label for="email">

                        Email

                        <span class="required">
                            *
                        </span>

                    </label>


                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- =============================
                     MOBILE
                ============================== -->

                <div class="form-group">

                    <label for="phone">

                        Mobile Number

                        <span class="required">
                            *
                        </span>

                    </label>


                    <div class="phone-wrapper">

                        <input
                            type="tel"
                            id="phone"
                            autocomplete="tel"
                            required
                        >

                    </div>


                    <small class="help-text">
                        Select your country from the flag.
                    </small>

                </div>



                <!-- =============================
                     COUNTRY
                ============================== -->

                <div class="form-group">

                    <label for="country">

                        Country

                        <span class="required">
                            *
                        </span>

                    </label>


                    <select
                        id="country"
                        required
                    >

                        <option value="">
                            Loading countries...
                        </option>

                    </select>


                    <small class="help-text">
                        More than 200 countries are supported.
                    </small>

                </div>



                <!-- =============================
                     STATE
                ============================== -->

                <div class="form-group">

                    <label for="state">

                        State / Province / Region

                        <span class="required">
                            *
                        </span>

                    </label>


                    <select
                        id="state"
                        required
                        disabled
                    >

                        <option value="">
                            Select country first
                        </option>

                    </select>

                </div>



                <!-- =============================
                     DISTRICT / CITY
                ============================== -->

                <div class="form-group">

                    <label for="district">

                        District / City / Town

                        <span class="required">
                            *
                        </span>

                    </label>


                    <select
                        id="district"
                        required
                        disabled
                    >

                        <option value="">
                            Select state first
                        </option>

                    </select>


                    <small
                        id="districtNote"
                        class="location-note"
                    ></small>

                </div>



                <!-- =============================
                     POSTAL CODE
                ============================== -->

                <div class="form-group">

                    <label for="postalCode">

                        PIN / ZIP / Postal Code

                        <span class="required">
                            *
                        </span>

                    </label>


                    <input
                        type="text"
                        id="postalCode"
                        placeholder="PIN / ZIP / Postal code"
                        autocomplete="postal-code"
                        required
                    >

                </div>



                <!-- =============================
                     LOCATION STATUS
                ============================== -->

                <div class="form-group full">

                    <div
                        id="locationStatus"
                        class="location-status"
                    ></div>

                </div>



                <!-- =============================
                     PROFESSIONAL TITLE
                ============================== -->

                <div class="form-group full">

                    <label for="professionalTitle">

                        Professional Title

                        <span class="required">
                            *
                        </span>

                    </label>


                    <input
                        type="text"
                        id="professionalTitle"
                        placeholder="e.g. Software Developer"
                        required
                    >

                </div>



                <!-- =============================
                     LINKEDIN
                ============================== -->

                <div class="form-group full">

                    <label for="linkedin">

                        LinkedIn Profile

                    </label>


                    <input
                        type="url"
                        id="linkedin"
                        placeholder="https://linkedin.com/in/your-profile"
                        autocomplete="url"
                    >

                </div>



                <!-- =============================
                     WEBSITE
                ============================== -->

                <div class="form-group full">

                    <label for="website">

                        Portfolio / Website

                    </label>


                    <input
                        type="url"
                        id="website"
                        placeholder="https://yourwebsite.com"
                        autocomplete="url"
                    >

                </div>


            </div>

        </div>



        <!-- =====================================
             ACTIONS
        ====================================== -->

        <div class="actions">


            <a
                href="index.html"
                class="btn back"
            >
                ← Back
            </a>


            <button
                type="submit"
                class="btn next"
            >
                Save & Continue →
            </button>


        </div>


    </form>


</main>



<!-- =========================================
     INTERNATIONAL PHONE JAVASCRIPT
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.12.5/dist/js/intlTelInput.min.js"></script>



<!-- =========================================
     MAIN JAVASCRIPT
========================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =====================================
           GET ELEMENTS
        ====================================== */

        const phoneInput =
            document.getElementById("phone");


        const countrySelect =
            document.getElementById("country");


        const stateSelect =
            document.getElementById("state");


        const districtSelect =
            document.getElementById("district");


        const districtNote =
            document.getElementById("districtNote");


        const locationStatus =
            document.getElementById("locationStatus");


        const errorMessage =
            document.getElementById("errorMessage");


        const form =
            document.getElementById("personalForm");



        /* =====================================
           INDIA DATA
        ====================================== */

        let indiaData = [];



        /* =====================================
           PHONE
        ====================================== */

        const iti =
            window.intlTelInput(
                phoneInput,
                {

                    initialCountry:
                        "in",

                    separateDialCode:
                        true,

                    preferredCountries:
                        [
                            "in",
                            "us",
                            "gb",
                            "ca",
                            "au",
                            "ae"
                        ],

                    loadUtils:
                        function () {

                            return import(
                                "https://cdn.jsdelivr.net/npm/intl-tel-input@25.12.5/dist/js/utils.js"
                            );

                        }

                }
            );



        /* =====================================
           STATUS
        ====================================== */

        function showStatus(
            message,
            type = "normal"
        ) {

            locationStatus.textContent =
                message;


            locationStatus.className =
                "location-status";


            if (
                type === "error"
            ) {

                locationStatus.classList.add(
                    "error"
                );

            }


            if (
                type === "success"
            ) {

                locationStatus.classList.add(
                    "success"
                );

            }


            locationStatus.style.display =
                "block";

        }


        function hideStatus() {

            locationStatus.style.display =
                "none";

        }



        /* =====================================
           ERROR
        ====================================== */

        function showError(
            message
        ) {

            errorMessage.textContent =
                message;


            errorMessage.style.display =
                "block";


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }


        function hideError() {

            errorMessage.style.display =
                "none";

        }



        /* =====================================
           GET SAVED DATA
        ====================================== */

        function getSavedData() {

            try {

                const data =
                    localStorage.getItem(
                        "resumePersonalData"
                    );


                if (!data) {

                    return null;

                }


                return JSON.parse(
                    data
                );

            }

            catch (error) {

                console.error(
                    "Saved data error:",
                    error
                );


                return null;

            }

        }



        /* =====================================
           LOAD INDIA DATA
        ====================================== */

        async function loadIndiaData() {

            try {

                const response =
                    await fetch(
                        "https://raw.githubusercontent.com/CodingMation/indian-states-districts/main/data/india_states_districts.min.json"
                    );


                if (!response.ok) {

                    throw new Error(
                        "India data request failed"
                    );

                }


                indiaData =
                    await response.json();


                console.log(
                    "India location data loaded."
                );

            }

            catch (error) {

                console.error(
                    "India data error:",
                    error
                );

            }

        }



        /* =====================================
           LOAD COUNTRIES
        ====================================== */

        async function loadCountries() {


            countrySelect.innerHTML =
                '<option value="">Loading countries...</option>';


            countrySelect.disabled =
                true;


            try {


                showStatus(
                    "Loading international countries..."
                );


                /*
                 * CountriesNow API
                 */

                const response =
                    await fetch(
                        "https://countriesnow.space/api/v0.1/countries"
                    );


                if (!response.ok) {

                    throw new Error(
                        "CountriesNow failed"
                    );

                }


                const result =
                    await response.json();


                let countries =
                    result.data || [];


                if (
                    !countries.length
                ) {

                    throw new Error(
                        "Country list was empty"
                    );

                }



                /*
                 * Sort countries
                 */

                countries =
                    countries
                        .filter(
                            function (country) {

                                return (
                                    country.name &&
                                    country.iso2
                                );

                            }
                        )
                        .sort(
                            function (a, b) {

                                return a.name.localeCompare(
                                    b.name
                                );

                            }
                        );



                /*
                 * Clear dropdown
                 */

                countrySelect.innerHTML =
                    '<option value="">Select country</option>';



                /*
                 * Add countries
                 */

                countries.forEach(
                    function (country) {


                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            country.iso2
                                .toLowerCase();


                        option.textContent =
                            country.name;


                        countrySelect.appendChild(
                            option
                        );

                    }
                );



                countrySelect.disabled =
                    false;


                hideStatus();


                /*
                 * Restore country
                 */

                const saved =
                    getSavedData();


                if (
                    saved &&
                    saved.countryCode
                ) {


                    countrySelect.value =
                        saved.countryCode
                            .toLowerCase();


                    await handleCountryChange(
                        saved.stateCode || "",
                        saved.districtCode || ""
                    );

                }

            }

            catch (error) {

                console.error(
                    "Country loading error:",
                    error
                );


                /*
                 * FALLBACK COUNTRY SOURCE
                 */

                await loadCountriesFallback();

            }

        }



        /* =====================================
           FALLBACK COUNTRY LIST
        ====================================== */

        async function loadCountriesFallback() {

            try {


                showStatus(
                    "Using backup country database..."
                );


                const response =
                    await fetch(
                        "https://restcountries.com/v3.1/all?fields=name,cca2"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Fallback country API failed"
                    );

                }


                const data =
                    await response.json();


                const countries =
                    data
                        .filter(
                            function (country) {

                                return (
                                    country.name &&
                                    country.name.common &&
                                    country.cca2
                                );

                            }
                        )
                        .sort(
                            function (a, b) {

                                return a.name.common.localeCompare(
                                    b.name.common
                                );

                            }
                        );


                countrySelect.innerHTML =
                    '<option value="">Select country</option>';


                countries.forEach(
                    function (country) {


                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            country.cca2.toLowerCase();


                        option.textContent =
                            country.name.common;


                        countrySelect.appendChild(
                            option
                        );

                    }
                );


                countrySelect.disabled =
                    false;


                hideStatus();


                const saved =
                    getSavedData();


                if (
                    saved &&
                    saved.countryCode
                ) {


                    countrySelect.value =
                        saved.countryCode
                            .toLowerCase();


                    await handleCountryChange(
                        saved.stateCode || "",
                        saved.districtCode || ""
                    );

                }

            }

            catch (error) {

                console.error(
                    "Fallback country error:",
                    error
                );


                countrySelect.innerHTML =
                    '<option value="">Countries could not be loaded</option>';


                countrySelect.disabled =
                    false;


                showStatus(
                    "Country data could not be loaded. Please refresh the page.",
                    "error"
                );

            }

        }



        /* =====================================
           COUNTRY CHANGE
        ====================================== */

        countrySelect.addEventListener(
            "change",
            async function () {

                await handleCountryChange();

                updatePostalPlaceholder();

            }
        );



        /* =====================================
           HANDLE COUNTRY
        ====================================== */

        async function handleCountryChange(
            savedStateCode = "",
            savedDistrictCode = ""
        ) {


            const countryCode =
                countrySelect.value
                    .toUpperCase();


            /*
             * Reset state
             */

            stateSelect.innerHTML =
                '<option value="">Select state / province / region</option>';


            stateSelect.disabled =
                true;


            /*
             * Reset city
             */

            districtSelect.innerHTML =
                '<option value="">Select state first</option>';


            districtSelect.disabled =
                true;


            districtNote.style.display =
                "none";


            hideStatus();


            if (!countryCode) {

                return;

            }


            /*
             * INDIA
             */

            if (
                countryCode === "IN"
            ) {

                loadIndiaStates(
                    savedStateCode,
                    savedDistrictCode
                );


                return;

            }


            /*
             * OTHER COUNTRIES
             */

            await loadInternationalStates(
                countryCode,
                savedStateCode,
                savedDistrictCode
            );

        }



        /* =====================================
           INDIA STATES
        ====================================== */

        function loadIndiaStates(
            savedStateCode = "",
            savedDistrictCode = ""
        ) {


            stateSelect.innerHTML =
                '<option value="">Select Indian State / UT</option>';


            if (
                !indiaData ||
                !indiaData.length
            ) {


                stateSelect.innerHTML =
                    '<option value="">India state data unavailable</option>';


                stateSelect.disabled =
                    true;


                showStatus(
                    "India state/district data could not be loaded. Please refresh the page.",
                    "error"
                );


                return;

            }


            indiaData
                .slice()
                .sort(
                    function (a, b) {

                        return a.name.localeCompare(
                            b.name
                        );

                    }
                )
                .forEach(
                    function (state) {


                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            state.code;


                        option.textContent =
                            state.name;


                        stateSelect.appendChild(
                            option
                        );

                    }
                );


            stateSelect.disabled =
                false;


            districtNote.style.display =
                "block";


            districtNote.textContent =
                "India: select your State/UT and then your District.";


            if (
                savedStateCode
            ) {


                stateSelect.value =
                    savedStateCode;


                if (
                    stateSelect.value
                ) {


                    loadIndiaDistricts(
                        savedStateCode,
                        savedDistrictCode
                    );

                }

            }

        }



        /* =====================================
           INDIA DISTRICTS
        ====================================== */

        function loadIndiaDistricts(
            stateCode,
            savedDistrictCode = ""
        ) {


            const selectedState =
                indiaData.find(
                    function (state) {

                        return (
                            state.code ===
                            stateCode
                        );

                    }
                );


            districtSelect.innerHTML =
                '<option value="">Select district</option>';


            if (
                !selectedState ||
                !selectedState.districts
            ) {


                districtSelect.innerHTML =
                    '<option value="">No districts available</option>';


                districtSelect.disabled =
                    true;


                return;

            }


            selectedState.districts
                .slice()
                .sort(
                    function (a, b) {

                        return a.name.localeCompare(
                            b.name
                        );

                    }
                )
                .forEach(
                    function (district) {


                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            district.code;


                        option.textContent =
                            district.name;


                        districtSelect.appendChild(
                            option
                        );

                    }
                );


            districtSelect.disabled =
                false;


            if (
                savedDistrictCode
            ) {

                districtSelect.value =
                    savedDistrictCode;

            }

        }



        /* =====================================
           INTERNATIONAL STATES
        ====================================== */

        async function loadInternationalStates(
            countryCode,
            savedStateCode = "",
            savedDistrictCode = ""
        ) {


            try {


                showStatus(
                    "Loading states / provinces / regions..."
                );


                stateSelect.innerHTML =
                    '<option value="">Loading...</option>';


                /*
                 * Get country name.
                 */

                const countryName =
                    getSelectedCountryName();


                /*
                 * CountriesNow state endpoint.
                 */

                const response =
                    await fetch(
                        "https://countriesnow.space/api/v0.1/countries/states",
                        {

                            method:
                                "POST",

                            headers:
                                {
                                    "Content-Type":
                                        "application/json"
                                },

                            body:
                                JSON.stringify(
                                    {
                                        country:
                                            countryName
                                    }
                                )

                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "State API failed"
                    );

                }


                const result =
                    await response.json();


                if (
                    result.error
                ) {

                    throw new Error(
                        result.msg ||
                        "State API returned an error"
                    );

                }


                const states =
                    result.data &&
                    result.data.states
                        ? result.data.states
                        : [];


                stateSelect.innerHTML =
                    '<option value="">Select state / province / region</option>';


                /*
                 * No state data
                 */

                if (
                    states.length === 0
                ) {


                    stateSelect.innerHTML =
                        '<option value="">No state data available</option>';


                    stateSelect.disabled =
                        true;


                    districtSelect.innerHTML =
                        '<option value="">No city data available</option>';


                    districtSelect.disabled =
                        true;


                    districtNote.style.display =
                        "block";


                    districtNote.textContent =
                        "State/region data is not available for this country.";


                    hideStatus();


                    return;

                }



                /*
                 * Sort states
                 */

                states
                    .slice()
                    .sort(
                        function (a, b) {

                            return a.name.localeCompare(
                                b.name
                            );

                        }
                    )
                    .forEach(
                        function (state) {


                            const option =
                                document.createElement(
                                    "option"
                                );


                            /*
                             * CountriesNow may provide
                             * state_code.
                             *
                             * If not, use state name.
                             */

                            option.value =
                                state.state_code ||
                                state.iso2 ||
                                state.name;


                            option.textContent =
                                state.name;


                            stateSelect.appendChild(
                                option
                            );

                        }
                    );


                stateSelect.disabled =
                    false;


                districtNote.style.display =
                    "block";


                districtNote.textContent =
                    "Select a state/province/region to load cities and towns.";


                hideStatus();



                /*
                 * Restore state
                 */

                if (
                    savedStateCode
                ) {


                    /*
                     * Try saved code first.
                     */

                    stateSelect.value =
                        savedStateCode;


                    /*
                     * If not found, try
                     * saved state name.
                     */

                    if (
                        !stateSelect.value
                    ) {


                        const matchingState =
                            states.find(
                                function (state) {

                                    return (
                                        state.name
                                            .toLowerCase() ===
                                        String(
                                            savedStateCode
                                        )
                                            .toLowerCase()
                                    );

                                }
                            );


                        if (
                            matchingState
                        ) {

                            stateSelect.value =
                                matchingState.state_code ||
                                matchingState.iso2 ||
                                matchingState.name;

                        }

                    }


                    if (
                        stateSelect.value
                    ) {


                        await loadInternationalCities(
                            countryName,
                            stateSelect.value,
                            savedDistrictCode
                        );

                    }

                }

            }

            catch (error) {

                console.error(
                    "International state error:",
                    error
                );


                stateSelect.innerHTML =
                    '<option value="">Unable to load states</option>';


                stateSelect.disabled =
                    true;


                districtSelect.innerHTML =
                    '<option value="">Unable to load cities</option>';


                districtSelect.disabled =
                    true;


                showStatus(
                    "State/Province data could not be loaded. Please try again.",
                    "error"
                );

            }

        }



        /* =====================================
           STATE CHANGE
        ====================================== */

        stateSelect.addEventListener(
            "change",
            async function () {


                const countryCode =
                    countrySelect.value
                        .toUpperCase();


                const stateValue =
                    stateSelect.value;


                const stateName =
                    getSelectedStateName();


                districtSelect.innerHTML =
                    '<option value="">Loading...</option>';


                districtSelect.disabled =
                    true;


                if (!stateValue) {


                    districtSelect.innerHTML =
                        '<option value="">Select state first</option>';


                    return;

                }


                /*
                 * INDIA
                 */

                if (
                    countryCode === "IN"
                ) {


                    loadIndiaDistricts(
                        stateValue
                    );


                    return;

                }


                /*
                 * INTERNATIONAL
                 */

                await loadInternationalCities(
                    getSelectedCountryName(),
                    stateName
                );

            }
        );



        /* =====================================
           INTERNATIONAL CITIES
        ====================================== */

        async function loadInternationalCities(
            countryName,
            stateName,
            savedDistrictCode = ""
        ) {


            try {


                showStatus(
                    "Loading cities / towns..."
                );


                districtSelect.innerHTML =
                    '<option value="">Loading cities...</option>';


                /*
                 * CountriesNow city endpoint.
                 */

                const response =
                    await fetch(
                        "https://countriesnow.space/api/v0.1/countries/state/cities",
                        {

                            method:
                                "POST",

                            headers:
                                {
                                    "Content-Type":
                                        "application/json"
                                },

                            body:
                                JSON.stringify(
                                    {
                                        country:
                                            countryName,

                                        state:
                                            stateName
                                    }
                                )

                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "City API failed"
                    );

                }


                const result =
                    await response.json();


                if (
                    result.error
                ) {

                    throw new Error(
                        result.msg ||
                        "City API returned an error"
                    );

                }


                const cities =
                    result.data || [];


                districtSelect.innerHTML =
                    '<option value="">Select city / town</option>';


                /*
                 * Remove duplicates
                 */

                const uniqueCities =
                    Array.from(
                        new Set(
                            cities
                                .filter(
                                    function (city) {

                                        return (
                                            city &&
                                            String(city)
                                                .trim()
                                        );

                                    }
                                )
                                .map(
                                    function (city) {

                                        return String(
                                            city
                                        ).trim();

                                    }
                                )
                        )
                    );


                /*
                 * Sort
                 */

                uniqueCities.sort(
                    function (a, b) {

                        return a.localeCompare(
                            b
                        );

                    }
                );



                /*
                 * Add cities
                 */

                uniqueCities.forEach(
                    function (city) {


                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            city;


                        option.textContent =
                            city;


                        districtSelect.appendChild(
                            option
                        );

                    }
                );



                /*
                 * No cities
                 */

                if (
                    uniqueCities.length === 0
                ) {


                    districtSelect.innerHTML =
                        '<option value="">No city data available</option>';


                    districtSelect.disabled =
                        true;


                    hideStatus();


                    return;

                }


                districtSelect.disabled =
                    false;


                hideStatus();



                /*
                 * Restore city
                 */

                if (
                    savedDistrictCode
                ) {

                    districtSelect.value =
                        savedDistrictCode;

                }

            }

            catch (error) {

                console.error(
                    "International city error:",
                    error
                );


                districtSelect.innerHTML =
                    '<option value="">Unable to load cities</option>';


                districtSelect.disabled =
                    true;


                showStatus(
                    "City/Town data could not be loaded. Please try again.",
                    "error"
                );

            }

        }



        /* =====================================
           GET COUNTRY NAME
        ====================================== */

        function getSelectedCountryName() {

            const option =
                countrySelect.options[
                    countrySelect.selectedIndex
                ];


            if (
                !option
            ) {

                return "";

            }


            return option.textContent.trim();

        }



        /* =====================================
           GET STATE NAME
        ====================================== */

        function getSelectedStateName() {

            const option =
                stateSelect.options[
                    stateSelect.selectedIndex
                ];


            if (
                !option
            ) {

                return "";

            }


            return option.textContent.trim();

        }



        /* =====================================
           POSTAL PLACEHOLDER
        ====================================== */

        function updatePostalPlaceholder() {


            const country =
                countrySelect.value
                    .toUpperCase();


            const postalInput =
                document.getElementById(
                    "postalCode"
                );


            const placeholders = {

                IN:
                    "e.g. 416001",

                US:
                    "e.g. 10001",

                CA:
                    "e.g. M5V 3A8",

                GB:
                    "e.g. SW1A 1AA",

                AU:
                    "e.g. 2000",

                DE:
                    "e.g. 10115",

                FR:
                    "e.g. 75001",

                AE:
                    "Postal code if applicable",

                SG:
                    "e.g. 018956",

                JP:
                    "e.g. 100-0001",

                NZ:
                    "e.g. 6011",

                BR:
                    "e.g. 01001-000",

                IN:
                    "e.g. 416001"

            };


            postalInput.placeholder =
                placeholders[country] ||
                "PIN / ZIP / Postal code";

        }



        /* =====================================
           RESTORE BASIC INFORMATION
        ====================================== */

        function restoreBasicInformation() {


            const saved =
                getSavedData();


            if (
                !saved
            ) {

                return;

            }


            document.getElementById(
                "firstName"
            ).value =
                saved.firstName || "";


            document.getElementById(
                "lastName"
            ).value =
                saved.lastName || "";


            document.getElementById(
                "email"
            ).value =
                saved.email || "";


            document.getElementById(
                "professionalTitle"
            ).value =
                saved.professionalTitle || "";


            document.getElementById(
                "linkedin"
            ).value =
                saved.linkedin || "";


            document.getElementById(
                "website"
            ).value =
                saved.website || "";


            document.getElementById(
                "postalCode"
            ).value =
                saved.postalCode || "";


            /*
             * Restore phone.
             *
             * Wait for utils before using
             * getNumber/setNumber.
             */

            if (
                saved.phone
            ) {


                try {

                    iti.setNumber(
                        saved.phone
                    );

                }

                catch (error) {

                    phoneInput.value =
                        saved.phone;

                }

            }

        }



        /* =====================================
           FORM VALIDATION
        ====================================== */

        form.addEventListener(
            "submit",
            async function (event) {


                event.preventDefault();


                hideError();



                /*
                 * First/last/email/etc.
                 */

                const firstName =
                    document
                        .getElementById(
                            "firstName"
                        )
                        .value
                        .trim();


                const lastName =
                    document
                        .getElementById(
                            "lastName"
                        )
                        .value
                        .trim();


                const email =
                    document
                        .getElementById(
                            "email"
                        )
                        .value
                        .trim();


                const postalCode =
                    document
                        .getElementById(
                            "postalCode"
                        )
                        .value
                        .trim();


                const professionalTitle =
                    document
                        .getElementById(
                            "professionalTitle"
                        )
                        .value
                        .trim();



                /*
                 * Required fields
                 */

                if (
                    !firstName ||
                    !lastName ||
                    !email ||
                    !phoneInput.value.trim() ||
                    !countrySelect.value ||
                    !stateSelect.value ||
                    !districtSelect.value ||
                    !postalCode ||
                    !professionalTitle
                ) {


                    showError(
                        "Please complete all required fields marked with *."
                    );


                    return;

                }



                /*
                 * Email
                 */

                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                if (
                    !emailPattern.test(
                        email
                    )
                ) {


                    showError(
                        "Please enter a valid email address."
                    );


                    return;

                }



                /*
                 * Phone
                 *
                 * Wait for intl-tel-input
                 * utilities to finish.
                 */

                try {

                    if (
                        iti.promise
                    ) {

                        await iti.promise;

                    }


                    if (
                        !iti.isValidNumber()
                    ) {


                        showError(
                            "Please enter a valid mobile number for the selected country."
                        );


                        phoneInput.focus();


                        return;

                    }

                }

                catch (error) {

                    /*
                     * If the external
                     * validation service/library
                     * is unavailable, don't
                     * block the user solely
                     * because of it.
                     */

                    console.warn(
                        "Phone validation unavailable:",
                        error
                    );

                }



                /* =================================
                   SELECTED NAMES
                ================================= */


                const countryName =
                    getSelectedCountryName();


                const stateName =
                    getSelectedStateName();


                const districtOption =
                    districtSelect.options[
                        districtSelect.selectedIndex
                    ];


                const districtName =
                    districtOption
                        ? districtOption
                            .textContent
                            .trim()
                        : "";



                /* =================================
                   PHONE E.164
                ================================= */


                let fullPhone =
                    phoneInput.value.trim();


                try {

                    await iti.promise;

                    fullPhone =
                        iti.getNumber();

                }

                catch (error) {

                    console.warn(
                        "Could not format phone:",
                        error
                    );

                }



                /* =================================
                   SAVE DATA
                ================================= */


                const personalData = {


                    firstName:
                        firstName,


                    lastName:
                        lastName,


                    email:
                        email,


                    phone:
                        fullPhone,


                    countryCode:
                        countrySelect.value
                            .toLowerCase(),


                    country:
                        countryName,


                    stateCode:
                        stateSelect.value,


                    state:
                        stateName,


                    districtCode:
                        districtSelect.value,


                    district:
                        districtName,


                    postalCode:
                        postalCode,


                    professionalTitle:
                        professionalTitle,


                    linkedin:
                        document
                            .getElementById(
                                "linkedin"
                            )
                            .value
                            .trim(),


                    website:
                        document
                            .getElementById(
                                "website"
                            )
                            .value
                            .trim()

                };



                /*
                 * Save
                 */

                localStorage.setItem(
                    "resumePersonalData",
                    JSON.stringify(
                        personalData
                    )
                );



                /*
                 * Continue
                 */

                window.location.href =
                    "summary.html";

            }
        );



        /* =====================================
           START PAGE
        ====================================== */

        restoreBasicInformation();


        updatePostalPlaceholder();


        /*
         * Load both datasets.
         */

        Promise.all(
            [
                loadIndiaData(),
                loadCountries()
            ]
        )
        .then(
            function () {

                console.log(
                    "Location system ready."
                );

            }
        )
        .catch(
            function (error) {

                console.error(
                    "Startup error:",
                    error
                );

            }
        );


    }
);

</script>
