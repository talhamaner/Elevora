<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Personal Information</title><link rel="stylesheet" href="css/style.css"><script src="theme.js"></script><script src="js/app.js"></script></head><body><header class="navbar"><div class="logo">Resume Builder</div><nav><a href="index.html">Home</a><a href="personal.html">Resume</a><a href="preview.html">Preview</a><button id="themeToggle" class="theme-toggle" type="button">🌙</button></nav></header><main class="builder-page"><div class="stepbar"><span class="step active">1</span><span class="step-line"></span><span class="step ">2</span><span class="step-line"></span><span class="step ">3</span><span class="step-line"></span><span class="step ">4</span><span class="step-line"></span><span class="step ">5</span><span class="step-line"></span><span class="step ">6</span><span class="step-line"></span><span class="step ">7</span><span class="step-line"></span><span class="step ">8</span><span class="step-line"></span><span class="step ">9</span><span class="step-line"></span><span class="step ">10</span></div><div class="builder-header"><h1>Personal Information</h1><p>Enter the contact and professional information you want employers to see.</p></div><form id="f" class="form-card"><div class="form-grid"><div class="form-group"><label>First Name <span class="required">*</span></label><input id="firstName" required></div><div class="form-group"><label>Last Name <span class="required">*</span></label><input id="lastName" required></div><div class="form-group"><label>Email <span class="required">*</span></label><input id="email" type="email" required></div><div class="form-group"><label>Mobile <span class="required">*</span></label><div class="phone-row"><select id="phoneCode"><option>+91</option><option>+1</option><option>+44</option><option>+61</option><option>+971</option><option>+65</option></select><input id="mobile" required placeholder="Mobile number"></div></div><div class="form-group"><label>Country <span class="required">*</span></label><input id="country" required placeholder="e.g. India"></div><div class="form-group"><label>State / Province / Region</label><input id="state"></div><div class="form-group"><label>District / City / Town</label><input id="city"></div><div class="form-group"><label>Postal Code</label><input id="postalCode"></div><div class="form-group"><label>Professional Title <span class="required">*</span></label><input id="professionalTitle" required placeholder="e.g. Software Developer"></div><div class="form-group"><label>LinkedIn</label><input id="linkedin" placeholder="https://linkedin.com/in/your-profile"></div><div class="form-group full-width"><label>Website / Portfolio</label><input id="website" placeholder="https://example.com"></div></div><div class="form-actions"><a class="btn secondary" href="index.html">← Back</a><button class="btn primary">Save & Continue →</button></div></form></main><script>const p=getJSON(K.personal,{});["firstName","lastName","email","mobile","country","state","city","postalCode","professionalTitle","linkedin","website"].forEach(id=>document.getElementById(id).value=p[id]||"");phoneCode.value=p.phoneCode||"+91";f.addEventListener("submit",e=>{e.preventDefault();const o={};["firstName","lastName","email","mobile","country","state","city","postalCode","professionalTitle","linkedin","website"].forEach(id=>o[id]=document.getElementById(id).value.trim());o.phoneCode=phoneCode.value;setJSON(K.personal,o);location.href="summary.html"});</script></body></html>
