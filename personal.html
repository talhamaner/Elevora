<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Personal Information | Elevora</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

<script src="theme.js"></script>
<script src="js/app.js"></script>

</head>


<body>


<header class="navbar">

<a href="index.html" class="logo">
  Elevora
</a>

<nav class="nav-links">

<a href="index.html">Home</a>
<a href="personal.html">Resume</a>
<a href="preview.html">Preview</a>
<a href="cover-letter.html">Cover Letter</a>

<button
id="themeToggle"
class="theme-toggle"
type="button"
>
🌙
</button>

</nav>

</header>


<main class="page-container">


<div class="form-header">

<div class="step-number">
  1
</div>

<div>

<h1>Personal Information</h1>

<p>
Start with your basic contact information.
</p>

</div>

</div>


<div class="progress-wrapper">

<div class="progress-bar">

<div
class="progress-fill"
style="width:10%"
></div>

</div>

<span>1 of 10</span>

</div>


<form
id="personalForm"
class="form-card"
>


<div class="form-group">

<label>
Full Name <span class="required">*</span>
</label>

<input
id="fullName"
required
placeholder="Enter your full name"
>

</div>


<div class="form-group">

<label>
Email Address <span class="required">*</span>
</label>

<input
id="email"
type="email"
required
placeholder="you@example.com"
>

</div>


<div class="form-group">

<label>
Phone Number <span class="required">*</span>
</label>

<div class="phone-wrapper">

<div class="phone-code-box">

<input
id="phoneCodeSearch"
class="search-input"
placeholder="+91"
autocomplete="off"
>

<div
id="phoneCodeOptions"
class="search-options"
></div>

</div>


<input
id="phone"
type="tel"
required
placeholder="9876543210"
>

</div>

</div>


<div class="form-group">

<label>
Country <span class="required">*</span>
</label>

<div class="search-select">

<input
id="country"
class="search-input"
required
placeholder="Search country..."
autocomplete="off"
>

<span class="search-arrow">
⌄
</span>

<div
id="countryOptions"
class="search-options"
></div>

</div>

</div>


<div class="form-group">

<label>
State / Province / Region
</label>

<div class="search-select">

<input
id="state"
class="search-input"
placeholder="Search state..."
autocomplete="off"
>

<span class="search-arrow">
⌄
</span>

<div
id="stateOptions"
class="search-options"
></div>

</div>

</div>


<div class="form-group">

<label>
District / City / Town
</label>

<div class="search-select">

<input
id="city"
class="search-input"
placeholder="Search city / town..."
autocomplete="off"
>

<span class="search-arrow">
⌄
</span>

<div
id="cityOptions"
class="search-options"
></div>

</div>

</div>


<div class="form-group">

<label>Address</label>

<textarea
id="address"
placeholder="Enter your address"
></textarea>

</div>


<div class="form-group">

<label>Postal / ZIP Code</label>

<input
id="postalCode"
placeholder="Enter postal / ZIP code"
>

</div>


<div class="form-group">

<label>LinkedIn Profile</label>

<input
id="linkedin"
type="url"
placeholder="https://linkedin.com/in/your-profile"
>

</div>


<div class="form-group">

<label>GitHub Profile</label>

<input
id="github"
type="url"
placeholder="https://github.com/your-profile"
>

</div>


<div class="form-group">

<label>Portfolio / Website</label>

<input
id="website"
type="url"
placeholder="https://yourwebsite.com"
>

</div>


<div class="form-actions">

<a
href="index.html"
class="btn secondary"
>
← Back
</a>

<button
type="submit"
class="btn primary"
>
Save & Continue →
</button>

</div>


<div
id="status"
class="form-status"
></div>


</form>

</main>


<script>

const phoneCountries = [
["India","+91"],
["United States","+1"],
["Canada","+1"],
["United Kingdom","+44"],
["Australia","+61"],
["Germany","+49"],
["France","+33"],
["Italy","+39"],
["Spain","+34"],
["United Arab Emirates","+971"],
["Saudi Arabia","+966"],
["Singapore","+65"],
["Malaysia","+60"],
["Japan","+81"],
["China","+86"],
["South Korea","+82"],
["New Zealand","+64"],
["South Africa","+27"],
["Brazil","+55"],
["Mexico","+52"],
["Russia","+7"],
["Ireland","+353"],
["Netherlands","+31"],
["Switzerland","+41"],
["Sweden","+46"],
["Norway","+47"],
["Denmark","+45"],
["Finland","+358"],
["Pakistan","+92"],
["Bangladesh","+880"],
["Nepal","+977"],
["Sri Lanka","+94"]
];


const countries = [
"Afghanistan",
"Australia",
"Bangladesh",
"Brazil",
"Canada",
"China",
"Denmark",
"Finland",
"France",
"Germany",
"India",
"Indonesia",
"Ireland",
"Italy",
"Japan",
"Malaysia",
"Mexico",
"Nepal",
"Netherlands",
"New Zealand",
"Norway",
"Pakistan",
"Philippines",
"Russia",
"Saudi Arabia",
"Singapore",
"South Africa",
"South Korea",
"Spain",
"Sri Lanka",
"Sweden",
"Switzerland",
"Thailand",
"United Arab Emirates",
"United Kingdom",
"United States",
"Vietnam"
];


const states = {

India:[
"Andhra Pradesh",
"Assam",
"Bihar",
"Goa",
"Gujarat",
"Haryana",
"Karnataka",
"Kerala",
"Madhya Pradesh",
"Maharashtra",
"Odisha",
"Punjab",
"Rajasthan",
"Tamil Nadu",
"Telangana",
"Uttar Pradesh",
"Uttarakhand",
"West Bengal",
"Delhi"
],

"United States":[
"California",
"Florida",
"New York",
"Texas",
"Washington"
],

Canada:[
"Alberta",
"British Columbia",
"Manitoba",
"Ontario",
"Quebec"
],

Australia:[
"New South Wales",
"Queensland",
"South Australia",
"Tasmania",
"Victoria",
"Western Australia"
],

"United Kingdom":[
"England",
"Scotland",
"Wales",
"Northern Ireland"
]

};


const cities = {

Maharashtra:[
"Mumbai",
"Pune",
"Nagpur",
"Nashik",
"Kolhapur",
"Solapur"
],

Karnataka:[
"Bengaluru",
"Mysuru",
"Mangaluru",
"Hubballi",
"Belagavi"
],

California:[
"Los Angeles",
"San Diego",
"San Francisco",
"San Jose",
"Sacramento"
],

"New York":[
"New York City",
"Buffalo",
"Rochester",
"Albany"
],

Ontario:[
"Toronto",
"Ottawa",
"Mississauga",
"Hamilton"
]

};


function render(
container,
items,
formatter,
input
){

container.innerHTML="";

const query =
input.value.toLowerCase().trim();

const results =
items.filter(item =>
formatter(item)
.toLowerCase()
.includes(query)
);

results.forEach(item=>{

const option =
document.createElement("div");

option.className =
"search-option";

option.textContent =
formatter(item);

option.onclick=()=>{

input.value =
formatter(item);

container.classList.remove("show");

};

container.appendChild(option);

});

if(!results.length){

const option =
document.createElement("div");

option.className =
"search-option no-result";

option.textContent =
"No results found";

container.appendChild(option);

}

}


const phoneInput =
document.getElementById(
"phoneCodeSearch"
);

const phoneOptions =
document.getElementById(
"phoneCodeOptions"
);

phoneInput.onfocus=()=>{
render(
phoneOptions,
phoneCountries,
x=>`${x[0]} (${x[1]})`,
phoneInput
);
phoneOptions.classList.add("show");
};

phoneInput.oninput=()=>{
render(
phoneOptions,
phoneCountries,
x=>`${x[0]} (${x[1]})`,
phoneInput
);
phoneOptions.classList.add("show");
};


const country =
document.getElementById("country");

const countryOptions =
document.getElementById(
"countryOptions"
);

country.onfocus=()=>{
render(
countryOptions,
countries,
x=>x,
country
);
countryOptions.classList.add("show");
};

country.oninput=()=>{
render(
countryOptions,
countries,
x=>x,
country
);
countryOptions.classList.add("show");
};


const state =
document.getElementById("state");

const stateOptions =
document.getElementById(
"stateOptions"
);

state.onfocus=()=>{

render(
stateOptions,
states[country.value] || [],
x=>x,
state
);

stateOptions.classList.add("show");

};


state.oninput=()=>{

render(
stateOptions,
states[country.value] || [],
x=>x,
state
);

stateOptions.classList.add("show");

};


const city =
document.getElementById("city");

const cityOptions =
document.getElementById(
"cityOptions"
);

city.onfocus=()=>{

render(
cityOptions,
cities[state.value] || [],
x=>x,
city
);

cityOptions.classList.add("show");

};


city.oninput=()=>{

render(
cityOptions,
cities[state.value] || [],
x=>x,
city
);

cityOptions.classList.add("show");

};


/* LOAD SAVED DATA */

try{

const saved =
JSON.parse(
localStorage.getItem(
"resumePersonalData"
)
) || {};

[
"fullName",
"email",
"phone",
"phoneCodeSearch",
"country",
"state",
"city",
"address",
"postalCode",
"linkedin",
"github",
"website"
].forEach(id=>{

const element =
document.getElementById(id);

if(element &&
saved[
id === "phoneCodeSearch"
? "phoneCode"
: id
] !== undefined){

element.value =
saved[
id === "phoneCodeSearch"
? "phoneCode"
: id
];

}

});

}catch(error){}


/* SAVE */

document
.getElementById("personalForm")
.addEventListener(
"submit",
function(event){

event.preventDefault();

const data={

fullName:
document.getElementById("fullName").value.trim(),

email:
document.getElementById("email").value.trim(),

phone:
document.getElementById("phone").value.trim(),

phoneCode:
document.getElementById("phoneCodeSearch").value.trim(),

country:
document.getElementById("country").value.trim(),

state:
document.getElementById("state").value.trim(),

city:
document.getElementById("city").value.trim(),

address:
document.getElementById("address").value.trim(),

postalCode:
document.getElementById("postalCode").value.trim(),

linkedin:
document.getElementById("linkedin").value.trim(),

github:
document.getElementById("github").value.trim(),

website:
document.getElementById("website").value.trim()

};


try{

localStorage.setItem(
"resumePersonalData",
JSON.stringify(data)
);

window.location.href =
"summary.html";

}catch(error){

alert(
"Could not save your information."
);

}

});


document.addEventListener(
"click",
event=>{

if(!event.target.closest(
".phone-code-box"
))
phoneOptions.classList.remove("show");

if(!event.target.closest(
"#country"
))
countryOptions.classList.remove("show");

if(!event.target.closest(
"#state"
))
stateOptions.classList.remove("show");

if(!event.target.closest(
"#city"
))
cityOptions.classList.remove("show");

});

</script>

</body>
</html>
