<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Personal Information | Elevora</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="theme.js"></script>
  <script src="js/app.js"></script>
</head>

<body>

<header class="navbar">
  <a href="index.html" class="logo">Elevora</a>

  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="personal.html">Resume</a>
    <a href="preview.html">Preview</a>
    <a href="cover-letter.html">Cover Letter</a>

    <button
      id="themeToggle"
      class="theme-toggle"
      type="button"
      aria-label="Switch theme"
    >
      🌙
    </button>
  </nav>
</header>


<main class="page-container">

  <div class="form-header">
    <span class="step-number">1</span>

    <div>
      <h1>Personal Information</h1>
      <p>
        Start with your basic information. This information will appear on your resume.
      </p>
    </div>
  </div>


  <div class="progress-wrapper">
    <div class="progress-bar">
      <div class="progress-fill" style="width:10%;"></div>
    </div>

    <span>Step 1 of 10</span>
  </div>


  <form id="personalForm" class="form-card">

    <!-- FULL NAME -->

    <div class="form-group">
      <label for="fullName">
        Full Name <span class="required">*</span>
      </label>

      <input
        type="text"
        id="fullName"
        name="fullName"
        placeholder="Enter your full name"
        required
      >
    </div>


    <!-- EMAIL -->

    <div class="form-group">
      <label for="email">
        Email Address <span class="required">*</span>
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@example.com"
        required
      >
    </div>


    <!-- PHONE -->

    <div class="form-group">

      <label>
        Phone Number <span class="required">*</span>
      </label>

      <div class="phone-wrapper">

        <div class="phone-code-box">

          <input
            type="text"
            id="phoneCodeSearch"
            class="search-input"
            placeholder="+91"
            autocomplete="off"
          >

          <div
            id="phoneCodeOptions"
            class="search-options"
          ></div>

        </div>


        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="9876543210"
          required
        >

      </div>

    </div>


    <!-- COUNTRY -->

    <div class="form-group">

      <label for="country">
        Country <span class="required">*</span>
      </label>

      <div class="search-select">

        <input
          type="text"
          id="country"
          name="country"
          class="search-input"
          placeholder="Search country..."
          autocomplete="off"
          required
        >

        <span class="search-arrow">⌄</span>

        <div
          id="countryOptions"
          class="search-options"
        ></div>

      </div>

    </div>


    <!-- STATE -->

    <div class="form-group">

      <label for="state">
        State / Province / Region
      </label>

      <div class="search-select">

        <input
          type="text"
          id="state"
          name="state"
          class="search-input"
          placeholder="Search state / province..."
          autocomplete="off"
        >

        <span class="search-arrow">⌄</span>

        <div
          id="stateOptions"
          class="search-options"
        ></div>

      </div>

    </div>


    <!-- CITY -->

    <div class="form-group">

      <label for="city">
        District / City / Town
      </label>

      <div class="search-select">

        <input
          type="text"
          id="city"
          name="city"
          class="search-input"
          placeholder="Enter your city / town"
          autocomplete="off"
        >

        <span class="search-arrow">⌄</span>

        <div
          id="cityOptions"
          class="search-options"
        ></div>

      </div>

    </div>


    <!-- ADDRESS -->

    <div class="form-group">

      <label for="address">
        Address
      </label>

      <textarea
        id="address"
        name="address"
        rows="3"
        placeholder="Enter your address"
      ></textarea>

    </div>


    <!-- PIN CODE -->

    <div class="form-group">

      <label for="postalCode">
        Postal / ZIP Code
      </label>

      <input
        type="text"
        id="postalCode"
        name="postalCode"
        placeholder="Enter postal / ZIP code"
      >

    </div>


    <!-- LINKEDIN -->

    <div class="form-group">

      <label for="linkedin">
        LinkedIn Profile
      </label>

      <input
        type="url"
        id="linkedin"
        name="linkedin"
        placeholder="https://linkedin.com/in/your-profile"
      >

    </div>


    <!-- GITHUB -->

    <div class="form-group">

      <label for="github">
        GitHub Profile
      </label>

      <input
        type="url"
        id="github"
        name="github"
        placeholder="https://github.com/your-profile"
      >

    </div>


    <!-- WEBSITE -->

    <div class="form-group">

      <label for="website">
        Portfolio / Website
      </label>

      <input
        type="url"
        id="website"
        name="website"
        placeholder="https://yourwebsite.com"
      >

    </div>


    <!-- ACTIONS -->

    <div class="form-actions">

      <a
        href="index.html"
        class="btn secondary"
      >
        ← Back
      </a>

      <button
        type="submit"
        class="btn primary"
        id="saveContinue"
      >
        Save & Continue →
      </button>

    </div>


    <div
      id="status"
      class="form-status"
      aria-live="polite"
    ></div>

  </form>

</main>


<script>

/* =========================================
   COUNTRY PHONE CODES
========================================= */

const phoneCountries = [
  {name:"India", code:"+91"},
  {name:"United States", code:"+1"},
  {name:"Canada", code:"+1"},
  {name:"United Kingdom", code:"+44"},
  {name:"Australia", code:"+61"},
  {name:"Germany", code:"+49"},
  {name:"France", code:"+33"},
  {name:"Italy", code:"+39"},
  {name:"Spain", code:"+34"},
  {name:"United Arab Emirates", code:"+971"},
  {name:"Saudi Arabia", code:"+966"},
  {name:"Singapore", code:"+65"},
  {name:"Malaysia", code:"+60"},
  {name:"Japan", code:"+81"},
  {name:"China", code:"+86"},
  {name:"South Korea", code:"+82"},
  {name:"New Zealand", code:"+64"},
  {name:"South Africa", code:"+27"},
  {name:"Brazil", code:"+55"},
  {name:"Mexico", code:"+52"},
  {name:"Russia", code:"+7"},
  {name:"Ireland", code:"+353"},
  {name:"Netherlands", code:"+31"},
  {name:"Switzerland", code:"+41"},
  {name:"Sweden", code:"+46"},
  {name:"Norway", code:"+47"},
  {name:"Denmark", code:"+45"},
  {name:"Finland", code:"+358"},
  {name:"Pakistan", code:"+92"},
  {name:"Bangladesh", code:"+880"},
  {name:"Nepal", code:"+977"},
  {name:"Sri Lanka", code:"+94"}
];


/* =========================================
   COUNTRY LIST
========================================= */

const countries = [
  "Afghanistan",
  "Australia",
  "Bangladesh",
  "Brazil",
  "Canada",
  "China",
  "Denmark",
  "Finland",
  "France",
  "Germany",
  "India",
  "Indonesia",
  "Ireland",
  "Italy",
  "Japan",
  "Malaysia",
  "Mexico",
  "Nepal",
  "Netherlands",
  "New Zealand",
  "Norway",
  "Pakistan",
  "Philippines",
  "Russia",
  "Saudi Arabia",
  "Singapore",
  "South Africa",
  "South Korea",
  "Spain",
  "Sri Lanka",
  "Sweden",
  "Switzerland",
  "Thailand",
  "United Arab Emirates",
  "United Kingdom",
  "United States",
  "Vietnam"
];


/* =========================================
   ELEMENTS
========================================= */

const form = document.getElementById("personalForm");

const phoneCodeSearch =
  document.getElementById("phoneCodeSearch");

const phoneCodeOptions =
  document.getElementById("phoneCodeOptions");

const countryInput =
  document.getElementById("country");

const countryOptions =
  document.getElementById("countryOptions");

const stateInput =
  document.getElementById("state");

const stateOptions =
  document.getElementById("stateOptions");

const cityInput =
  document.getElementById("city");

const cityOptions =
  document.getElementById("cityOptions");


/* =========================================
   DROPDOWN RENDERING
========================================= */

function renderPhoneCodes(filter = "") {

  const query = filter.toLowerCase().trim();

  const results = phoneCountries.filter(item =>
    item.name.toLowerCase().includes(query) ||
    item.code.includes(query)
  );

  phoneCodeOptions.innerHTML = "";

  results.forEach(item => {

    const option = document.createElement("div");

    option.className = "search-option";

    option.textContent =
      `${item.name} (${item.code})`;

    option.addEventListener("click", () => {

      phoneCodeSearch.value = item.code;

      phoneCodeOptions.classList.remove("show");

    });

    phoneCodeOptions.appendChild(option);

  });

  if (!results.length) {

    const empty = document.createElement("div");

    empty.className = "search-option no-result";

    empty.textContent = "No country found";

    phoneCodeOptions.appendChild(empty);

  }
}


function renderCountries(filter = "") {

  const query = filter.toLowerCase().trim();

  const results = countries.filter(country =>
    country.toLowerCase().includes(query)
  );

  countryOptions.innerHTML = "";

  results.forEach(country => {

    const option = document.createElement("div");

    option.className = "search-option";

    option.textContent = country;

    option.addEventListener("click", () => {

      countryInput.value = country;

      countryOptions.classList.remove("show");

      stateInput.value = "";
      cityInput.value = "";

      loadStates(country);

    });

    countryOptions.appendChild(option);

  });

  if (!results.length) {

    const empty = document.createElement("div");

    empty.className = "search-option no-result";

    empty.textContent = "No country found";

    countryOptions.appendChild(empty);

  }
}


/* =========================================
   STATE DATA
========================================= */

const stateData = {

  "India": [
    "Andhra Pradesh",
    "Arunachal Pradesh",
    "Assam",
    "Bihar",
    "Chhattisgarh",
    "Goa",
    "Gujarat",
    "Haryana",
    "Himachal Pradesh",
    "Jharkhand",
    "Karnataka",
    "Kerala",
    "Madhya Pradesh",
    "Maharashtra",
    "Manipur",
    "Meghalaya",
    "Mizoram",
    "Nagaland",
    "Odisha",
    "Punjab",
    "Rajasthan",
    "Sikkim",
    "Tamil Nadu",
    "Telangana",
    "Tripura",
    "Uttar Pradesh",
    "Uttarakhand",
    "West Bengal",
    "Delhi"
  ],

  "United States": [
    "Alabama",
    "Alaska",
    "Arizona",
    "California",
    "Colorado",
    "Florida",
    "Georgia",
    "Illinois",
    "New York",
    "North Carolina",
    "Ohio",
    "Pennsylvania",
    "Texas",
    "Virginia",
    "Washington"
  ],

  "Canada": [
    "Alberta",
    "British Columbia",
    "Manitoba",
    "New Brunswick",
    "Nova Scotia",
    "Ontario",
    "Quebec",
    "Saskatchewan"
  ],

  "Australia": [
    "New South Wales",
    "Queensland",
    "South Australia",
    "Tasmania",
    "Victoria",
    "Western Australia"
  ],

  "United Kingdom": [
    "England",
    "Scotland",
    "Wales",
    "Northern Ireland"
  ]

};


function loadStates(country) {

  const states = stateData[country] || [];

  stateOptions.innerHTML = "";

  states.forEach(state => {

    const option = document.createElement("div");

    option.className = "search-option";

    option.textContent = state;

    option.addEventListener("click", () => {

      stateInput.value = state;

      stateOptions.classList.remove("show");

      cityInput.value = "";

      loadCities(country, state);

    });

    stateOptions.appendChild(option);

  });

  if (!states.length) {

    const option = document.createElement("div");

    option.className = "search-option no-result";

    option.textContent =
      "Enter your state / province manually";

    stateOptions.appendChild(option);

  }

}


function loadCities(country, state) {

  cityOptions.innerHTML = "";

  const cities = {

    "Maharashtra": [
      "Mumbai",
      "Pune",
      "Nagpur",
      "Nashik",
      "Kolhapur",
      "Aurangabad",
      "Solapur"
    ],

    "Karnataka": [
      "Bengaluru",
      "Mysuru",
      "Mangaluru",
      "Hubballi",
      "Belagavi"
    ],

    "California": [
      "Los Angeles",
      "San Diego",
      "San Francisco",
      "San Jose",
      "Sacramento"
    ],

    "New York": [
      "New York City",
      "Buffalo",
      "Rochester",
      "Albany"
    ],

    "Ontario": [
      "Toronto",
      "Ottawa",
      "Mississauga",
      "Hamilton"
    ]

  };

  const results = cities[state] || [];

  results.forEach(city => {

    const option = document.createElement("div");

    option.className = "search-option";

    option.textContent = city;

    option.addEventListener("click", () => {

      cityInput.value = city;

      cityOptions.classList.remove("show");

    });

    cityOptions.appendChild(option);

  });

  if (!results.length) {

    const option = document.createElement("div");

    option.className = "search-option no-result";

    option.textContent =
      "Enter your city / town manually";

    cityOptions.appendChild(option);

  }

}


/* =========================================
   SEARCH EVENTS
========================================= */

phoneCodeSearch.addEventListener("focus", () => {

  renderPhoneCodes(phoneCodeSearch.value);

  phoneCodeOptions.classList.add("show");

});


phoneCodeSearch.addEventListener("input", () => {

  renderPhoneCodes(phoneCodeSearch.value);

  phoneCodeOptions.classList.add("show");

});


countryInput.addEventListener("focus", () => {

  renderCountries(countryInput.value);

  countryOptions.classList.add("show");

});


countryInput.addEventListener("input", () => {

  renderCountries(countryInput.value);

  countryOptions.classList.add("show");

});


stateInput.addEventListener("focus", () => {

  loadStates(countryInput.value);

  stateOptions.classList.add("show");

});


stateInput.addEventListener("input", () => {

  loadStates(countryInput.value);

  stateOptions.classList.add("show");

});


cityInput.addEventListener("focus", () => {

  cityOptions.classList.add("show");

});


/* =========================================
   CLOSE DROPDOWNS
========================================= */

document.addEventListener("click", event => {

  if (!event.target.closest(".phone-code-box")) {
    phoneCodeOptions.classList.remove("show");
  }

  if (!event.target.closest("#country")) {
    countryOptions.classList.remove("show");
  }

  if (!event.target.closest("#state")) {
    stateOptions.classList.remove("show");
  }

  if (!event.target.closest("#city")) {
    cityOptions.classList.remove("show");
  }

});


/* =========================================
   LOAD PREVIOUS DATA
========================================= */

function loadSavedPersonalData() {

  let saved = {};

  try {

    saved =
      JSON.parse(
        localStorage.getItem("resumePersonalData")
      ) || {};

  } catch (error) {

    saved = {};

  }


  const fields = [

    "fullName",
    "email",
    "phone",
    "phoneCode",
    "country",
    "state",
    "city",
    "address",
    "postalCode",
    "linkedin",
    "github",
    "website"

  ];


  fields.forEach(field => {

    const element =
      document.getElementById(field);

    if (!element) return;

    if (saved[field] !== undefined) {

      element.value = saved[field];

    }

  });

}


/* =========================================
   SAVE & CONTINUE
========================================= */

form.addEventListener("submit", function(event) {

  event.preventDefault();


  /*
     IMPORTANT:
     Collect EVERY field before navigation.
  */

  const personalData = {

    fullName:
      document.getElementById("fullName").value.trim(),

    email:
      document.getElementById("email").value.trim(),

    phone:
      document.getElementById("phone").value.trim(),

    phoneCode:
      document.getElementById("phoneCodeSearch").value.trim(),

    country:
      document.getElementById("country").value.trim(),

    state:
      document.getElementById("state").value.trim(),

    city:
      document.getElementById("city").value.trim(),

    address:
      document.getElementById("address").value.trim(),

    postalCode:
      document.getElementById("postalCode").value.trim(),

    linkedin:
      document.getElementById("linkedin").value.trim(),

    github:
      document.getElementById("github").value.trim(),

    website:
      document.getElementById("website").value.trim()

  };


  /*
     Validate required fields.
  */

  if (
    !personalData.fullName ||
    !personalData.email ||
    !personalData.phone ||
    !personalData.country
  ) {

    alert(
      "Please fill in all required fields marked with *."
    );

    return;

  }


  /*
     SAVE EVERYTHING.
  */

  try {

    localStorage.setItem(
      "resumePersonalData",
      JSON.stringify(personalData)
    );

  } catch (error) {

    alert(
      "Your information could not be saved. Please check your browser storage settings."
    );

    return;

  }


  /*
     Confirm the data was actually saved.
  */

  const savedData =
    localStorage.getItem("resumePersonalData");

  if (!savedData) {

    alert(
      "The information could not be saved. Please try again."
    );

    return;

  }


  /*
     Go to page 2.
  */

  window.location.href = "summary.html";

});


/* =========================================
   INITIALIZE
========================================= */

renderPhoneCodes();
renderCountries();
loadSavedPersonalData();

</script>

</body>
</html>
