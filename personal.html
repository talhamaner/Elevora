<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal Information - Resume Builder</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .navbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
        }

        .navbar nav {
            display: flex;
            gap: 25px;
        }

        .navbar a {
            text-decoration: none;
            color: #172033;
            font-weight: 600;
        }

        .page {
            max-width: 1000px;
            margin: auto;
            padding: 60px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .badge {
            display: inline-block;
            background: #e8edff;
            color: #4361ee;
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
        }

        h1 {
            font-size: 42px;
            margin: 18px 0 10px;
        }

        .header p {
            color: #64748b;
            font-size: 17px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .card h2 {
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d5dbe5;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4361ee;
            box-shadow: 0 0 0 3px rgba(67,97,238,0.12);
        }

        .required {
            color: #e63946;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .back {
            background: white;
            color: #172033;
            border: 1px solid #d5dbe5;
        }

        .next {
            background: #4361ee;
            color: white;
        }

        @media (max-width: 650px) {

            .navbar {
                padding: 15px 5%;
            }

            .navbar nav {
                gap: 12px;
            }

            .navbar nav a {
                font-size: 13px;
            }

            .page {
                padding: 40px 15px;
            }

            h1 {
                font-size: 32px;
            }

            .card {
                padding: 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .actions {
                flex-direction: column-reverse;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }

    </style>

</head>


<body>


<header class="navbar">

    <div class="logo">
        Resume Builder
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="personal.html">
            Resume
        </a>

        <a href="preview.html">
            Preview
        </a>

    </nav>

</header>


<main class="page">


    <div class="header">

        <span class="badge">
            Step 1 of 10
        </span>

        <h1>
            Personal Information
        </h1>

        <p>
            Enter your basic information.
            Fields marked with
            <strong class="required">*</strong>
            are required.
        </p>

    </div>


    <form id="personalForm">


        <div class="card">

            <h2>
                Basic Information
            </h2>


            <div class="form-grid">


                <div class="form-group">

                    <label>
                        First Name
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter your first name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Last Name
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter your last name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Email
                        <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Phone
                        <span class="required">*</span>
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="+91 XXXXX XXXXX"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        City
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Your city"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Country
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="country"
                        placeholder="Your country"
                        required
                    >

                </div>


                <div class="form-group full">

                    <label>
                        Professional Title
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="professionalTitle"
                        placeholder="e.g. Software Developer"
                        required
                    >

                </div>


                <div class="form-group full">

                    <label>
                        LinkedIn Profile
                    </label>

                    <input
                        type="url"
                        id="linkedin"
                        placeholder="https://linkedin.com/in/your-profile"
                    >

                </div>


                <div class="form-group full">

                    <label>
                        Portfolio / Website
                    </label>

                    <input
                        type="url"
                        id="website"
                        placeholder="https://yourwebsite.com"
                    >

                </div>


            </div>

        </div>


        <div class="actions">

            <a
                href="index.html"
                class="btn back"
            >
                ← Back
            </a>


            <button
                type="submit"
                class="btn next"
            >
                Save & Continue →
            </button>

        </div>


    </form>


</main>


<script>

    const savedData =
        JSON.parse(
            localStorage.getItem("resumePersonalData")
        );


    if (savedData) {

        document.getElementById("firstName").value =
            savedData.firstName || "";

        document.getElementById("lastName").value =
            savedData.lastName || "";

        document.getElementById("email").value =
            savedData.email || "";

        document.getElementById("phone").value =
            savedData.phone || "";

        document.getElementById("city").value =
            savedData.city || "";

        document.getElementById("country").value =
            savedData.country || "";

        document.getElementById("professionalTitle").value =
            savedData.professionalTitle || "";

        document.getElementById("linkedin").value =
            savedData.linkedin || "";

        document.getElementById("website").value =
            savedData.website || "";

    }


    document
        .getElementById("personalForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const personalData = {

                firstName:
                    document
                        .getElementById("firstName")
                        .value
                        .trim(),

                lastName:
                    document
                        .getElementById("lastName")
                        .value
                        .trim(),

                email:
                    document
                        .getElementById("email")
                        .value
                        .trim(),

                phone:
                    document
                        .getElementById("phone")
                        .value
                        .trim(),

                city:
                    document
                        .getElementById("city")
                        .value
                        .trim(),

                country:
                    document
                        .getElementById("country")
                        .value
                        .trim(),

                professionalTitle:
                    document
                        .getElementById("professionalTitle")
                        .value
                        .trim(),

                linkedin:
                    document
                        .getElementById("linkedin")
                        .value
                        .trim(),

                website:
                    document
                        .getElementById("website")
                        .value
                        .trim()

            };


            localStorage.setItem(
                "resumePersonalData",
                JSON.stringify(personalData)
            );


            window.location.href =
                "summary.html";

        });

</script>


</body>

</html>
