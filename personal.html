<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personal Information - Resume Builder</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7fb;
    color:#172033;
    min-height:100vh;
}

/* =========================
   NAVBAR
========================= */

.navbar{
    width:100%;
    background:#ffffff;
    border-bottom:1px solid #e5e7eb;
    padding:18px 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:22px;
    font-weight:800;
    color:#172033;
}

.navbar nav{
    display:flex;
    gap:28px;
}

.navbar nav a{
    color:#172033;
    text-decoration:none;
    font-weight:600;
    font-size:15px;
}

.navbar nav a:hover{
    color:#4361ee;
}

/* =========================
   PAGE
========================= */

.page{
    width:100%;
    max-width:1050px;
    margin:auto;
    padding:45px 20px 70px;
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.badge{
    display:inline-block;
    background:#e8edff;
    color:#4361ee;
    padding:8px 16px;
    border-radius:50px;
    font-size:13px;
    font-weight:700;
}

.header h1{
    margin:17px 0 9px;
    font-size:40px;
    font-weight:800;
}

.header p{
    color:#64748b;
    font-size:15px;
}

.required{
    color:#e63946;
}

/* =========================
   CARD
========================= */

.card{
    background:#ffffff;
    border:1px solid #e5e7eb;
    border-radius:18px;
    padding:35px;
    box-shadow:0 10px 35px rgba(15,23,42,.06);
}

.card h2{
    font-size:24px;
    margin-bottom:28px;
}

/* =========================
   FORM
========================= */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:0;
}

.full{
    grid-column:1 / -1;
}

label{
    font-size:15px;
    font-weight:700;
    color:#172033;
}

input,
textarea{
    width:100%;
    height:48px;
    border:1px solid #d5dbe5;
    border-radius:9px;
    background:#ffffff;
    color:#172033;
    padding:0 14px;
    font-size:15px;
    font-family:Arial, Helvetica, sans-serif;
    outline:none;
}

input:focus,
textarea:focus{
    border-color:#4361ee;
    box-shadow:0 0 0 3px rgba(67,97,238,.12);
}

input::placeholder{
    color:#94a3b8;
}

/* =========================
   PHONE
========================= */

.phone-row{
    display:grid;
    grid-template-columns:210px 1fr;
    gap:10px;
}

.phone-number{
    width:100%;
}

.phone-prefix{
    display:flex;
    align-items:center;
    gap:8px;
}

.flag{
    font-size:22px;
    flex-shrink:0;
}

/* =========================
   SEARCHABLE SELECT
========================= */

.search-select{
    position:relative;
    width:100%;
}

.search-select-input{
    width:100%;
    height:48px;
    padding:0 42px 0 14px;
    border:1px solid #d5dbe5;
    border-radius:9px;
    background:#ffffff;
    color:#172033;
    font-family:Arial, Helvetica, sans-serif;
    font-size:15px;
    outline:none;
    cursor:text;
}

.search-select-input:focus{
    border-color:#4361ee;
    box-shadow:0 0 0 3px rgba(67,97,238,.12);
}

.search-select-input:disabled{
    background:#f1f3f7;
    color:#8b95a7;
    cursor:not-allowed;
}

.search-arrow{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    font-size:13px;
    color:#64748b;
    pointer-events:none;
}

.search-options{
    display:none;
    position:absolute;
    top:calc(100% + 5px);
    left:0;
    width:100%;
    max-height:270px;
    overflow-y:auto;
    background:#ffffff;
    border:1px solid #d5dbe5;
    border-radius:9px;
    box-shadow:0 12px 30px rgba(15,23,42,.15);
    z-index:5000;
}

.search-options.open{
    display:block;
}

.search-option{
    padding:12px 14px;
    font-family:Arial, Helvetica, sans-serif;
    font-size:15px;
    color:#172033;
    cursor:pointer;
    transition:.12s;
    display:flex;
    align-items:center;
    gap:9px;
}

.search-option:hover{
    background:#eef2ff;
    color:#3048c8;
}

.search-option.selected{
    background:#e8edff;
    color:#3048c8;
    font-weight:700;
}

.search-empty{
    padding:13px 14px;
    color:#64748b;
    font-family:Arial, Helvetica, sans-serif;
    font-size:14px;
}

.search-disabled{
    background:#f1f3f7;
    color:#8b95a7;
    cursor:not-allowed;
}

/* =========================
   LOCATION STATUS
========================= */

.location-status{
    display:none;
    padding:10px 13px;
    border-radius:8px;
    font-size:13px;
    color:#1d4ed8;
    background:#eff6ff;
    border:1px solid #bfdbfe;
}

.location-status.error{
    color:#b91c1c;
    background:#fef2f2;
    border-color:#fecaca;
}

/* =========================
   MANUAL LOCATION
========================= */

.manual-location{
    display:none;
    padding:18px;
    background:#f8fafc;
    border:1px dashed #cbd5e1;
    border-radius:10px;
}

.manual-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

/* =========================
   ERROR
========================= */

.error-message{
    display:none;
    margin-bottom:20px;
    padding:14px 16px;
    background:#fef2f2;
    border:1px solid #fecaca;
    border-radius:9px;
    color:#b91c1c;
    font-size:14px;
}

/* =========================
   BUTTONS
========================= */

.actions{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-top:25px;
}

.btn{
    min-height:48px;
    padding:12px 25px;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-family:Arial, Helvetica, sans-serif;
}

.back{
    color:#172033;
    background:#ffffff;
    border:1px solid #d5dbe5;
}

.next{
    color:#ffffff;
    background:#4361ee;
    border:none;
}

.next:hover{
    background:#3048c8;
}

.next:disabled{
    opacity:.7;
    cursor:not-allowed;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .navbar{
        padding:15px 5%;
    }

    .navbar nav{
        gap:13px;
    }

    .navbar nav a{
        font-size:13px;
    }

    .page{
        padding:30px 13px 50px;
    }

    .header h1{
        font-size:30px;
    }

    .card{
        padding:22px 17px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .phone-row{
        grid-template-columns:1fr;
    }

    .manual-grid{
        grid-template-columns:1fr;
    }

    .actions{
        flex-direction:column-reverse;
    }

    .btn{
        width:100%;
    }

    .search-options{
        max-height:240px;
    }

}

</style>

</head>


<body>


<header class="navbar">

    <div class="logo">
        Resume Builder
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="personal.html">
            Resume
        </a>

        <a href="preview.html">
            Preview
        </a>

    </nav>

</header>



<main class="page">


<section class="header">

    <span class="badge">
        Step 1 of 10
    </span>

    <h1>
        Personal Information
    </h1>

    <p>
        Enter your personal and contact information.
    </p>

</section>



<form id="personalForm" novalidate>


<div
    id="errorMessage"
    class="error-message">
</div>



<section class="card">


<h2>
    Basic Information
</h2>



<div class="form-grid">


<!-- FIRST NAME -->

<div class="form-group">

<label>
    First Name
    <span class="required">*</span>
</label>

<input
    type="text"
    id="firstName"
    placeholder="Enter your first name"
    required
>

</div>



<!-- LAST NAME -->

<div class="form-group">

<label>
    Last Name
    <span class="required">*</span>
</label>

<input
    type="text"
    id="lastName"
    placeholder="Enter your last name"
    required
>

</div>



<!-- EMAIL -->

<div class="form-group">

<label>
    Email
    <span class="required">*</span>
</label>

<input
    type="email"
    id="email"
    placeholder="you@example.com"
    required
>

</div>



<!-- PHONE -->

<div class="form-group">

<label>
    Mobile Number
    <span class="required">*</span>
</label>


<div class="phone-row">


<div class="phone-prefix">

<span
    id="phoneFlag"
    class="flag">
    🇮🇳
</span>


<div
    class="search-select"
    id="phoneCountryBox"
>

<input
    type="text"
    id="phoneCountryInput"
    class="search-select-input"
    placeholder="Country code"
    autocomplete="off"
>

<span class="search-arrow">
    ▼
</span>

<div
    id="phoneCountryOptions"
    class="search-options">
</div>

</div>

</div>


<input
    type="tel"
    id="mobileNumber"
    class="phone-number"
    placeholder="+91 Mobile number"
    required
>


</div>

</div>



<!-- COUNTRY -->

<div class="form-group">

<label>
    Country
    <span class="required">*</span>
</label>


<div
    class="search-select"
    id="countryBox"
>

<input
    type="text"
    id="countryInput"
    class="search-select-input"
    placeholder="Search country..."
    autocomplete="off"
    required
>

<span class="search-arrow">
    ▼
</span>

<div
    id="countryOptions"
    class="search-options">
</div>

</div>

</div>



<!-- STATE -->

<div class="form-group">

<label>
    State / Province / Region
    <span class="required">*</span>
</label>


<div
    class="search-select"
    id="stateBox"
>

<input
    type="text"
    id="stateInput"
    class="search-select-input search-disabled"
    placeholder="Select country first"
    autocomplete="off"
    disabled
>

<span class="search-arrow">
    ▼
</span>

<div
    id="stateOptions"
    class="search-options">
</div>

</div>

</div>



<!-- DISTRICT CITY -->

<div class="form-group">

<label>
    District / City / Town
    <span class="required">*</span>
</label>


<div
    class="search-select"
    id="districtBox"
>

<input
    type="text"
    id="districtInput"
    class="search-select-input search-disabled"
    placeholder="Select state first"
    autocomplete="off"
    disabled
>

<span class="search-arrow">
    ▼
</span>

<div
    id="districtOptions"
    class="search-options">
</div>

</div>

</div>



<!-- POSTAL -->

<div class="form-group">

<label>
    PIN / ZIP / Postal Code
    <span class="required">*</span>
</label>

<input
    type="text"
    id="postalCode"
    placeholder="PIN / ZIP / Postal code"
    required
>

</div>



<!-- STATUS -->

<div class="form-group full">

<div
    id="locationStatus"
    class="location-status">
</div>

</div>



<!-- MANUAL -->

<div
    id="manualLocation"
    class="manual-location full"
>

<div class="manual-grid">


<div class="form-group">

<label>
    State / Province / Region
</label>

<input
    type="text"
    id="manualState"
    placeholder="Enter state / province / region"
>

</div>



<div class="form-group">

<label>
    District / City / Town
</label>

<input
    type="text"
    id="manualCity"
    placeholder="Enter district / city / town"
>

</div>


</div>

</div>



<!-- PROFESSIONAL TITLE -->

<div class="form-group full">

<label>
    Professional Title
    <span class="required">*</span>
</label>

<input
    type="text"
    id="professionalTitle"
    placeholder="e.g. Software Developer"
    required
>

</div>



<!-- LINKEDIN -->

<div class="form-group full">

<label>
    LinkedIn Profile
</label>

<input
    type="url"
    id="linkedin"
    placeholder="https://linkedin.com/in/your-profile"
>

</div>



<!-- WEBSITE -->

<div class="form-group full">

<label>
    Portfolio / Website
</label>

<input
    type="url"
    id="website"
    placeholder="https://yourwebsite.com"
>

</div>


</div>

</section>



<div class="actions">

<a
    href="index.html"
    class="btn back"
>
    ← Back
</a>


<button
    type="submit"
    class="btn next"
    id="continueButton"
>
    Save & Continue →
</button>

</div>


</form>

</main>

/* =========================================================
   SEARCHABLE DROPDOWN FUNCTION
========================================================= */

function createSearchDropdown(
    input,
    optionsContainer,
    items,
    formatter,
    onSelect
){

    function render(filter=""){

        optionsContainer.innerHTML = "";

        const search =
        filter.trim().toLowerCase();

        const filtered =
        items.filter(function(item){

            return formatter(item)
            .toLowerCase()
            .includes(search);

        });


        if(filtered.length === 0){

            const empty =
            document.createElement("div");

            empty.className =
            "search-empty";

            empty.textContent =
            "No results found";

            optionsContainer.appendChild(
                empty
            );

            return;

        }


        filtered.forEach(function(item){

            const option =
            document.createElement("div");

            option.className =
            "search-option";

            option.innerHTML =
            formatter(item);

            option.addEventListener(
                "mousedown",
                function(event){

                    event.preventDefault();

                    onSelect(item);

                    optionsContainer.classList.remove(
                        "open"
                    );

                }
            );

            optionsContainer.appendChild(
                option
            );

        });

    }


    input.addEventListener(
        "focus",
        function(){

            if(input.disabled){
                return;
            }

            render(input.value);

            optionsContainer.classList.add(
                "open"
            );

        }
    );


    input.addEventListener(
        "input",
        function(){

            if(input.disabled){
                return;
            }

            render(input.value);

            optionsContainer.classList.add(
                "open"
            );

        }
    );


    input.addEventListener(
        "click",
        function(){

            if(input.disabled){
                return;
            }

            render(input.value);

            optionsContainer.classList.add(
                "open"
            );

        }
    );


    input.addEventListener(
        "keydown",
        function(event){

            if(event.key === "Escape"){

                optionsContainer.classList.remove(
                    "open"
                );

            }

        }
    );


    return {
        render
    };

}

/* =========================================================
   STATE DROPDOWN
========================================================= */

let stateDropdown =
null;


async function loadStates(country){

    selectedState =
    null;

    selectedDistrict =
    null;

    stateInput.value = "";

    districtInput.value = "";

    stateInput.disabled =
    true;

    districtInput.disabled =
    true;

    stateInput.classList.add(
        "search-disabled"
    );

    districtInput.classList.add(
        "search-disabled"
    );

    stateInput.placeholder =
    "Loading states...";

    districtInput.placeholder =
    "Select state first";

    manualLocation.style.display =
    "none";

    showStatus(
        "Loading states..."
    );


    try{

        const response =
        await fetch(
            "https://countriesnow.space/api/v0.1/countries/states",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    country:
                    country[1]

                })

            }
        );


        if(!response.ok){
            throw new Error();
        }


        const result =
        await response.json();


        if(
            result.error ||
            !result.data ||
            !result.data.states
        ){

            throw new Error();

        }


        statesData =
        result.data.states
        .sort(function(a,b){

            return a.name.localeCompare(
                b.name
            );

        });


        if(
            stateDropdown
        ){
            stateDropdown.render("");
        }


        stateInput.disabled =
        false;

        stateInput.classList.remove(
            "search-disabled"
        );

        stateInput.placeholder =
        "Search state / province / region...";


        stateDropdown =
        createSearchDropdown(

            stateInput,

            stateOptions,

            statesData,

            function(state){

                return state.name;

            },

            function(state){

                selectedState =
                state;

                stateInput.value =
                state.name;

                loadCities(
                    country,
                    state
                );

            }

        );


        hideStatus();

    }
    catch(error){

        stateInput.value =
        "";

        stateInput.placeholder =
        "Enter state manually";

        districtInput.value =
        "";

        districtInput.placeholder =
        "Enter city manually";

        manualLocation.style.display =
        "block";

        showStatus(
            "State information is temporarily unavailable. Manual location entry is available.",
            true
        );

    }

}


/* =========================================================
   CITY / DISTRICT DROPDOWN
========================================================= */

let districtDropdown =
null;


async function loadCities(
    country,
    state
){

    selectedDistrict =
    null;

    districtInput.value =
    "";

    districtInput.disabled =
    true;

    districtInput.classList.add(
        "search-disabled"
    );

    districtInput.placeholder =
    "Loading cities...";


    showStatus(
        "Loading cities..."
    );


    try{

        const response =
        await fetch(
            "https://countriesnow.space/api/v0.1/countries/state/cities",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    country:
                    country[1],

                    state:
                    state.name

                })

            }
        );


        if(!response.ok){
            throw new Error();
        }


        const result =
        await response.json();


        if(
            result.error ||
            !Array.isArray(result.data)
        ){

            throw new Error();

        }


        citiesData =
        [...new Set(

            result.data
            .map(function(city){

                return String(city).trim();

            })
            .filter(Boolean)

        )]
        .sort(function(a,b){

            return a.localeCompare(b);

        });


        districtDropdown =
        createSearchDropdown(

            districtInput,

            districtOptions,

            citiesData,

            function(city){

                return city;

            },

            function(city){

                selectedDistrict =
                city;

                districtInput.value =
                city;

            }

        );


        districtInput.disabled =
        false;

        districtInput.classList.remove(
            "search-disabled"
        );

        districtInput.placeholder =
        "Search district / city / town...";


        hideStatus();

    }
    catch(error){

        districtInput.value =
        "";

        districtInput.placeholder =
        "Enter city manually";

        districtInput.disabled =
        true;

        districtInput.classList.add(
            "search-disabled"
        );

        manualLocation.style.display =
        "block";

        showStatus(
            "City information is temporarily unavailable. Manual location entry is available.",
            true
        );

    }

}

    error=false
){

    if(error){

        locationStatus.classList.add(

    locationStatus.style.display =

}


function hideStatus(){

    locationStatus.style.display =

}


/* =========================================================
   RESTORE SAVED DATA
========================================================= */

async function restoreData(){

    const saved =
    localStorage.getItem(
        "resumePersonalData"
    );


    if(!saved){
        return;
    }


    try{

        const data =
        JSON.parse(saved);


        document.getElementById(
            "firstName"
        ).value =
        data.firstName || "";


        document.getElementById(
            "lastName"
        ).value =
        data.lastName || "";


        document.getElementById(
            "email"
        ).value =
        data.email || "";


        document.getElementById(
            "mobileNumber"
        ).value =
        data.mobileNumber || "";


        document.getElementById(
            "postalCode"
        ).value =
        data.postalCode || "";


        document.getElementById(
            "professionalTitle"
        ).value =
        data.professionalTitle || "";


        document.getElementById(
            "linkedin"
        ).value =
        data.linkedin || "";


        document.getElementById(
            "website"
        ).value =
        data.website || "";


        if(data.countryCode){

            const country =
            countries.find(function(item){

                return item[0] ===
                data.countryCode;

            });


            if(country){

                selectedCountry =
                country;

                countryInput.value =
                country[2] +
                " " +
                country[1];


                await loadStates(
                    country
                );


                if(data.state){

                    const state =
                    statesData.find(
                        function(item){

                            return (
                                item.name ===
                                data.state
                            );

                        }
                    );


                    if(state){

                        selectedState =
                        state;

                        stateInput.value =
                        state.name;


                        await loadCities(
                            country,
                            state
                        );


                        if(data.district){

                            selectedDistrict =
                            data.district;

                            districtInput.value =
                            data.district;

                        }

                    }

                }

            }

        }


        if(data.phoneCountry){

            const phoneCountry =
            countries.find(
                function(item){

                    return (
                        item[0] ===
                        data.phoneCountry
                    );

                }
            );


            if(phoneCountry){

                selectedPhoneCountry =
                phoneCountry;

                phoneCountryInput.value =
                phoneCountry[2] +
                " " +
                phoneCountry[1] +
                " " +
                phoneCountry[3];

                phoneFlag.textContent =
                phoneCountry[2];

                mobileNumber.placeholder =
                phoneCountry[3] +
                " Mobile number";

            }

        }

    }
    catch(error){

        console.log(
            "Unable to restore saved data."
        );

    }

}

document
.getElementById("personalForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        errorMessage.style.display =
        "none";


        let state =
        selectedState
        ? selectedState.name
        : manualState.value.trim();


        let district =
        selectedDistrict
        ? selectedDistrict
        : manualCity.value.trim();


        const firstName =
        document.getElementById(
            "firstName"
        ).value.trim();


        const lastName =
        document.getElementById(
            "lastName"
        ).value.trim();


        const email =
        document.getElementById(
            "email"
        ).value.trim();


        const mobile =
        mobileNumber.value.trim();


        const postal =
        document.getElementById(
            "postalCode"
        ).value.trim();


        const professionalTitle =
        document.getElementById(
            "professionalTitle"
        ).value.trim();


        const linkedin =
        document.getElementById(
            "linkedin"
        ).value.trim();


        const website =
        document.getElementById(
            "website"
        ).value.trim();


        if(
            !firstName ||
            !lastName ||
            !email ||
            !mobile ||
            !selectedCountry ||
            !state ||
            !district ||
            !postal ||
            !professionalTitle
        ){

            errorMessage.textContent =
            "Please complete all required fields marked with *.";

            errorMessage.style.display =
            "block";

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

            return;

        }


        const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if(
            !emailPattern.test(email)
        ){

            errorMessage.textContent =
            "Please enter a valid email address.";

            errorMessage.style.display =
            "block";

            return;

        }


        const data = {

            firstName:
            firstName,

            lastName:
            lastName,

            email:
            email,

            mobileNumber:
            mobile,

            phoneCountry:
            selectedPhoneCountry
            ? selectedPhoneCountry[0]
            : "",

            phoneCountryName:
            selectedPhoneCountry
            ? selectedPhoneCountry[1]
            : "",

            phoneCountryCode:
            selectedPhoneCountry
            ? selectedPhoneCountry[3]
            : "",

            countryCode:
            selectedCountry[0],

            country:
            selectedCountry[1],

            state:
            state,

            district:
            district,

            postalCode:
            postal,

            professionalTitle:
            professionalTitle,

            linkedin:
            linkedin,

            website:
            website

        };


        localStorage.setItem(
            "resumePersonalData",
            JSON.stringify(data)
        );


        const button =
        document.getElementById(
            "continueButton"
        );


        button.disabled =
        true;


        button.textContent =
        "Saving...";


        setTimeout(
            function(){

                window.location.href =
                "summary.html";

            },
            400
        );

    }
);
