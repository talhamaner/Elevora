<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Personal Information - Resume Builder
    </title>


    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <script src="theme.js"></script>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="nav-inner">

        <a
            href="index.html"
            class="logo"
        >
            Resume Builder
        </a>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="personal.html">
                Resume
            </a>

            <a href="preview.html">
                Preview
            </a>


            <button
                id="themeToggle"
                class="theme-toggle"
                type="button"
            >
                🌙
            </button>

        </div>

    </div>

</nav>



<!-- ================= BUILDER ================= -->

<main class="builder-page">


    <div class="builder-header">

        <span class="badge">
            Step 1 of 10
        </span>


        <h1>
            Personal Information
        </h1>


        <p>
            Tell us how employers can contact you.
        </p>

    </div>



    <!-- STEP BAR -->

    <div class="stepbar">

        <a
            class="step active"
            href="personal.html"
        >
            1<br>
            Personal
        </a>


        <a
            class="step"
            href="summary.html"
        >
            2<br>
            Summary
        </a>


        <div class="step">
            3<br>
            Education
        </div>


        <div class="step">
            4<br>
            Experience
        </div>


        <div class="step">
            5<br>
            Projects
        </div>


        <div class="step">
            6<br>
            Skills
        </div>


        <div class="step">
            7<br>
            Certifications
        </div>


        <div class="step">
            8<br>
            Languages
        </div>


        <div class="step">
            9<br>
            Achievements
        </div>


        <div class="step">
            10<br>
            Cover Letter
        </div>

    </div>



    <!-- FORM -->

    <div class="form-card">

        <form id="personalForm">


            <div class="form-grid">


                <!-- FIRST NAME -->

                <div class="form-group">

                    <label>
                        First Name
                        <span class="required">*</span>
                    </label>

                    <input
                        id="firstName"
                        type="text"
                        required
                    >

                </div>



                <!-- LAST NAME -->

                <div class="form-group">

                    <label>
                        Last Name
                        <span class="required">*</span>
                    </label>

                    <input
                        id="lastName"
                        type="text"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Email
                        <span class="required">*</span>
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="example@email.com"
                        required
                    >

                </div>



                <!-- PHONE CODE -->

                <div class="form-group">

                    <label>
                        Mobile Number
                        <span class="required">*</span>
                    </label>


                    <div
                        style="
                            display:grid;
                            grid-template-columns:180px 1fr;
                            gap:10px;
                        "
                    >


                        <div
                            class="search-select"
                            style="position:relative"
                        >

                            <input
                                id="phoneCode"
                                type="text"
                                placeholder="Country code"
                                autocomplete="off"
                                required
                            >

                            <div
                                id="phoneOptions"
                                class="search-options"
                            ></div>

                        </div>


                        <input
                            id="mobile"
                            type="tel"
                            placeholder="Mobile number"
                            required
                        >

                    </div>

                </div>



                <!-- COUNTRY -->

                <div class="form-group">

                    <label>
                        Country
                        <span class="required">*</span>
                    </label>


                    <div
                        class="search-select"
                        style="position:relative"
                    >

                        <input
                            id="country"
                            type="text"
                            placeholder="Search country"
                            autocomplete="off"
                            required
                        >


                        <div
                            id="countryOptions"
                            class="search-options"
                        ></div>

                    </div>

                </div>



                <!-- STATE -->

                <div class="form-group">

                    <label>
                        State / Province / Region
                    </label>


                    <select id="state">

                        <option value="">
                            Select state / region
                        </option>

                    </select>

                </div>



                <!-- CITY -->

                <div class="form-group">

                    <label>
                        District / City / Town
                    </label>


                    <select id="city">

                        <option value="">
                            Select city / town
                        </option>

                    </select>

                </div>



                <!-- POSTAL -->

                <div class="form-group">

                    <label>
                        Postal Code
                    </label>

                    <input
                        id="postalCode"
                        type="text"
                    >

                </div>



                <!-- PROFESSIONAL TITLE -->

                <div class="form-group">

                    <label>
                        Professional Title
                        <span class="required">*</span>
                    </label>

                    <input
                        id="professionalTitle"
                        type="text"
                        placeholder="e.g. Software Developer"
                        required
                    >

                </div>



                <!-- LINKEDIN -->

                <div class="form-group">

                    <label>
                        LinkedIn
                    </label>

                    <input
                        id="linkedin"
                        type="url"
                        placeholder="https://linkedin.com/in/..."
                    >

                </div>



                <!-- WEBSITE -->

                <div class="form-group">

                    <label>
                        Website / Portfolio
                    </label>

                    <input
                        id="website"
                        type="url"
                        placeholder="https://..."
                    >

                </div>


            </div>



            <!-- ACTIONS -->

            <div class="form-actions">

                <a
                    href="index.html"
                    class="btn btn-secondary"
                >
                    ← Back
                </a>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save & Continue →
                </button>

            </div>


        </form>

    </div>

</main>



<script src="js/app.js"></script>


<script>

/* =====================================================
   COUNTRY DATA
===================================================== */

const countries = [

    ["India", "+91", "🇮🇳"],
    ["United States", "+1", "🇺🇸"],
    ["Canada", "+1", "🇨🇦"],
    ["United Kingdom", "+44", "🇬🇧"],
    ["Australia", "+61", "🇦🇺"],
    ["Germany", "+49", "🇩🇪"],
    ["France", "+33", "🇫🇷"],
    ["Italy", "+39", "🇮🇹"],
    ["Spain", "+34", "🇪🇸"],
    ["United Arab Emirates", "+971", "🇦🇪"],
    ["Saudi Arabia", "+966", "🇸🇦"],
    ["Singapore", "+65", "🇸🇬"],
    ["Japan", "+81", "🇯🇵"],
    ["China", "+86", "🇨🇳"],
    ["South Korea", "+82", "🇰🇷"],
    ["Brazil", "+55", "🇧🇷"],
    ["Mexico", "+52", "🇲🇽"],
    ["South Africa", "+27", "🇿🇦"],
    ["New Zealand", "+64", "🇳🇿"],
    ["Ireland", "+353", "🇮🇪"],
    ["Netherlands", "+31", "🇳🇱"],
    ["Switzerland", "+41", "🇨🇭"],
    ["Sweden", "+46", "🇸🇪"],
    ["Norway", "+47", "🇳🇴"],
    ["Denmark", "+45", "🇩🇰"],
    ["Finland", "+358", "🇫🇮"],
    ["Belgium", "+32", "🇧🇪"],
    ["Austria", "+43", "🇦🇹"],
    ["Portugal", "+351", "🇵🇹"],
    ["Malaysia", "+60", "🇲🇾"],
    ["Thailand", "+66", "🇹🇭"],
    ["Indonesia", "+62", "🇮🇩"],
    ["Philippines", "+63", "🇵🇭"],
    ["Pakistan", "+92", "🇵🇰"],
    ["Bangladesh", "+880", "🇧🇩"],
    ["Nepal", "+977", "🇳🇵"],
    ["Sri Lanka", "+94", "🇱🇰"],
    ["Nigeria", "+234", "🇳🇬"],
    ["Kenya", "+254", "🇰🇪"],
    ["Egypt", "+20", "🇪🇬"],
    ["Turkey", "+90", "🇹🇷"],
    ["Israel", "+972", "🇮🇱"],
    ["Poland", "+48", "🇵🇱"],
    ["Greece", "+30", "🇬🇷"],
    ["Romania", "+40", "🇷🇴"],
    ["Ukraine", "+380", "🇺🇦"],
    ["Vietnam", "+84", "🇻🇳"],
    ["Qatar", "+974", "🇶🇦"],
    ["Kuwait", "+965", "🇰🇼"],
    ["Oman", "+968", "🇴🇲"]

];


const countryNames =
    countries.map(
        country => country[0]
    );


/* =====================================================
   SEARCHABLE DROPDOWN
===================================================== */

function setupSearch(
    inputId,
    optionsId,
    items,
    callback
) {

    const input =
        document.getElementById(inputId);

    const options =
        document.getElementById(optionsId);


    function render() {

        const search =
            input.value.toLowerCase();


        options.innerHTML = "";


        items
            .filter(item =>
                item.toLowerCase().includes(search)
            )
            .slice(0, 40)
            .forEach(item => {

                const button =
                    document.createElement("button");


                button.type =
                    "button";


                button.textContent =
                    item;


                button.addEventListener(
                    "click",
                    function () {

                        input.value =
                            item;

                        options.classList.remove(
                            "open"
                        );

                        if (callback) {
                            callback(item);
                        }
                    }
                );


                options.appendChild(
                    button
                );

            });


        options.classList.add(
            "open"
        );
    }


    input.addEventListener(
        "focus",
        render
    );


    input.addEventListener(
        "input",
        render
    );


    document.addEventListener(
        "click",
        function (event) {

            if (
                !event.target.closest(
                    ".search-select"
                )
            ) {

                options.classList.remove(
                    "open"
                );
            }

        }
    );
}


/* =====================================================
   SAVED DATA
===================================================== */

const saved =
    getSection(
        "personal",
        {}
    );


function setValue(
    id,
    value
) {

    const element =
        document.getElementById(id);

    if (element) {
        element.value =
            value || "";
    }
}


setValue(
    "firstName",
    saved.firstName
);


setValue(
    "lastName",
    saved.lastName
);


setValue(
    "email",
    saved.email
);


setValue(
    "phoneCode",
    saved.phoneCode
);


setValue(
    "mobile",
    saved.mobile
);


setValue(
    "country",
    saved.country
);


setValue(
    "postalCode",
    saved.postalCode
);


setValue(
    "professionalTitle",
    saved.professionalTitle
);


setValue(
    "linkedin",
    saved.linkedin
);


setValue(
    "website",
    saved.website
);


/* =====================================================
   PHONE SEARCH
===================================================== */

setupSearch(
    "phoneCode",
    "phoneOptions",
    countries.map(
        country =>
            `${country[2]} ${country[0]} ${country[1]}`
    ),
    function (value) {

        const selected =
            countries.find(
                country =>
                    value.includes(
                        country[0]
                    )
            );


        if (selected) {

            document.getElementById(
                "phoneCode"
            ).value =
                `${selected[2]} ${selected[0]} ${selected[1]}`;
        }
    }
);


/* =====================================================
   COUNTRY SEARCH
===================================================== */

setupSearch(
    "country",
    "countryOptions",
    countryNames,
    function (country) {

        loadStates(country);

    }
);


/* =====================================================
   LOAD STATES
===================================================== */

async function loadStates(
    country
) {

    try {

        const response =
            await fetch(
                "https://countriesnow.space/api/v0.1/countries/states",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            country:
                                country
                        })
                }
            );


        const result =
            await response.json();


        const state =
            document.getElementById(
                "state"
            );


        state.innerHTML =
            `
            <option value="">
                Select state / region
            </option>
            `;


        const states =
            result.data &&
            result.data.states
                ? result.data.states
                : [];


        states.forEach(
            function (item) {

                state.add(
                    new Option(
                        item.name,
                        item.name
                    )
                );

            }
        );


        if (saved.state) {

            state.value =
                saved.state;

            loadCities(
                country,
                saved.state
            );
        }

    } catch (error) {

        console.log(
            "State loading failed:",
            error
        );
    }
}


/* =====================================================
   LOAD CITIES
===================================================== */

async function loadCities(
    country,
    stateName
) {

    const city =
        document.getElementById(
            "city"
        );


    city.innerHTML =
        `
        <option value="">
            Select city / town
        </option>
        `;


    if (!stateName) {
        return;
    }


    try {

        const response =
            await fetch(
                "https://countriesnow.space/api/v0.1/countries/state/cities",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            country:
                                country,

                            state:
                                stateName
                        })
                }
            );


        const result =
            await response.json();


        const cities =
            result.data || [];


        cities.forEach(
            function (item) {

                city.add(
                    new Option(
                        item,
                        item
                    )
                );

            }
        );


        if (saved.city) {

            city.value =
                saved.city;
        }

    } catch (error) {

        console.log(
            "City loading failed:",
            error
        );
    }
}


/* =====================================================
   STATE CHANGE
===================================================== */

document
    .getElementById("state")
    .addEventListener(
        "change",
        function () {

            loadCities(
                document.getElementById(
                    "country"
                ).value,

                this.value
            );

        }
    );


/* =====================================================
   INITIAL COUNTRY
===================================================== */

if (saved.country) {

    loadStates(
        saved.country
    );
}


/* =====================================================
   SAVE PERSONAL INFORMATION
===================================================== */

document
    .getElementById("personalForm")
    .addEventListener(
        "submit",
        function (event) {

            event.preventDefault();


            const data = {

                firstName:
                    document.getElementById(
                        "firstName"
                    ).value.trim(),

                lastName:
                    document.getElementById(
                        "lastName"
                    ).value.trim(),

                email:
                    document.getElementById(
                        "email"
                    ).value.trim(),

                phoneCode:
                    document.getElementById(
                        "phoneCode"
                    ).value.trim(),

                mobile:
                    document.getElementById(
                        "mobile"
                    ).value.trim(),

                country:
                    document.getElementById(
                        "country"
                    ).value.trim(),

                state:
                    document.getElementById(
                        "state"
                    ).value,

                city:
                    document.getElementById(
                        "city"
                    ).value,

                postalCode:
                    document.getElementById(
                        "postalCode"
                    ).value.trim(),

                professionalTitle:
                    document.getElementById(
                        "professionalTitle"
                    ).value.trim(),

                linkedin:
                    document.getElementById(
                        "linkedin"
                    ).value.trim(),

                website:
                    document.getElementById(
                        "website"
                    ).value.trim()
            };


            saveSection(
                "personal",
                data
            );


            window.location.href =
                "summary.html";
        }
    );

</script>


</body>

</html>
