<script>

const savedPersonal =
    JSON.parse(
        localStorage.getItem("resumePersonalData")
    );


if (savedPersonal) {

    document.getElementById("firstName").value =
        savedPersonal.firstName || "";

    document.getElementById("lastName").value =
        savedPersonal.lastName || "";

    document.getElementById("email").value =
        savedPersonal.email || "";

    document.getElementById("phone").value =
        savedPersonal.phone || "";

    document.getElementById("city").value =
        savedPersonal.city || "";

    document.getElementById("country").value =
        savedPersonal.country || "";

    document.getElementById("professionalTitle").value =
        savedPersonal.professionalTitle || "";

    document.getElementById("linkedin").value =
        savedPersonal.linkedin || "";

    document.getElementById("website").value =
        savedPersonal.website || "";

}


document
    .getElementById("personalForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const personalData = {

            firstName:
                document.getElementById("firstName")
                .value
                .trim(),

            lastName:
                document.getElementById("lastName")
                .value
                .trim(),

            email:
                document.getElementById("email")
                .value
                .trim(),

            phone:
                document.getElementById("phone")
                .value
                .trim(),

            city:
                document.getElementById("city")
                .value
                .trim(),

            country:
                document.getElementById("country")
                .value
                .trim(),

            professionalTitle:
                document
                    .getElementById("professionalTitle")
                    .value
                    .trim(),

            linkedin:
                document.getElementById("linkedin")
                .value
                .trim(),

            website:
                document.getElementById("website")
                .value
                .trim()

        };


        localStorage.setItem(
            "resumePersonalData",
            JSON.stringify(personalData)
        );


        window.location.href = "summary.html";

    });

</script>
